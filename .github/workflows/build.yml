name: Build Windows + Mac

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    tags: ['v*']            # pushing a tag like v2.6.16 also creates/updates a Release

# Each OS job builds its own installer and uploads it DIRECTLY to the tag's Release
# (softprops). We do NOT use actions/upload-artifact anymore — that consumed the
# Actions artifact-storage quota and broke releases once it filled up. Publishing
# straight to the Release sidesteps that quota entirely.
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build config (inject token from repo secret, blank Samsara secrets)
        env:
          GH_RELEASES_PAT: ${{ secrets.GH_RELEASES_PAT }}
        run: node -e "const fs=require('fs');const raw=fs.readFileSync('newmile.config.template.json','utf8').replace(/^﻿/,'');const c=JSON.parse(raw);c.samsara.tokens.forEach(t=>t.token='');if(c.github)c.github.token=process.env.GH_RELEASES_PAT||'';fs.writeFileSync('newmile.config.json',JSON.stringify(c,null,2));console.log('config ready');"
      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --x64 --publish never
      - name: Publish exe to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: 'Milestone Load Board / Milestone OS — Windows portable .exe + Mac universal .dmg. Internal use only (Miles Ahead Brands).'

  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build config (inject token from repo secret, blank Samsara secrets)
        env:
          GH_RELEASES_PAT: ${{ secrets.GH_RELEASES_PAT }}
        run: node -e "const fs=require('fs');const raw=fs.readFileSync('newmile.config.template.json','utf8').replace(/^﻿/,'');const c=JSON.parse(raw);c.samsara.tokens.forEach(t=>t.token='');if(c.github)c.github.token=process.env.GH_RELEASES_PAT||'';fs.writeFileSync('newmile.config.json',JSON.stringify(c,null,2));console.log('config ready');"
      - name: Build universal dmg (Apple Silicon + Intel, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: Publish dmg to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: 'Milestone Load Board / Milestone OS — Windows portable .exe + Mac universal .dmg. Internal use only (Miles Ahead Brands).'
