name: Build Windows + Mac

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      version:
        description: 'Version to tag + release, e.g. 2.6.56 (blank = just build, publish nothing)'
        default: ''
  push:
    tags: ['v*']            # pushing a tag like v2.6.16 also creates/updates a Release

# Each OS job builds its own installer and uploads it DIRECTLY to the tag's Release
# (softprops). We do NOT use actions/upload-artifact anymore — that consumed the
# Actions artifact-storage quota and broke releases once it filled up. Publishing
# straight to the Release sidesteps that quota entirely.

# RELEASING WITHOUT PUSHING A TAG: "Run workflow" with a version fills RELEASE_TAG, and
# softprops CREATES that tag + Release on the built commit using the job's own GITHUB_TOKEN.
# That makes a release possible from the Actions tab alone (no local git tag push, which some
# tokens are not scoped for). Pushing a v* tag still works exactly as before: RELEASE_TAG is
# empty and softprops falls back to the pushed tag.
env:
  RELEASE_TAG: ${{ github.event.inputs.version && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || '' }}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build config (inject token from repo secret, blank Samsara secrets)
        env:
          GH_RELEASES_PAT: ${{ secrets.GH_RELEASES_PAT }}
        run: node -e "const fs=require('fs');const raw=fs.readFileSync('newmile.config.template.json','utf8').replace(/^﻿/,'');const c=JSON.parse(raw);c.samsara.tokens.forEach(t=>t.token='');if(c.github)c.github.token=process.env.GH_RELEASES_PAT||'';fs.writeFileSync('newmile.config.json',JSON.stringify(c,null,2));console.log('config ready');"
      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --x64 --publish never
      - name: Publish exe to the Release
        if: startsWith(github.ref, 'refs/tags/') || env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.exe
          body: 'Milestone Load Board / Milestone OS — Windows portable .exe + Mac universal .dmg. Internal use only (Miles Ahead Brands).'

  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build config (inject token from repo secret, blank Samsara secrets)
        env:
          GH_RELEASES_PAT: ${{ secrets.GH_RELEASES_PAT }}
        run: node -e "const fs=require('fs');const raw=fs.readFileSync('newmile.config.template.json','utf8').replace(/^﻿/,'');const c=JSON.parse(raw);c.samsara.tokens.forEach(t=>t.token='');if(c.github)c.github.token=process.env.GH_RELEASES_PAT||'';fs.writeFileSync('newmile.config.json',JSON.stringify(c,null,2));console.log('config ready');"
      - name: Build universal dmg (Apple Silicon + Intel, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: Publish dmg to the Release
        if: startsWith(github.ref, 'refs/tags/') || env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.dmg
          body: 'Milestone Load Board / Milestone OS — Windows portable .exe + Mac universal .dmg. Internal use only (Miles Ahead Brands).'
