# Deploy del Cactus Tracker a Azure App Service.
#
# Requisitos (una vez, en el navegador):
#  1. Crear la Web App en el portal de Azure (Linux, Node 22 LTS, plan F1 gratis).
#  2. En la app: Overview → "Download publish profile" (si sale gris: Configuration →
#     General settings → SCM Basic Auth = On → Save, y reintentar).
#  3. En GitHub: Settings → Secrets and variables → Actions → New repository secret
#     AZURE_WEBAPP_PUBLISH_PROFILE = contenido completo del archivo descargado.
#  4. Si la app NO se llama cactus-tracker-mab: en la pestaña Variables crear
#     AZURE_WEBAPP_NAME con el nombre real.
#
# Después: cada push a la rama del tracker despliega solo, o córrelo a mano desde
# la pestaña Actions (Run workflow).
name: Deploy Cactus Tracker
on:
  push:
    branches: [claude/planning-tool-strategy-k3pvy9, master]
    paths: ['apps/cactus-tracker/**', '.github/workflows/deploy-cactus-tracker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # node:sqlite es built-in y express es JS puro: el node_modules va en el zip
      # y App Service no necesita build (arranca con npm start del package.json).
      - name: Install production deps
        working-directory: apps/cactus-tracker
        run: npm install --omit=dev --no-audit --no-fund

      # Escribe la config privada en /home/data/config.json (disco persistente) via la
      # API de Kudu, ANTES del deploy para que el reinicio la cargue: PIN de equipo y
      # tokens de Samsara desde secrets del repo. Merge-safe: no pisa otras llaves.
      - name: Set team PIN + Samsara tokens
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          PIN: ${{ secrets.ACCESS_PIN }}
          TOK_CACTUS: ${{ secrets.SAMSARA_TOKEN_CACTUS }}
          TOK_CKJ: ${{ secrets.SAMSARA_TOKEN_CKJ }}
        run: |
          python3 - <<'EOF'
          import os, re, json, base64, urllib.request
          prof = os.environ['PROFILE']
          pin = os.environ.get('PIN') or '2585'
          host = re.search(r'publishUrl="([^"]*\.scm\.[^":]*)', prof).group(1)
          user = re.search(r'userName="(\$[^"]+)"', prof).group(1)
          pwd = re.search(r'userPWD="([^"]+)"', prof).group(1)
          auth = base64.b64encode(f'{user}:{pwd}'.encode()).decode()
          def req(method, path, data=None, hdrs=None):
              r = urllib.request.Request(f'https://{host}{path}', data=data, method=method)
              r.add_header('Authorization', 'Basic ' + auth)
              for k, v in (hdrs or {}).items(): r.add_header(k, v)
              try: return urllib.request.urlopen(r, timeout=60).read()
              except Exception as e: return getattr(e, 'read', lambda: b'')()
          try: cur = json.loads(req('GET', '/api/vfs/data/config.json') or b'{}')
          except Exception: cur = {}
          if not isinstance(cur, dict): cur = {}
          cur['accessPin'] = pin
          toks = [{'name': n, 'token': os.environ.get(k, '')}
                  for k, n in [('TOK_CACTUS', 'Cactus Express'), ('TOK_CKJ', 'CKJ Transport')]
                  if os.environ.get(k)]
          if toks:
              cur.setdefault('samsara', {})
              keep = [t for t in cur['samsara'].get('tokens', []) if t.get('name') not in [x['name'] for x in toks]]
              cur['samsara']['tokens'] = toks + keep
          req('PUT', '/api/vfs/data/')  # asegura el directorio
          req('PUT', '/api/vfs/data/config.json', data=json.dumps(cur, indent=1).encode(),
              hdrs={'If-Match': '*', 'Content-Type': 'application/json'})
          print('config listo: PIN' + (' + %d tokens de Samsara' % len(toks) if toks else ' (sin tokens aun)'))
          EOF

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'cactus-tracker-mab' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: apps/cactus-tracker
