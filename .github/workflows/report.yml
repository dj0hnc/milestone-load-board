name: MAB Reports

# Sends the morning (7:30am CT, catch-up until noon) no-show report and the night (8pm CT,
# catch-up until midnight) fleet-assignment report from GitHub's cloud — never depends on
# any PC. Reuses the exact app logic (report-engine/).
#
# SCHEDULING: GitHub cron fires with unpredictable delays (observed 2-9 HOURS on this repo),
# which used to send the night report at 4am and the morning report at noon. Fix: trigger twice
# an hour and let the run decide by the ACTUAL Central hour. Each report has a CATCH-UP window,
# not a 2-hour one — morning sends any time 7-11am CT while unsent, night any time 8-11pm CT —
# so a badly delayed cron run still rescues the report instead of skipping the day (which is
# what happened on 2026-07-09/10 when the external pinger died and no cron run landed inside
# the old 2-hour windows). The once-per-day lock (report-engine .state/last-sent.json, kept in
# the Actions cache) guarantees each report goes out at most once per day even if several runs
# land in the same window.
#
# OFF-APP SUBS: scheduled runs read the repo VARIABLE `MAB_OFFSUBS` (Settings -> Secrets and
# variables -> Actions -> Variables tab). Edit it any time; the next report uses it. Manual runs
# can override it with the workflow input.
#
# The self-rotating NewMile token lives in the Actions CACHE (never committed, so it is NOT
# readable via the bundled read-only PAT); it is seeded from the MAB_NM_TOKEN secret.
# Manual runs: Actions tab -> "MAB Reports" -> Run workflow (pick morning/night, set OFF-APP).

on:
  schedule:
    - cron: '11,41 * * * *'        # twice an hour; the job itself gates on the real Central hour
    # GitHub starves scheduled runs hardest in the 01:00-05:00 UTC band (US evening peak) — the
    # night reports of 7/10 and 7/11 were missed entirely because no run landed inside the whole
    # 4-hour window. Fire every 15 min during the window hours (both DST offsets) to buy more
    # lottery tickets; out-of-window runs exit in seconds and the once-per-day lock dedupes.
    - cron: '*/15 1-6,12-17 * * *'
  # PUSH PINGER: pushing these branches fires the send immediately — punctual and immune to
  # GitHub's schedule starvation. A daily Claude Routine pushes them at ~7:35am / ~8:05pm CT
  # (pure git, no API token needed). Early pings sleep until the window opens; the once-per-day
  # lock still dedupes against the schedule.
  push:
    branches: ['ping/morning', 'ping/night']
  workflow_dispatch:
    inputs:
      kind:
        description: 'Report to run'
        type: choice
        options: [morning, night]
        default: night
      offsubs:
        description: 'OFF-APP subs count (blank = use the MAB_OFFSUBS variable)'
        default: ''
      force:
        description: 'true = resend even if already sent today (manual tests). External pingers leave this blank so the once-per-day lock dedupes.'
        default: ''
      preview:
        description: 'true = DRY RUN: build the report and print the full list to the log, send NO email.'
        default: ''

concurrency:
  group: mab-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # restore the rotating token/lock from cache (most recent mab-state-* entry)
      - uses: actions/cache/restore@v4
        with:
          path: report-engine/.state
          key: mab-state-${{ github.run_id }}
          restore-keys: |
            mab-state-
      - name: Generate + send report
        env:
          MAB_NM_CONFIG: ${{ secrets.MAB_NM_CONFIG }}
          MAB_NM_TOKEN: ${{ secrets.MAB_NM_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # off-app precedence lives in report-cli resolveOffSubs(): manual input > office server > variable
          MAB_OFFSUBS_INPUT: ${{ github.event.inputs.offsubs }}
          MAB_OFFSUBS: ${{ vars.MAB_OFFSUBS || '0' }}
          MAB_OFFICE_URL: https://bullion-magician-prancing.ngrok-free.dev
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # PREVIEW = dry run: build + print the full report to the log, send NO email. No --send,
            # so the once-per-day lock is never touched and no recipient/Resend key is needed.
            if [ "${{ github.event.inputs.preview }}" = "true" ]; then
              node report-engine/report-cli.js "${{ github.event.inputs.kind }}"
            # external pingers (cron-job.org at 7:00am/8:00pm CT) leave force blank → the once-per-day
            # lock still dedupes against the hourly GitHub-cron backup. Set force=true only for tests.
            elif [ "${{ github.event.inputs.force }}" = "true" ]; then
              node report-engine/report-cli.js "${{ github.event.inputs.kind }}" --send --force
            else
              node report-engine/report-cli.js "${{ github.event.inputs.kind }}" --send
            fi
          else
            HOUR=$(TZ=America/Chicago date +%H); HOUR=$((10#$HOUR))
            MIN=$(TZ=America/Chicago date +%M); MIN=$((10#$MIN))
            NOWM=$((HOUR*60+MIN))
            if [ "${{ github.event_name }}" = "push" ]; then
              # ping branch push: the branch name IS the report kind. If the ping lands a bit
              # early (DST shifts the pinger's UTC schedule by an hour), sleep until the window
              # opens so the send time stays exact; ignore pings far outside the window.
              case "${{ github.ref }}" in
                refs/heads/ping/morning) KIND=morning; START=$((7*60+30)); END=$((11*60+59));;
                refs/heads/ping/night)   KIND=night;   START=$((20*60));   END=$((23*60+59));;
                *) echo "not a ping branch"; exit 0;;
              esac
              if [ "$NOWM" -lt "$START" ] && [ $((START-NOWM)) -le 90 ]; then
                echo "ping arrived early ($HOUR:$MIN CT) — sleeping $((START-NOWM)) min until the window opens"
                sleep $(( (START-NOWM)*60 ))
              elif [ "$NOWM" -lt "$START" ] || [ "$NOWM" -gt "$END" ]; then
                echo "ping at $HOUR:$MIN CT is outside the $KIND window — ignoring"
                exit 0
              fi
            # CATCH-UP windows: wide on purpose. The once-per-day lock means only the FIRST run
            # inside the window actually sends; the width only buys tolerance to cron delays.
            # Morning goes out at/after 7:30am CT (gives drivers a little more time to start their
            # first load so the no-show list reflects reality), catch-up until noon. Night 8pm-midnight.
            elif { [ "$HOUR" -eq 7 ] && [ "$MIN" -ge 30 ]; } || { [ "$HOUR" -ge 8 ] && [ "$HOUR" -le 11 ]; }; then
              KIND=morning
            elif [ "$HOUR" -ge 20 ] && [ "$HOUR" -le 23 ]; then
              KIND=night
            else
              echo "Central time $HOUR:$MIN is outside the send windows (7:30-11:59am morning, 8pm-11:59pm night) — nothing to do"
              exit 0
            fi
            # OFFICE PC IS THE PUNCTUAL PRIMARY (sends 7:00/20:00 CT on the minute). The cloud is the
            # BACKUP: ask the office first. Already sent -> stay quiet. Office UP but not sent yet
            # during the primary hour (7/20) -> give it the hour. Office DOWN (unreachable) or still
            # unsent in any later hour of the window -> the cloud sends. The once-per-day cache lock
            # still dedupes multiple backup runs.
            STATE=$(curl -s -m 12 -H 'ngrok-skip-browser-warning: true' "https://bullion-magician-prancing.ngrok-free.dev/reportstate?kind=$KIND" || true)
            echo "office state: ${STATE:-unreachable}"
            if echo "$STATE" | grep -q '"sentToday":true'; then
              echo "office already sent the $KIND report today — cloud stays quiet"
              exit 0
            fi
            if { [ "$HOUR" -eq 7 ] || [ "$HOUR" -eq 20 ]; } && echo "$STATE" | grep -q '"emailConfigured":true'; then
              echo "office is UP and will send within its hour — cloud waits (backup hour is next)"
              exit 0
            fi
            echo "scheduled run - Central hour $HOUR -> $KIND (cloud covering: office down or unsent)"
            node report-engine/report-cli.js "$KIND" --send
          fi
      # save the rotated token/lock back to cache for the next run
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: report-engine/.state
          key: mab-state-${{ github.run_id }}
