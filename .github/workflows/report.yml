name: MAB Reports
# the kind in the run title lets runs find live RELAY runs via the API (see the relay block)
run-name: "MAB Reports · ${{ github.event.inputs.kind || github.event_name }}"

# Sends the morning (7:30am CT, catch-up until noon) no-show report and the night (8pm CT,
# catch-up until midnight) fleet-assignment report from GitHub's cloud — never depends on
# any PC. Reuses the exact app logic (report-engine/).
#
# SCHEDULING: GitHub cron fires with unpredictable delays (observed 2-9 HOURS on this repo),
# which used to send the night report at 4am and the morning report at noon. Fix: trigger twice
# an hour and let the run decide by the ACTUAL Central hour. Each report has a CATCH-UP window,
# not a 2-hour one — morning sends any time 7-11am CT while unsent, night any time 8-11pm CT —
# so a badly delayed cron run still rescues the report instead of skipping the day (which is
# what happened on 2026-07-09/10 when the external pinger died and no cron run landed inside
# the old 2-hour windows). The once-per-day lock (report-engine .state/last-sent.json, kept in
# the Actions cache) guarantees each report goes out at most once per day even if several runs
# land in the same window.
#
# OFF-APP SUBS: scheduled runs read the repo VARIABLE `MAB_OFFSUBS` (Settings -> Secrets and
# variables -> Actions -> Variables tab). Edit it any time; the next report uses it. Manual runs
# can override it with the workflow input.
#
# The self-rotating NewMile token lives in the Actions CACHE (never committed, so it is NOT
# readable via the bundled read-only PAT); it is seeded from the MAB_NM_TOKEN secret.
# Manual runs: Actions tab -> "MAB Reports" -> Run workflow (pick morning/night, set OFF-APP).

on:
  schedule:
    # Every 15 minutes, all day. GitHub starves schedules for HOURS at a time and the starved
    # band keeps drifting (7-9pm CT first, then whole mornings on 9/21-9/23) — so crons are
    # NOT trusted to send anything on time anymore. Their job is (a) to BOOTSTRAP the RELAY
    # chain (see the relay block in the run step) whenever it broke, and (b) catch-up backup
    # inside the send windows. Out-of-window runs exit in seconds, the once-per-day lock
    # dedupes, and the repo is public so runner minutes are free.
    - cron: '*/15 * * * *'
  # PUSH PINGER: pushing these branches fires the send immediately — punctual and immune to
  # GitHub's schedule starvation. A daily Claude Routine pushes them at ~7:35am / ~8:05pm CT
  # (pure git, no API token needed). Early pings sleep until the window opens; the once-per-day
  # lock still dedupes against the schedule.
  push:
    branches: ['ping/morning', 'ping/night', 'ping/sf']
  workflow_dispatch:
    inputs:
      kind:
        description: 'Report to run (sf = weekly service failures + GP of lost loads, last Mon-Sat; sftrend = multi-week trend printed to the log, never emails)'
        type: choice
        options: [morning, night, recheck, sf, sftrend, relay]
        default: night
      offsubs:
        description: 'OFF-APP subs count (blank = use the MAB_OFFSUBS variable)'
        default: ''
      force:
        description: 'true = resend even if already sent today (manual tests). External pingers leave this blank so the once-per-day lock dedupes.'
        default: ''
      preview:
        description: 'true = DRY RUN: build the report and print the full list to the log, send NO email.'
        default: ''
      weeks:
        description: 'sftrend only: how many Mon-Sat weeks back to chart (default 6).'
        default: ''

concurrency:
  # previews get their own lane so a dry run never queues behind anything; RELAY runs sleep
  # for hours, so each gets its own lane too — manual sends and crons must never queue
  # behind one (the relay self-dedups via the API instead, oldest run id wins)
  group: mab-reports-${{ github.event.inputs.preview == 'true' && 'preview' || (github.event.inputs.kind == 'relay' && format('relay-{0}', github.run_id) || 'send') }}
  cancel-in-progress: false

# actions:write lets a relay run dispatch its successor with the built-in GITHUB_TOKEN
# (workflow_dispatch is exempt from GitHub's no-recursive-runs rule)
permissions:
  contents: read
  actions: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # restore the rotating token/lock from cache (most recent mab-state-* entry)
      - uses: actions/cache/restore@v4
        with:
          path: report-engine/.state
          key: mab-state-${{ github.run_id }}
          restore-keys: |
            mab-state-
      # PDF renderer for the weekly sf report: puppeteer-core into its own prefix (a plain
      # `npm i --no-save` here would drag in the app's full dependency tree, electron included)
      # + the runner's preinstalled Chrome. Never downloads a browser. If this step or the
      # render fails, the sf email still goes out with the CSVs only.
      - name: PDF renderer dep
        run: npm i --prefix /tmp/pdfdep --no-audit --no-fund puppeteer-core@24 || echo "puppeteer-core install failed — sf email will skip the PDF"
      - name: Generate + send report
        env:
          MAB_NM_CONFIG: ${{ secrets.MAB_NM_CONFIG }}
          MAB_NM_TOKEN: ${{ secrets.MAB_NM_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # optional separate list for the weekly Service Failure + GP report (falls back to REPORT_TO)
          REPORT_TO_SF: ${{ secrets.REPORT_TO_SF }}
          NODE_PATH: /tmp/pdfdep/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          # off-app precedence lives in report-cli resolveOffSubs(): manual input > office server > variable
          MAB_OFFSUBS_INPUT: ${{ github.event.inputs.offsubs }}
          MAB_OFFSUBS: ${{ vars.MAB_OFFSUBS || '0' }}
          MAB_OFFICE_URL: https://bullion-magician-prancing.ngrok-free.dev
        run: |
          set -e
          # ================= RELAY: the baton that replaces GitHub's starving cron ==========
          # GitHub now skips scheduled runs for 4+ hour stretches at unpredictable times of day
          # (whole mornings on 9/21-9/23), so NO arming window is safe. A RELAY run doesn't
          # depend on the scheduler at all: it sleeps toward the next send time (7:30 morning,
          # 9:00 re-check, 8:00pm night — CT), sends it right on the minute, and keeps going.
          # Before the 6h job limit it dispatches a fresh relay with the built-in GITHUB_TOKEN
          # (workflow_dispatch is exempt from the no-recursive-runs rule) and exits — the baton
          # never touches a cron. Crons remain as the BOOTSTRAP (restart the chain if it ever
          # breaks) and as catch-up backup; the once-per-day lock dedupes the layers.
          GHAPI="https://api.github.com/repos/${{ github.repository }}/actions"
          GHAUTH="Authorization: Bearer ${{ github.token }}"
          live_relays() {  # count OTHER live relay runs; $1=only smaller run ids ('older') or all
            for ST in in_progress queued; do
              curl -s -H "$GHAUTH" "$GHAPI/workflows/report.yml/runs?status=$ST&per_page=50"
            done | python3 -c "
          import json,sys
          me=int('${{ github.run_id }}'); only_older=(sys.argv[1]=='older'); n=0
          dec=json.JSONDecoder(); buf=sys.stdin.read(); i=0
          while i < len(buf):
              try: j,k=dec.raw_decode(buf,i)
              except ValueError: break
              i=k
              while i<len(buf) and buf[i] in ' \n\t': i+=1
              for r in j.get('workflow_runs') or []:
                  if r['id']==me or 'relay' not in (r.get('display_title') or ''): continue
                  if only_older and r['id']>=me: continue
                  n+=1
          print(n)" "$1" || echo 0
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.kind }}" = "relay" ]; then
            if [ "$(live_relays older)" -gt 0 ]; then
              echo "relay: an older relay is already alive — this one bows out"
              exit 0
            fi
            RELAY_T0=$(date +%s)
            BUDGET=$((310*60))    # hand off well before the 350-min job timeout
            relay_send() {  # $1 = kind. Office-sent check + send; once-per-day lock dedupes.
              STATE=$(curl -s -m 12 -H 'ngrok-skip-browser-warning: true' "https://bullion-magician-prancing.ngrok-free.dev/reportstate?kind=$1" || true)
              if echo "$STATE" | grep -q '"sentToday":true'; then
                echo "relay: office already sent $1 today — skipping"
              else
                node report-engine/report-cli.js "$1" --send || echo "relay: $1 send failed (lock only set on success — a later relay/watchdog retries)"
              fi
            }
            # STARTUP CATCH-UP: a freshly bootstrapped relay (chain was broken) first sends
            # whatever is already due today — the lock skips anything an earlier run sent.
            H=$(TZ=America/Chicago date +%H); H=$((10#$H)); M=$(TZ=America/Chicago date +%M); M=$((10#$M)); NOW=$((H*60+M))
            DOW=$(TZ=America/Chicago date +%u)
            if [ "$DOW" = "1" ] && [ "$H" -ge 7 ] && [ "$H" -le 18 ]; then
              node report-engine/report-cli.js sf --send || echo "relay: sf catch-up failed — retried on the next bootstrap"
            fi
            if [ "$NOW" -ge $((7*60+30)) ] && [ "$H" -le 11 ]; then relay_send morning; fi
            if [ "$NOW" -ge $((9*60)) ] && [ "$H" -le 11 ]; then
              node report-engine/report-cli.js recheck --send || echo "relay: recheck catch-up failed"
            fi
            if [ "$H" -ge 20 ]; then relay_send night; fi
            while true; do
              H=$(TZ=America/Chicago date +%H); H=$((10#$H)); M=$(TZ=America/Chicago date +%M); M=$((10#$M)); NOW=$((H*60+M))
              DOW=$(TZ=America/Chicago date +%u)
              if   [ "$NOW" -lt $((7*60+30)) ]; then KIND=morning; WAIT=$(( (7*60+30-NOW)*60 ))
              elif [ "$NOW" -lt $((9*60)) ];    then KIND=recheck; WAIT=$(( (9*60-NOW)*60 ))
              elif [ "$NOW" -lt $((20*60)) ];   then KIND=night;   WAIT=$(( (20*60-NOW)*60 ))
              else KIND=morning; WAIT=$(( (24*60-NOW+7*60+30)*60 ))   # tomorrow 7:30
              fi
              REM=$(( BUDGET - ( $(date +%s) - RELAY_T0 ) ))
              if [ "$WAIT" -gt "$REM" ]; then
                if [ "$REM" -gt 300 ]; then
                  echo "relay: $H:$M CT — next send ($KIND) is past my 6h limit; sleeping $(( (REM-120)/60 )) min then handing the baton over"
                  sleep $(( REM - 120 ))
                fi
                curl -s -X POST -H "$GHAUTH" -H "Accept: application/vnd.github+json" \
                  "$GHAPI/workflows/report.yml/dispatches" -d '{"ref":"master","inputs":{"kind":"relay"}}' \
                  && echo "relay: baton handed to a fresh relay" \
                  || echo "relay: BATON DISPATCH FAILED — the cron bootstrap will restart the chain"
                exit 0
              fi
              echo "relay: $H:$M CT — sleeping $((WAIT/60)) min to send $KIND right on time"
              sleep "$WAIT"
              relay_send "$KIND"
              if [ "$KIND" = "morning" ] && [ "$DOW" = "1" ]; then
                node report-engine/report-cli.js sf --send || echo "relay: sf failed — retried on the next bootstrap"
              fi
              sleep 65   # step past the send minute so the next target computes forward
            done
          fi
          # ==================================================================================
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # the trend is a log-only report — it never mails, so it ignores preview/force entirely
            if [ "${{ github.event.inputs.kind }}" = "sftrend" ]; then
              node report-engine/report-cli.js sftrend --weeks=${{ github.event.inputs.weeks || '6' }}
              exit 0
            fi
            # PREVIEW = dry run: build + print the full report to the log, send NO email. No --send,
            # so the once-per-day lock is never touched and no recipient/Resend key is needed.
            if [ "${{ github.event.inputs.preview }}" = "true" ]; then
              node report-engine/report-cli.js "${{ github.event.inputs.kind }}"
            # external pingers (cron-job.org at 7:00am/8:00pm CT) leave force blank → the once-per-day
            # lock still dedupes against the hourly GitHub-cron backup. Set force=true only for tests.
            elif [ "${{ github.event.inputs.force }}" = "true" ]; then
              node report-engine/report-cli.js "${{ github.event.inputs.kind }}" --send --force
            else
              node report-engine/report-cli.js "${{ github.event.inputs.kind }}" --send
            fi
          else
            HOUR=$(TZ=America/Chicago date +%H); HOUR=$((10#$HOUR))
            MIN=$(TZ=America/Chicago date +%M); MIN=$((10#$MIN))
            NOWM=$((HOUR*60+MIN))
            # RELAY BOOTSTRAP — the crons' ONLY job now. A scheduled run checks whether a relay
            # is alive (running or queued) and starts one if the chain ever broke; the fresh
            # relay's own STARTUP CATCH-UP then sends anything already due today. Crons must NOT
            # send directly anymore: on 9/23 the old RECHECK_HOLD backup woke at 9:00 in parallel
            # with the relay and the re-check went out TWICE — the once-per-day lock lives in the
            # Actions cache, which a run only saves when it ENDS, so two same-minute runners
            # can't see each other's locks. One sender (the relay) means no such race.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              if [ "$(live_relays all)" -eq 0 ]; then
                echo "no live relay found — bootstrapping the chain"
                curl -s -X POST -H "$GHAUTH" -H "Accept: application/vnd.github+json" \
                  "$GHAPI/workflows/report.yml/dispatches" -d '{"ref":"master","inputs":{"kind":"relay"}}' \
                  || echo "relay bootstrap dispatch failed — next cron retries"
              else
                echo "relay chain is alive — nothing to do"
              fi
              exit 0
            fi
            if [ "${{ github.event_name }}" = "push" ]; then
              # ping branch push: the branch name IS the report kind. If the ping lands a bit
              # early (DST shifts the pinger's UTC schedule by an hour), sleep until the window
              # opens so the send time stays exact; ignore pings far outside the window.
              case "${{ github.ref }}" in
                refs/heads/ping/morning) KIND=morning; START=$((7*60+30)); END=$((11*60+59));;
                refs/heads/ping/night)   KIND=night;   START=$((20*60));   END=$((23*60+59));;
                refs/heads/ping/sf)      KIND=sf;      START=$((7*60));    END=$((23*60+59));;
                *) echo "not a ping branch"; exit 0;;
              esac
              if [ "$NOWM" -lt "$START" ] && [ $((START-NOWM)) -le 90 ]; then
                echo "ping arrived early ($HOUR:$MIN CT) — sleeping $((START-NOWM)) min until the window opens"
                sleep $(( (START-NOWM)*60 ))
              elif [ "$NOWM" -lt "$START" ] || [ "$NOWM" -gt "$END" ]; then
                echo "ping at $HOUR:$MIN CT is outside the $KIND window — ignoring"
                exit 0
              fi
            else
              echo "unexpected event ${{ github.event_name }} — nothing to do"
              exit 0
            fi
            # sf is cloud-only (the office PC doesn't know it) — send and stop before the office gate.
            if [ "$KIND" = "sf" ]; then
              node report-engine/report-cli.js sf --send
              exit 0
            fi
            # OFFICE PC IS THE PUNCTUAL PRIMARY (sends 7:00/20:00 CT on the minute). The cloud is the
            # BACKUP: ask the office first. Already sent -> stay quiet. Office UP but not sent yet
            # during the primary hour (7/20) -> give it the hour. Office DOWN (unreachable) or still
            # unsent in any later hour of the window -> the cloud sends. The once-per-day cache lock
            # still dedupes multiple backup runs.
            STATE=$(curl -s -m 12 -H 'ngrok-skip-browser-warning: true' "https://bullion-magician-prancing.ngrok-free.dev/reportstate?kind=$KIND" || true)
            echo "office state: ${STATE:-unreachable}"
            if echo "$STATE" | grep -q '"sentToday":true'; then
              echo "office already sent the $KIND report today — cloud stays quiet"
              exit 0
            fi
            if { [ "$HOUR" -eq 7 ] || [ "$HOUR" -eq 20 ]; } && echo "$STATE" | grep -q '"emailConfigured":true'; then
              echo "office is UP and will send within its hour — cloud waits (backup hour is next)"
              exit 0
            fi
            echo "ping - Central hour $HOUR -> $KIND (cloud covering: office down or unsent)"
            node report-engine/report-cli.js "$KIND" --send
          fi
      # save the rotated token/lock back to cache for the next run
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: report-engine/.state
          key: mab-state-${{ github.run_id }}
