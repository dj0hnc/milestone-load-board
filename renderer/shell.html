<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Milestone OS 1.0 (beta)</title>
<style>
  :root{
    --bg:#141b24; --bar:#1a222c; --line:#313d4a; --ink:#e8ecf3; --mut:#aeb7c0; --dim:#8b96a5;
    --gold:#C8991F; --green:#22c55e; --red:#ea4e2c; --amber:#fbbf24; --panel:#23303f;
  }
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);position:relative;z-index:5}
  #bar .brand{font-weight:800;letter-spacing:.4px;color:#fff;white-space:nowrap}
  #bar .brand b{color:var(--gold)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(255,255,255,.05);transition:.2s}
  .dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(63,185,122,.18)}
  .dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
  .dot.busy{background:var(--amber);box-shadow:0 0 0 3px rgba(224,185,74,.18);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #stat{font-size:13px;color:var(--mut);min-width:140px;line-height:1.15}
  #stat .who{display:block;font-size:11px;color:var(--dim)}
  button{font-family:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
  button:hover:not(:disabled){border-color:var(--gold)}
  button.go{background:var(--green);border-color:var(--green);color:#06231a}
  button.warn{background:var(--gold);border-color:var(--gold);color:#1a1205}
  button.ghost{background:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=date],select{background:#202b38;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 9px;font-family:inherit}
  label.lbl{font-size:12px;color:var(--mut)}
  .spacer{flex:1}
  iframe{border:0;width:100%;height:calc(100% - 48px);display:block;background:var(--bg)}
  #next{font-size:12px;color:var(--dim);min-width:60px}

  /* toast */
  #msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#23303f;border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:70vw;text-align:center}
  #msg.show{opacity:1}

  /* diagnostics drawer */
  #diag{position:fixed;top:48px;right:0;width:440px;max-width:92vw;height:calc(100% - 48px);background:#141b24;border-left:1px solid var(--line);transform:translateX(100%);transition:.22s;z-index:40;display:flex;flex-direction:column}
  #diag.open{transform:translateX(0)}
  #diag h3{margin:0;padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line);color:var(--mut);display:flex;justify-content:space-between;align-items:center}
  #log{flex:1;overflow:auto;padding:10px 14px;font-family:'Cascadia Code',Consolas,monospace;font-size:11.5px;color:#a9b6cc;white-space:pre-wrap;line-height:1.5}
  #log .err{color:var(--red)} #log .ok{color:var(--green)}
  .dtab.on{border-color:var(--gold);color:var(--gold)}
  #adminPane h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);margin:14px 0 6px}
  #adminPane h4:first-child{margin-top:0}
  #adminPane input{width:100%;background:#202b38;border:1px solid var(--line);color:#fff;border-radius:8px;padding:7px 10px;font-family:inherit;font-size:12.5px;margin-bottom:6px}
  #adminPane input:focus{border-color:var(--gold);outline:none}
  #adminPane .tokrow{display:flex;gap:6px;margin-bottom:6px}
  #adminPane .tokrow input.tname{width:130px;flex:none}
  #adminPane .tokrow button{flex:none;padding:4px 9px}
  #adminPane .hint{font-size:10.5px;color:var(--dim);margin-bottom:8px;line-height:1.5}

  /* push modal */
  #scrim{position:fixed;inset:0;background:rgba(6,10,18,.72);z-index:50;display:none;align-items:center;justify-content:center}
  #scrim.open{display:flex}
  #push{width:640px;max-width:94vw;max-height:86vh;background:#202b38;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  #push header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  #push header h2{margin:0;font-size:16px}
  #push header .sub{font-size:12px;color:var(--mut);margin-top:2px}
  #pushBody{overflow:auto;padding:6px 18px}
  .ord{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
  .ord .head{padding:10px 12px;background:#23303f;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ord .head .t{font-weight:700}
  .ord .head .m{font-size:11px;color:var(--mut)}
  .ord .rows{padding:6px 12px}
  .arow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #2e3a47}
  .arow:last-child{border-bottom:0}
  .arow .seq{color:var(--gold)}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
  .b-rate{background:rgba(63,185,122,.16);color:var(--green)}
  .b-def{background:rgba(224,185,74,.18);color:var(--amber)}
  .b-skip{background:rgba(255,107,107,.16);color:var(--red)}
  .b-warn{background:rgba(255,107,107,.16);color:var(--red)}
  #push footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
  #push footer .note{font-size:11px;color:var(--dim);margin-right:auto;max-width:50%}
  .res-ok{color:var(--green)} .res-bad{color:var(--red)}
</style>
</head>
<body>
  <div id="bar">
    <span class="brand">Milestone <b>OS</b> <span style="font-size:9px;font-weight:800;letter-spacing:.5px;background:rgba(200,153,31,.18);color:var(--gold);border:1px solid rgba(200,153,31,.4);border-radius:5px;padding:1px 5px;vertical-align:1px">1.0 BETA</span> <span id="appVer" style="font-size:10px;color:var(--dim);font-weight:600"></span></span>
    <span class="dot off" id="dot"></span>
    <span id="stat">Disconnected</span>
    <button class="go" id="btnConnect">Connect to NewMile</button>
    <button id="btnReconnect" style="display:none">Reconnect</button>
    <button id="btnDisconnect" class="ghost" style="display:none">Disconnect</button>
    <span class="spacer"></span>
    <label class="lbl">Day</label>
    <input type="date" id="day">
    <button id="btnRefresh" disabled>↻ Refresh</button>
    <button id="btnSf" disabled title="Weekly Service Failure report — GP dollars of lost loads. View any Mon-Sat week and email it on demand.">📉 SF Report</button>
    <label class="lbl">Auto</label>
    <select id="auto" title="Auto-refresh interval (off by default)">
      <option value="0">Off</option>
      <option value="300">5 min</option>
      <option value="900">15 min</option>
      <option value="1800">30 min</option>
      <option value="3600">60 min</option>
    </select>
    <span id="next"></span>
    <button id="btnUpdate" style="display:none;background:var(--green);border-color:var(--green);color:#06231a" title="A new version is ready — download it">⬇ Update</button>
    <button class="ghost" id="btnDiag" title="Connection diagnostics">⚙</button>
  </div>

  <iframe id="board" src="board.html"></iframe>

  <!-- diagnostics / admin drawer -->
  <div id="diag">
    <h3>
      <span>
        <button class="ghost dtab on" id="dtabLog" style="padding:3px 10px">Log</button>
        <button class="ghost dtab" id="dtabAdmin" style="padding:3px 10px">⚙ Admin</button>
      </span>
      <button class="ghost" id="diagClose" style="padding:2px 8px">✕</button>
    </h3>
    <div id="log"></div>
    <div id="adminPane" style="display:none;flex:1;overflow:auto;padding:14px"></div>
  </div>

  <!-- push preview modal -->
  <div id="scrim">
    <div id="push">
      <header>
        <div><h2>Push plan to NewMile</h2><div class="sub" id="pushSub"></div></div>
        <button class="ghost" id="pushX" style="padding:4px 9px">✕</button>
      </header>
      <div id="pushBody"></div>
      <footer>
        <span class="note">Each order is written then confirmed (draft → pending). Rules enforced: contracted_rate / driver 0 / Ton; EYK·Watercrest → order_default; ATX Bluewing excluded; never send_offer / close_order.</span>
        <button class="ghost" id="pushCancel">Cancel</button>
        <button class="warn" id="pushAll">Confirm &amp; push all</button>
      </footer>
    </div>
  </div>

  <div id="msg"></div>
  <script src="shell.js"></script>
</body>
</html>
