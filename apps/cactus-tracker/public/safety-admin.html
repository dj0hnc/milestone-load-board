<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Dumping Admin — Milestone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --road:#4A4F55; --sand:#B89A4E; --stone:#7A7D80; --dirt:#8B7355;
  --bg:#F6F4EF; --card:#FFFFFF; --line:#E5E1D8; --ink:#2E3238;
  --ok:#3E7A4E; --ok-bg:#EAF3EC; --bad:#A33B2E; --bad-bg:#F8ECEA; --warn:#8a5a10; --warn-bg:#FBF3D0; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.hdr{background:var(--road);padding:13px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;}
.hdr img{height:30px;}
.hdr b{color:#fff;font-size:14px;letter-spacing:.6px;}
.hdr .right{margin-left:auto;display:flex;gap:8px;}
.hdr button, .hdr a{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:8px 13px;font-family:'Poppins';font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:none;}
.wrap{max-width:1280px;margin:0 auto;padding:16px;}
.hero{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.shc{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 2px 8px rgba(74,79,85,.06);cursor:pointer;}
.shc.on{border-color:var(--sand);box-shadow:0 0 0 2px var(--sand);}
.shc b{display:block;font-size:26px;font-weight:800;line-height:1.1;}
.shc span{font-size:10px;letter-spacing:.7px;color:var(--stone);text-transform:uppercase;font-weight:700;}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.tools input[type=text]{flex:1;min-width:220px;padding:11px 14px;border:2px solid var(--line);border-radius:11px;font-family:'Poppins';font-size:14px;background:var(--card);}
.tools button{border:2px solid var(--line);background:var(--card);color:var(--road);border-radius:11px;padding:10px 14px;font-family:'Poppins';font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.tools button.gold{background:var(--sand);border-color:var(--sand);color:#fff;}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;}
.row{display:grid;grid-template-columns:96px 1.4fr 92px 1.3fr 110px 96px 118px 70px 96px 170px;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13px;min-width:1150px;}
.row:first-child{border-top:none;}
.row.hd{font-weight:700;font-size:11px;letter-spacing:.6px;color:var(--stone);text-transform:uppercase;}
.row b.code{font-weight:800;color:var(--dirt);letter-spacing:.5px;}
.chip{display:inline-block;border-radius:14px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.4px;}
.c-certified{background:var(--ok-bg);color:var(--ok);} .c-expired,.c-revoked{background:var(--bad-bg);color:var(--bad);}
.c-expiring{background:var(--warn-bg);color:var(--warn);}
.c-started,.c-video_done,.c-passed{background:#EDEBe4;color:var(--stone);}
.row .acts{display:flex;gap:5px;justify-content:flex-end;}
.row .acts button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-width:28px;height:28px;cursor:pointer;font-size:12px;}
.stk-in{width:84px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:'Poppins';font-size:12.5px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;}
.panel h3{font-size:15px;font-weight:700;color:var(--road);margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
.panel label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--stone);text-transform:uppercase;margin-bottom:4px;}
.panel input{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-family:'Poppins';font-size:14px;}
.panel .btn{border:none;background:var(--sand);color:#fff;border-radius:10px;padding:11px 18px;font-family:'Poppins';font-weight:700;font-size:13.5px;cursor:pointer;margin-top:10px;}
.muted{color:var(--stone);font-size:12px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--road);color:#fff;border-radius:12px;padding:12px 20px;font-size:13.5px;font-weight:600;display:none;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.modalbg{position:fixed;inset:0;background:rgba(40,42,46,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px;}
.modalbg.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:20px;max-height:85vh;overflow:auto;}
@media print {
  .hdr,.tools,.hero,.panel,.acts,.noprint{display:none !important;}
  .tbl{border:none;} .row{min-width:0;grid-template-columns:90px 1.3fr 80px 1.2fr 100px 90px 100px 60px 80px;font-size:11px;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div class="hdr">
  <img src="img/milestone-supply-light.png" alt="Milestone Supply">
  <b>SAFE DUMPING · PROJECT ROADRUNNER — ADMIN</b>
  <div class="right">
    <button onclick="shareLink()">🔗 Driver link</button>
    <a href="api/safety/admin/export.csv">⬇ Excel</a>
    <button onclick="window.print()">🖨 Print / PDF</button>
  </div>
</div>
<div class="wrap">
  <div class="hero" id="hero"></div>
  <div class="tools">
    <input type="text" id="q" placeholder="Search name / truck / company / code…" oninput="render()">
    <button class="gold" onclick="openManual()">＋ Manual certification</button>
    <button onclick="load()">⟳ Refresh</button>
  </div>
  <div class="tbl" id="tbl"></div>

  <div class="panel">
    <h3>🎬 Training videos</h3>
    <div class="grid2">
      <div><label>English video (MP4)</label><input type="file" id="vidEn" accept="video/mp4"><button class="btn" onclick="upVid('en')">Upload EN</button> <span class="muted" id="stEn"></span></div>
      <div><label>Spanish video (MP4)</label><input type="file" id="vidEs" accept="video/mp4"><button class="btn" onclick="upVid('es')">Upload ES</button> <span class="muted" id="stEs"></span></div>
    </div>
    <p class="muted" style="margin-top:8px;">Videos live only on the office server (data/safety/), never in the repo. Drivers must watch 90% — progress is measured server side, skipping forward is blocked.</p>
  </div>
</div>

<div class="modalbg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const API = location.pathname.replace(/\/safety-admin\.html$/, "");
const $ = (id) => document.getElementById(id);
let ROWS = [], FILTER = "";
const WHO = (() => { try { return localStorage.getItem("ct_author") || localStorage.getItem("cactus-who") || "admin"; } catch(e){ return "admin"; } })();
function toast(m){ const t = $("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2600); }
function openModal(h){ $("modalBody").innerHTML = h; $("modalBg").classList.add("show"); }
function closeModal(){ $("modalBg").classList.remove("show"); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function api(p, body){
  const r = await fetch(API + "/api/safety/" + p, body !== undefined
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  return r.json();
}
async function load(){
  const j = await api("admin/list");
  ROWS = j.rows || [];
  const vs = await api("video-status").catch(() => null);
  if (vs && vs.videos) {
    $("stEn").textContent = vs.videos.en ? ("✓ " + vs.videos.en + " MB") : "— not uploaded";
    $("stEs").textContent = vs.videos.es ? ("✓ " + vs.videos.es + " MB") : "— not uploaded";
  }
  render();
}
function heroStats(){
  const cert = ROWS.filter(r => r.status === "certified");
  return {
    certified: cert.length,
    expiring: cert.filter(r => r.days_left != null && r.days_left <= 30).length,
    expired: ROWS.filter(r => r.status === "expired").length,
    progress: ROWS.filter(r => ["started", "video_done", "passed"].includes(r.status)).length,
    nosticker: cert.filter(r => !r.sticker).length
  };
}
let heroFilter = "";
function setHF(f){ heroFilter = heroFilter === f ? "" : f; render(); }
function render(){
  const s = heroStats();
  $("hero").innerHTML = `
    <div class="shc ${heroFilter==="certified"?"on":""}" onclick="setHF('certified')"><b style="color:var(--ok)">${s.certified}</b><span>Certified</span></div>
    <div class="shc ${heroFilter==="expiring"?"on":""}" onclick="setHF('expiring')"><b style="color:var(--warn)">${s.expiring}</b><span>Expiring ≤ 30d</span></div>
    <div class="shc ${heroFilter==="expired"?"on":""}" onclick="setHF('expired')"><b style="color:var(--bad)">${s.expired}</b><span>Expired</span></div>
    <div class="shc ${heroFilter==="progress"?"on":""}" onclick="setHF('progress')"><b style="color:var(--stone)">${s.progress}</b><span>In training</span></div>
    <div class="shc ${heroFilter==="nosticker"?"on":""}" onclick="setHF('nosticker')"><b style="color:var(--dirt)">${s.nosticker}</b><span>Sticker pending</span></div>`;
  const q = $("q").value.trim().toLowerCase();
  let rows = ROWS.filter(r => !q || [r.name, r.truck, r.company, r.code].some(v => String(v).toLowerCase().includes(q)));
  if (heroFilter === "certified") rows = rows.filter(r => r.status === "certified");
  if (heroFilter === "expiring") rows = rows.filter(r => r.status === "certified" && r.days_left != null && r.days_left <= 30);
  if (heroFilter === "expired") rows = rows.filter(r => r.status === "expired");
  if (heroFilter === "progress") rows = rows.filter(r => ["started", "video_done", "passed"].includes(r.status));
  if (heroFilter === "nosticker") rows = rows.filter(r => r.status === "certified" && !r.sticker);
  const chip = (r) => {
    let cls = "c-" + r.status, lbl = r.status.toUpperCase().replace("_", " ");
    if (r.status === "certified" && r.days_left != null && r.days_left <= 30) { cls = "c-expiring"; lbl = "EXPIRES " + r.days_left + "D"; }
    return `<span class="chip ${cls}">${lbl}</span>`;
  };
  $("tbl").innerHTML = `<div class="row hd"><span>Code</span><span>Driver</span><span>Truck</span><span>Company</span><span>Status</span><span>Certified</span><span>Expires</span><span>Quiz</span><span>Sticker</span><span></span></div>` +
    (rows.length ? rows.map(r => `<div class="row">
      <b class="code">${esc(r.code)}</b>
      <span><b>${esc(r.name)}</b>${r.phone ? `<br><a class="muted" href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : ""}</span>
      <b>${esc(r.truck)}</b>
      <span>${esc(r.company)}${r.source === "manual" ? ' <span class="muted">(manual)</span>' : ""}</span>
      <span>${chip(r)}</span>
      <span>${esc((r.certified_at || "").slice(0, 10)) || "—"}</span>
      <span>${esc(r.expires_at) || "—"}${r.days_left != null ? ` <span class="muted">(${r.days_left}d)</span>` : ""}</span>
      <span>${r.quiz !== "0/0" ? esc(r.quiz) : "—"}</span>
      <span><input class="stk-in" value="${esc(r.sticker)}" placeholder="#" onchange="setSticker(${r.id}, this.value)"></span>
      <span class="acts noprint">
        ${r.signed ? `<button title="View signature" onclick="openSig(${r.id}, '${esc(r.name)}')">✍</button>` : ""}
        <button title="Verify page (QR target)" onclick="window.open('${API}/safety?code=${esc(r.code)}','_blank')">🔍</button>
        <button title="History" onclick="openEvents(${r.id}, '${esc(r.code)}')">🕘</button>
        <button title="Retrain (resets video + quiz)" onclick="act(${r.id}, 'renew')">↺</button>
        <button title="Revoke" onclick="if(confirm('Revoke ${esc(r.code)}?'))act(${r.id}, 'revoke')">⛔</button>
      </span>
    </div>`).join("") : `<div class="row"><span class="muted" style="grid-column:1/-1;">No drivers yet. Share the driver link to get started.</span></div>`);
}
async function setSticker(id, v){ await api("admin/update", { id, sticker: v.trim(), by: WHO }); toast("Sticker saved"); load(); }
async function act(id, action){ await api("admin/update", { id, action, by: WHO }); toast(action === "renew" ? "Reset for retraining" : "Revoked"); load(); }
function openSig(id, name){ openModal(`<h3 style="margin-bottom:10px;">✍ ${esc(name)}</h3><img src="${API}/api/safety/admin/signature?id=${id}" style="width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;"><button class="btn" onclick="closeModal()" style="width:100%;">Close</button>`); }
async function openEvents(id, code){
  const j = await api("admin/events?id=" + id);
  openModal(`<h3 style="margin-bottom:10px;">🕘 ${esc(code)}</h3>` +
    (j.events || []).map(e => `<div style="padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;"><b>${esc(e.kind)}</b> <span class="muted">${new Date(e.ts).toLocaleString("en-US")}</span><br><span class="muted">${esc(e.detail)}</span></div>`).join("") +
    `<button class="btn" onclick="closeModal()" style="width:100%;">Close</button>`);
}
function openManual(){
  openModal(`<h3 style="margin-bottom:10px;">＋ Manual certification</h3>
    <p class="muted" style="margin-bottom:10px;">For a driver trained in person (tailgate session). Counts the same 180 days.</p>
    <label class="muted">FULL NAME</label><input id="mName" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:'Poppins';">
    <label class="muted">TRUCK #</label><input id="mTruck" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:'Poppins';">
    <label class="muted">COMPANY ON TRUCK</label><input id="mCo" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:'Poppins';">
    <label class="muted">TRAINED ON (date, optional)</label><input id="mDate" type="date" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:'Poppins';">
    <label class="muted">STICKER # (optional)</label><input id="mStk" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:'Poppins';">
    <button class="btn" style="width:100%;" onclick="saveManual()">CERTIFY</button>`);
}
async function saveManual(){
  const j = await api("admin/manual", { name: $("mName").value, truck: $("mTruck").value, company: $("mCo").value, date: $("mDate").value, sticker: $("mStk").value, by: WHO });
  if (j.error) { toast("⚠ " + j.error); return; }
  closeModal(); toast("Certified " + j.code + " · expires " + j.expires_at); load();
}
function upVid(lang){
  const f = (lang === "en" ? $("vidEn") : $("vidEs")).files[0];
  if (!f) { toast("Pick the MP4 first"); return; }
  const st = lang === "en" ? $("stEn") : $("stEs");
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", API + "/api/safety/admin/video?lang=" + lang);
  xhr.setRequestHeader("Content-Type", "video/mp4");
  xhr.upload.onprogress = (e) => { st.textContent = "⬆ " + Math.round((e.loaded / e.total) * 100) + "%"; };
  xhr.onload = () => { try { const j = JSON.parse(xhr.responseText); st.textContent = j.ok ? ("✓ " + j.mb + " MB") : ("⚠ " + j.error); if (j.ok) toast("Video " + lang.toUpperCase() + " uploaded"); } catch (e) { st.textContent = "⚠ upload failed"; } };
  xhr.onerror = () => { st.textContent = "⚠ upload failed"; };
  xhr.send(f);
}
function shareLink(){
  const url = location.origin + API + "/safety";
  openModal(`<h3 style="margin-bottom:10px;">🔗 Driver link</h3>
    <p class="muted">Send this by text or WhatsApp. The driver opens it on their phone, picks their language and goes.</p>
    <input id="shUrl" value="${url}" readonly style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin:10px 0;font-family:'Poppins';font-size:13px;">
    <button class="btn" style="width:100%;" onclick="navigator.clipboard.writeText($('shUrl').value).then(()=>toast('Copied'))">COPY LINK</button>
    <div id="shQr" style="display:flex;justify-content:center;margin-top:12px;"></div>`);
  try { new QRCode($("shQr"), { text: url, width: 150, height: 150, colorDark: "#4A4F55" }); } catch (e) {}
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>load();</script>
</body>
</html>
