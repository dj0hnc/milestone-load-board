async function sendTruckTo(orderId,org,num){
  ensureWho();
  const t=truckOf(org,num);
  const o=((_orders&&_orders.orders)||[]).find(x=>x.id===orderId)||{};
  const lds=$("sendLds")?$("sendLds").value:"";
  const posEl=$("sendPos"); const pos=posEl&&posEl.value?parseInt(posEl.value,10):0;
  if(!confirm(`PUSH ${dnum(t)} → "${o.customer||o.name}" in NewMile?${lds?` (${lds} loads)`:""}${pos?` · run #${pos}`:""}`))return;
  window._stLds="";
  openModal(`<h3>🚀 Pushing ${esc(dnum(t))}…</h3><p style="color:var(--mut);font-size:14px;">creating + confirming${pos?" + placing as run #"+pos:""}…</p>`);
  try{
    const r=await fetch(`${API}/api/orders/assign`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({order_id:orderId,date,trucks:[{org,number:num}],load_limit:lds||undefined,position:pos||undefined,by:WHO})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
    if(j.failed&&j.failed.length)throw new Error(j.failed[0].number+": "+j.failed[0].reason);
    await fetchBoard();
    const warn=(j.warnings&&j.warnings.length)?`<p style="font-size:12px;color:#a8622f;">⚠ ${esc(j.warnings.join(" · "))}</p>`:"";
    openModal(`<h3>🚀 Done</h3><p style="font-size:14px;">✅ ${esc(dnum(t))} → <b>${esc(o.customer||o.name)}</b>${j.confirmed?" — CONFIRMED, the driver can see it":" — left as DRAFT, confirm in NewMile"}${j.placedAt?` · placed as run #${j.placedAt}`:""}</p>${warn}
      <div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
  }catch(e){
    openModal(`<h3>🚀 Push failed</h3><p style="font-size:14px;color:var(--red);">${esc(e.message)}</p><p style="font-size:13px;color:var(--mut);">Nothing was marked locally.</p>
      <div class="actions"><button class="b-cancel" onclick="renderSendTruck('${org}','${esc(num)}')">← Try again</button><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
  }
}
async function unassignNM(id,orderName){

// presets de time off: hoy, mañana, esta semana (hoy→sábado), semana que viene (lun→sáb)
function toPreset(a,b){
  const today=board.today;
  let from,to;
  if(a==="tw"||a==="nw"){
    const d=new Date(today+"T12:00:00Z");const dow=d.getUTCDay();
    const mon=isoShift(today,(dow===0?-6:1-dow)+(a==="nw"?7:0));
    from=a==="nw"?mon:today; to=isoShift(mon,5); // hasta el sábado
  }else{from=isoShift(today,a);to=isoShift(today,b);}
  $("toFrom").value=from;$("toTo").value=to;
}

// ---------- 🤠 BOTÓN TONY: "available but not planned" en inglés, un tap ----------
// El tracker ya sabe quién está libre-sin-plan (estado + auto-cover vs NewMile + time-off).
// Este botón arma la lista EN INGLÉS y la deja en el portapapeles, lista para pegarle a Tony.
async function copyTony(){
  const ts=(board&&board.trucks||[]).filter(t=>!t.archived&&!t.is_new&&subOnlyOk(t)&&(isVirtual()||t.division===division));
  const free=[],out=[];
  for(const t of ts){
    const off=outOfService(t),offE=offOf(t),rest=restsToday(t);
    if(t.state==="a")continue;                                  // ya planeada/cubierta
    if(t.state==="d"){out.push(`${dnum(t)} (${t.driver||"no driver"}) — marked X/down today${t.status_note||t.note?": "+(t.status_note||t.note):""}`);continue;}
    if(t.state==="n"){out.push(`${dnum(t)} (${t.driver||"no driver"}) — NO WORK today${t.status_note||t.note?": "+(t.status_note||t.note):""}`);continue;}
    if(off||offE||rest){out.push(`${dnum(t)} (${t.driver||"no driver"}) — ${offE?(OFF_LBL[offE.reason]||offE.reason)+" "+mdy(offE.from_date)+"–"+mdy(offE.to_date):(STATUS_LBL[t.status]||t.status)}${t.return_date?" · back "+esc(t.return_date):""}${t.status_note||t.note?" · "+(t.status_note||t.note):""}`);continue;}
    free.push(`${dnum(t)} (${t.driver||"no driver"})${t.note?" — "+t.note:""}`);
  }
  const txt=`Available but not planned — ${mdy(date)}:\n`+(free.length?free.map(s=>"• "+s).join("\n"):"• none — everyone available is planned")+(out.length?`\n\nNot available:\n`+out.map(s=>"• "+s).join("\n"):"");
  try{await navigator.clipboard.writeText(txt);}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);}
  openModal(`<h3>🤠 Tony report — copied ✓</h3><p style="font-size:12px;color:var(--mut);margin-bottom:8px;">already in your clipboard — paste it into the message. This was copied:</p><pre style="white-space:pre-wrap;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:50vh;overflow:auto;">${esc(txt)}</pre><div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
}

// ---------- ⬇ EXPORT — exactly what the filters show (2026-09-02, Juan) ----------
// Mirrors render()'s filter chain 1:1 (tab → status seg → type → bulk/search → area) so what
// you see is what you get. CSV (UTF-8 BOM, Excel-ready) or copy as a plain list for a message.
const EXPORT_SEG_LBL={"":"ALL",open:"OPEN",cov:"COVERED",asg:"ASSIGNED",wrk:"WORKED",asgnw:"ASSIGNED NOT WORKED",off:"OFF",rip:"RIP",star:"STAR"};
function visibleTrucks(){
  if(!board)return [];
  const virtual=isVirtual();
  const divTrucks=(board.trucks||[]).filter(t=>!t.archived&&subOnlyOk(t)&&(virtual||t.division===division));
  const q=$("fSearch").value.trim().toLowerCase();
  const tokens=q.split(/[\s,;]+/).filter(Boolean);
  let bulkSet=null;
  if(tokens.length>=2){
    bulkSet=new Set();
    for(const t of divTrucks){
      if(t.is_new)continue;
      const keys=[t.number,dnum(t),String(dnum(t)).replace(/[\s-]/g,"")].map(x=>String(x).toLowerCase());
      if(tokens.some(tk=>keys.includes(tk.toLowerCase())))bulkSet.add(t.org_id+"|"+t.number);
    }
  }
  const areaV=$("fArea").value;
  const out=[];
  for(const t of divTrucks){
    if(t.is_new)continue;
    if(!matchStatus(t))continue;
    if(!matchTypeSel(t))continue;
    if(!matchDisp(t))continue;
    if(bulkSet){if(!bulkSet.has(t.org_id+"|"+t.number))continue;}
    else if(!matchSearch(t,q))continue;
    if(areaV&&(t.area||"(SIN YARD)")!==areaV)continue;
    out.push(t);
  }
  return out.sort((a,b)=>String(dnum(a)).localeCompare(String(dnum(b)),undefined,{numeric:true}));
}
function exportContext(){
  const tab=isVirtual()?ORG:(ORG+" "+division);
  const typeSel=$("fType"); const typeTxt=typeSel&&typeSel.value?typeSel.options[typeSel.selectedIndex].text:"all types";
  const area=$("fArea").value||"all areas";
  const q=$("fSearch").value.trim();
  return {tab, seg:EXPORT_SEG_LBL[statusFilter]||statusFilter||"ALL", type:typeTxt, area, q};
}
function exportTodayLbl(t){
  if(t.state==="a")return "ASSIGNED";
  if(t.state==="d")return "X / DOWN";
  if(t.state==="n")return "NO WORK";
  return isOffNow(t)?"OFF":"OPEN";
}
function exportRows(list){
  const hosLeft=(t)=>{ if(!hosFresh(t)||t.hos_drive_ms==null)return ""; const ms=t.hos_drive_ms; if(ms<=0)return "0h"; return Math.floor(ms/3600e3)+"h"+String(Math.floor((ms%3600e3)/60000)).padStart(2,"0"); };
  const dest=(t)=>(t.nm_dest||[]).map(d=>[d.c||d.n,d.d||d.m].filter(Boolean).join(" → ")).join(" + ");
  const offE=(t)=>{ const o=offOf(t); return o?((OFF_LBL[o.reason]||o.reason)+" "+mdy(o.from_date)+"–"+mdy(o.to_date)):""; };
  return list.map(t=>({
    "Truck":dnum(t), "Driver":t.driver||"", "Phone":t.phone||"", "Org":t.org_id, "Tab":t.division||"", "Area":t.area||"",
    "Owner":t.owner_name||"", "Trailer":trlTxt(t)||"", "Status":(STATUS_LBL[t.status]||t.status||""), "Today":exportTodayLbl(t),
    "In NewMile":(t.nm_confirmed||(t.nm_dest&&t.nm_dest.length))?"yes":"", "Order / destination":dest(t),
    "Loads today":t.loads_today||0, "Last load":t.last_load_date||"", "HOS left":hosLeft(t),
    "Earned today":t.rev_day?Number(t.rev_day).toFixed(2):"", "Earned week":t.rev_week?Number(t.rev_week).toFixed(2):"",
    "Time off":offE(t), "Return":t.return_date||"", "Note":[t.status_note,t.note].filter(Boolean).join(" · ")
  }));
}
function exportCsvText(rows){
  if(!rows.length)return "";
  const cols=Object.keys(rows[0]);
  const cell=(v)=>{ v=String(v==null?"":v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return "﻿"+cols.join(",")+"\r\n"+rows.map(r=>cols.map(c=>cell(r[c])).join(",")).join("\r\n");
}
function exportListText(list,ctx){
  const head=`${ctx.tab} · ${ctx.seg} · ${mdy(date)} — ${list.length} truck${list.length===1?"":"s"}`;
  return head+"\n"+list.map(t=>`• ${dnum(t)} (${t.driver||"no driver"}) — ${exportTodayLbl(t)}${t.area?" · "+t.area:""}${t.note?" · "+t.note:""}`).join("\n");
}
async function exportCopy(kind){

function exportCsvDownload(){
  const list=visibleTrucks(), ctx=exportContext();
  const csv=exportCsvText(exportRows(list));
  const safe=(s)=>String(s).replace(/[^A-Za-z0-9_-]+/g,"_").replace(/^_+|_+$/g,"");
  const name=`tracker_${safe(ctx.tab)}_${safe(ctx.seg)}_${date}.csv`;
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast(`Downloading ${name} (${list.length} trucks)`);
}

// ---------- 📝 NOTES HISTORY — every note EVER, from every source, one timeline ----------
// Merges the call log (calls table) with every edit of the chip note and status note
// (truck_log audit), grouped by day, newest first. Nothing anyone wrote is ever lost.
async function openNotesHist(org,num){
  const t=truckOf(org,num);if(!t)return;
  openModal(`<h3>📝 Notes — Truck ${esc(dnum(t))}</h3>
    <div style="font-size:12.5px;color:var(--mut);margin-bottom:6px;">${esc(t.driver||"(no driver)")} — everything ever written: 📞 calls · 📝 notes · ✎ chip-note edits · 🔧 status notes</div>
    <div id="nhFeed" class="cfeed" style="max-height:56vh;"><p style="color:var(--mut);font-size:13px;">Loading…</p></div>
    <div class="cnew"><input type="text" id="nhText" placeholder="Add a note…" maxlength="500" onkeydown="if(event.key==='Enter')saveHistNote('${t.org_id}','${esc(t.number)}')"><button onclick="saveHistNote('${t.org_id}','${esc(t.number)}')">SAVE</button></div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px;">signing as <b>${esc(whoAmI()||"— no name yet —")}</b> · <a href="#" onclick="changeAuthor();return false;">change</a></div>`);
  try{
    const [cr,hr]=await Promise.all([
      fetch(`${API}/api/truck/${encodeURIComponent(t.org_id)}/${encodeURIComponent(t.number)}/calls`).then(r=>r.json()),
      fetch(`${API}/api/truck/${encodeURIComponent(t.org_id)}/${encodeURIComponent(t.number)}/history`).then(r=>r.json())
    ]);
    const items=[];
    for(const c of ((cr&&cr.calls)||[]))items.push({ts:c.ts,author:c.author,src:c.kind==="call"?"📞 call":"📝 note",text:c.text,color:"var(--blue)"});
    for(const h of ((hr&&hr.changes)||[])){
      if(h.field!=="note"&&h.field!=="status_note")continue;
      items.push({ts:h.ts,author:h.changed_by,src:h.field==="note"?"✎ chip note":"🔧 status note",
        text:h.new_value?h.new_value:(h.old_value?`(cleared — was "${h.old_value}")`:"(cleared)"),color:"#a8622f"});
    }
    items.sort((a,b)=>a.ts<b.ts?1:-1);
    const el=$("nhFeed");if(!el)return;
    if(!items.length){el.innerHTML=`<p style="color:var(--mut);font-size:13px;">Nothing yet — every note anyone writes on this truck piles up here forever.</p>`;return;}
    let html="",lastDay="";
    for(const it of items){
      const day=String(it.ts).slice(0,10);
      if(day!==lastDay){lastDay=day;html+=`<div style="font-family:'Barlow Condensed';font-weight:800;font-size:12.5px;letter-spacing:1px;color:var(--mut);margin:7px 0 3px;border-bottom:1px dashed var(--line);padding-bottom:2px;">${nhDayLbl(day)}</div>`;}
      html+=`<div class="cmsg"><div class="cav">${esc((it.author||"?").slice(0,2).toUpperCase())}</div><div style="flex:1;"><div class="cmeta"><b>${esc(it.author||"?")}</b> · ${esc(String(it.ts).slice(11,16))} · <span style="color:${it.color};font-weight:700;">${it.src}</span></div><div class="ctx">${esc(it.text)}</div></div></div>`;
    }
    html+=`<div style="text-align:center;color:var(--mut);font-size:11px;margin-top:5px;">${items.length} entries — the full life story of this truck</div>`;
    el.innerHTML=html;
  }catch(e){const el=$("nhFeed");if(el)el.innerHTML=`<p style="color:var(--red);font-size:13px;">Could not load: ${esc(e.message||String(e))}</p>`;}
}
function nhDayLbl(day){
  const today=board.today||"";
  if(day===today)return "TODAY · "+mdy(day);
  if(today&&day===isoShift(today,-1))return "YESTERDAY · "+mdy(day);
  const wd=["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date(day+"T12:00:00Z").getUTCDay()];
  return wd+" · "+mdy(day);
}
async function saveHistNote(org,num){
  let who=whoAmI();
  if(!who){changeAuthor();who=whoAmI();if(!who)return;}
  const inp=$("nhText");if(!inp)return;
  const text=(inp.value||"").trim();if(!text)return;
  inp.disabled=true;
  try{
    const r=await fetch(`${API}/api/truck/${encodeURIComponent(org)}/${encodeURIComponent(num)}/calls`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({author:who,text:text,kind:"note"})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"save failed");
    const t=truckOf(org,num);if(t){t.last_call={ts:j.call.ts,author:who,kind:"note",text:text};t.calls_count=(t.calls_count||0)+1;}
    openNotesHist(org,num);render();
  }catch(e){alert("Not saved: "+(e.message||e));const i=$("nhText");if(i)i.disabled=false;}
}

function applyFlag(org,num,source,action){
  const t=truckOf(org,num);if(!t)return;

    if(/DELEAS/i.test(flag))t.status="deleased";else if(/SHOP/i.test(flag))t.status="shop";else if(/DOWN/i.test(flag))t.status="down";

}

function mlFindTruck(num){
  const q=String(num||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!q||!board)return null;
  const ts=board.trucks||[];
  const norm=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  return ts.find(t=>norm(t.number)===q)||ts.find(t=>norm(dnum(t))===q)||ts.find(t=>norm(t.number).endsWith(q))||null;
}
function mlBrief(t){

async function mlExec(name,inp){
  inp=inp||{};
  if(!board)return {error:"board not loaded yet — try again in a second"};
  try{
    if(name==="find_available"){
      let ts=(board.trucks||[]).filter(t=>t.state==="p"&&!isOffNow(t)&&!t.archived);
      if(inp.area)ts=ts.filter(t=>String(t.area||"").toUpperCase().includes(String(inp.area).toUpperCase()));
      if(inp.trailer)ts=ts.filter(t=>trlTxt(t).toUpperCase().includes(String(inp.trailer).toUpperCase()));
      ts.sort((a,b)=>(b.days_since_last_load||0)-(a.days_since_last_load||0));
      return {viewed_date:date,count:ts.length,trucks:ts.slice(0,30).map(mlBrief),note:ts.length>30?"showing first 30 (hungriest first)":undefined};
    }
    if(name==="truck_info"){
      const t=mlFindTruck(inp.number);
      return t?mlBrief(t):{error:"truck '"+inp.number+"' not found in this tab ("+ORG+") — maybe another fleet tab"};
    }
    if(name==="truck_history"){
      const t=mlFindTruck(inp.number);
      if(!t)return {error:"truck '"+inp.number+"' not found"};
      const r=await fetch(`${API}/api/truck/${encodeURIComponent(t.org_id)}/${encodeURIComponent(t.number)}/calls`);
      const j=await r.json();
      const n=Math.min(Number(inp.limit)||12,40);
      return {truck:dnum(t),driver:t.driver||null,entries:(j.calls||[]).slice(0,n).map(c=>({when:String(c.ts).slice(0,16).replace("T"," "),by:c.author,kind:c.kind,text:c.text}))};
    }
    if(name==="earnings"){
      const ts=(board.trucks||[]).filter(t=>!t.archived&&(t.rev_week||0)>0);
      ts.sort((a,b)=>(inp.order==="low"?1:-1)*((b.rev_week||0)-(a.rev_week||0)));
      return {week_ranking:ts.slice(0,Math.min(Number(inp.limit)||8,25)).map(t=>({number:dnum(t),driver:t.driver||null,earned_week:t.rev_week||0,earned_day:t.rev_day||0,loads_week:t.loads_week||0}))};
    }
    if(name==="recruit_brief"){
      const rec=await mlRecruits();
      if(rec.restricted)return {restricted:true,message:"Recruiting is Juan & Tony only — this user is not allowed to see it."};
      if(rec.error)return {error:rec.error};
      const today=board.today;
      return {deals:rec.list.map(r=>({company:r.company,contact:r.contact||undefined,phone:r.phone||undefined,stage:r.stage_label||r.stage,trucks:r.trucks||undefined,truck_type:r.truck_type||undefined,lead_source:r.lead_source||undefined,follow_up:r.next_follow||undefined,follow_up_overdue:(r.next_follow&&r.next_follow<today)||undefined,days_in_stage:r.stage_since?Math.round((Date.now()-Date.parse(r.stage_since))/86400e3):undefined,last_note:r.last_note?(String(r.last_note.ts).slice(0,10)+" ("+r.last_note.author+"): "+r.last_note.text):undefined}))};
    }
    // ---- ESCRITURAS: confirmar SIEMPRE, firmar con whoAmI() ----
    if(name==="add_call_note"){
      const t=mlFindTruck(inp.number);
      if(!t)return {error:"truck '"+inp.number+"' not found"};
      const text=String(inp.text||"").trim().slice(0,500);
      if(!text)return {error:"empty note"};
      if(!confirm("📝 Save to "+dnum(t)+"'s call log?\n\n“"+text+"”\n\nsigned: "+(whoAmI()||"?")))return {cancelled:true,message:"dispatcher cancelled the confirm card"};
      const r=await fetch(`${API}/api/truck/${encodeURIComponent(t.org_id)}/${encodeURIComponent(t.number)}/calls`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({author:whoAmI(),text,kind:inp.kind==="note"?"note":"call"})});
      const j=await r.json();
      if(!j.ok)return {error:j.error||"save failed"};
      t.last_call={ts:j.call.ts,author:whoAmI(),kind:inp.kind==="note"?"note":"call",text};
      render();
      return {saved:true,truck:dnum(t),text};
    }
    if(name==="mark_day"){
      const t=mlFindTruck(inp.number);
      if(!t)return {error:"truck '"+inp.number+"' not found"};
      const map={covered:"a",down:"d",nowork:"n",pending:"p"};
      const s=map[inp.mark];
      if(!s)return {error:"bad mark"};
      const lbl={a:"✓ COVERED",d:"✕ X (down)",n:"NW (no work)",p:"clear → pending"}[s];
      if(!confirm("Mark "+dnum(t)+" as "+lbl+" for "+date+"?"))return {cancelled:true,message:"dispatcher cancelled"};
      setSt(t,s);
      return {saved:true,truck:dnum(t),mark:inp.mark,date};
    }
    if(name==="set_status"){
      const t=mlFindTruck(inp.number);
      if(!t)return {error:"truck '"+inp.number+"' not found"};
      if(!STATUS_LBL[inp.status]&&inp.status!=="ok")return {error:"bad status"};
      const note=String(inp.note||"").trim().slice(0,120);
      if(!confirm("Set "+dnum(t)+" status → "+(STATUS_LBL[inp.status]||inp.status).toUpperCase()+(note?"\nnote: "+note:"")+" ?"))return {cancelled:true,message:"dispatcher cancelled"};
      ensureWho();
      t.status=inp.status; if(note)t.status_note=note;
      queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(t.number)}`,body:{status:inp.status,...(note?{status_note:note}:{}),by:WHO}});
      render();
      return {saved:true,truck:dnum(t),status:inp.status,note:note||undefined};
    }
    if(name==="recruit_note"||name==="recruit_followup"){
      const rec=await mlRecruits();
      if(rec.restricted)return {restricted:true,message:"Recruiting is Juan & Tony only."};
      if(rec.error)return {error:rec.error};
      const hits=mlMatchRecruit(rec.list,inp.company);
      if(!hits.length)return {error:"no recruiting deal matches '"+inp.company+"'"};
      if(hits.length>1)return {ambiguous:hits.slice(0,6).map(r=>r.company),message:"more than one match — ask the dispatcher which one"};
      const d=hits[0];
      if(name==="recruit_note"){
        const text=String(inp.text||"").trim().slice(0,500);
        if(!text)return {error:"empty note"};
        if(!confirm("🤝 Save note on "+d.company+"?\n\n“"+text+"”"))return {cancelled:true,message:"dispatcher cancelled"};
        const r=await fetch(`${API}/api/recruit/${d.deal_id}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({author:whoAmI(),text,kind:"note"})});
        const j=await r.json();
        return j.ok?{saved:true,company:d.company,text}:{error:j.error||"save failed"};
      }
      const dt=String(inp.date||"").slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))return {error:"date must be YYYY-MM-DD"};
      if(!confirm("🗓 Set follow-up on "+d.company+" → "+dt+"?"))return {cancelled:true,message:"dispatcher cancelled"};
      const r=await fetch(`${API}/api/recruit/${d.deal_id}/set`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({next_follow:dt})});
      const j=await r.json();
      _mlRec=null;
      return j.ok?{saved:true,company:d.company,follow_up:dt}:{error:j.error||"save failed"};
    }
    return {error:"unknown tool "+name};
  }catch(e){return {error:String(e.message||e)};}
}
function mlCtx(){
  const ts=(board&&board.trucks)||[];
  const w=(board&&board.working)||{};
  const avail=ts.filter(t=>t.state==="p"&&!isOffNow(t)&&!t.archived);
  const hosLow=ts.filter(t=>hosFresh(t)&&hosLeftEff(t)!=null&&hosH(hosLeftEff(t))<4).slice(0,12).map(t=>dnum(t)+": "+hosFmt(hosLeftEff(t))+" left");
  const nw=ts.filter(t=>t.state==="n").slice(0,15).map(dnum), xd=ts.filter(t=>t.state==="d").slice(0,15).map(dnum);
  return JSON.stringify({me:whoAmI()||null,viewing_date:date,today:board?board.today:null,
    tab:ORG+"/"+(division||""),recruit_access:!!(board&&board.recruitAllowed),
    counts:{trucks_in_tab:ts.length,available_now:avail.length,working_all_fleets:w.total,x_down:w.x,no_work:w.nw},
    hos_low_today:hosLow,marked_nw:nw,marked_x:xd,
    tip:"snapshot only — use tools for live detail"});
}
function mlEsc(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function mlBubble(cls,html){const f=$("mlFeed");const d=document.createElement("div");d.className="ml-b "+cls;d.innerHTML=html;f.appendChild(d);f.scrollTop=f.scrollHeight;return d;}
function mlRenderAll(){
  const f=$("mlFeed");f.innerHTML="";
  if(!mlMsgs.length){mlBubble("sys","👷‍♀️ Miley here — fleet &amp; people.<br>Try: <i>“anótale al 720 que trae la llanta baja”</i> · <i>“who's free in Powderly with hours?”</i> · <i>“¿qué se ha hablado con el 1033?”</i> · <i>“recruiting: who needs a follow-up?”</i>");return;}
  for(const m of mlMsgs){
    if(m.role==="user"){
      if(typeof m.content==="string")mlBubble("me",mlEsc(m.content));
      // tool_results no se pintan (ruido) — la respuesta de Miley ya los cuenta
    }else{
      const blocks=Array.isArray(m.content)?m.content:[{type:"text",text:String(m.content||"")}];
      for(const b of blocks){
        if(b.type==="text"&&b.text.trim())mlBubble("ai",mlEsc(b.text.trim()));
        if(b.type==="tool_use")mlBubble("tool","🔧 "+esc(b.name));
      }
    }
  }
}
async function mlSave(){
  const who=whoAmI(); if(!who||!mlMsgs.length)return;
  if(!mlChatId)mlChatId="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const first=mlMsgs.find(m=>m.role==="user"&&typeof m.content==="string");
  try{await fetch(`${API}/api/ai/chats`,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:mlChatId,author:who,title:first?String(first.content).slice(0,80):"(chat)",messages:mlMsgs})});}catch(e){}
}
async function mlSend(){
  if(mlBusy)return;
  const inp=$("mlText");const q=(inp.value||"").trim();if(!q)return;
  ensureWho();
  inp.value="";
  mlMsgs.push({role:"user",content:q});
  mlBubble("me",mlEsc(q));
  mlBusy=true;$("mlSendBtn").disabled=true;
  const think=mlBubble("ml-think ml-b sys","👷‍♀️ <i>●</i><i>●</i><i>●</i>");
  try{
    for(let round=0;round<6;round++){
      const r=await fetch(`${API}/api/ai/chat`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:mlMsgs,context:mlCtx(),tools:ML_TOOLS})});
      const j=await r.json();
      if(j.error){mlBubble("ai","⚠️ "+esc(j.error));break;}
      mlMsgs.push({role:"assistant",content:j.content});
      const uses=(j.content||[]).filter(c=>c.type==="tool_use");
      for(const b of (j.content||[]))if(b.type==="text"&&b.text.trim())mlBubble("ai",mlEsc(b.text.trim()));
      if(j.stop_reason!=="tool_use"||!uses.length)break;
      const results=[];
      for(const u of uses){
        mlBubble("tool","🔧 "+esc(u.name)+"…");
        const out=await mlExec(u.name,u.input);
        results.push({type:"tool_result",tool_use_id:u.id,content:JSON.stringify(out).slice(0,9000)});
      }
      mlMsgs.push({role:"user",content:results});
    }
  }catch(e){mlBubble("ai","⚠️ "+esc(e.message||String(e)));}
  finally{think.remove();mlBusy=false;$("mlSendBtn").disabled=false;mlSave();inp.focus();}
}
function openMiley(){ensureWho();$("mileyPanel").classList.add("open");mlRenderAll();setTimeout(()=>{const i=$("mlText");if(i&&window.innerWidth>640)i.focus();},50);}
function closeMiley(){$("mileyPanel").classList.remove("open");}
function mlNewChat(){mlMsgs=[];mlChatId=null;mlRenderAll();}
async function mlHistory(){
  const who=whoAmI();if(!who)return;
  const f=$("mlFeed");f.innerHTML="<div class='ml-b sys'>Loading your conversations…</div>";
  try{
    const r=await fetch(`${API}/api/ai/chats?author=${encodeURIComponent(who)}`);
    const j=await r.json();
    f.innerHTML="";
    if(!(j.chats||[]).length){mlBubble("sys","No saved conversations yet — they auto-save as you talk.");mlBubble("sys","<button class='hx' onclick='mlNewChat()'>← back</button>");return;}
    mlBubble("sys","🕘 <b>Your conversations</b> (saved on the server — tap to continue)");
    for(const c of j.chats){
      mlBubble("sys",`<button class="hx" onclick="mlLoadChat('${esc(c.id)}')"><b>${esc(c.title||"(chat)")}</b><br><small style="color:var(--mut)">${esc(String(c.ts).slice(0,16).replace("T"," "))}</small></button><a href="#" style="font-size:11px;color:var(--red)" onclick="mlDelChat('${esc(c.id)}');return false;">delete</a>`);
    }
    mlBubble("sys","<button class='hx' onclick='mlRenderAll()'>← back to current chat</button>");
  }catch(e){f.innerHTML="";mlBubble("ai","⚠️ could not load history: "+esc(e.message||String(e)));}
}
async function mlLoadChat(id){
  try{
    const r=await fetch(`${API}/api/ai/chats/${encodeURIComponent(id)}`);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"not found");
    mlMsgs=j.chat.messages||[];mlChatId=j.chat.id;
    mlRenderAll();
  }catch(e){mlBubble("ai","⚠️ "+esc(e.message||String(e)));}
}
async function mlDelChat(id){
  if(!confirm("Delete this conversation forever?"))return;
  try{await fetch(`${API}/api/ai/chats/${encodeURIComponent(id)}/delete`,{method:"POST"});}catch(e){}
  if(mlChatId===id)mlNewChat();
  mlHistory();
}

// ---------- boot ----------
fetchBoard();
// ⚡ REFRESH REACTIVO (2026-08-26, "trabajo a velocidad"): cada 8 s se pregunta /api/rev
// (una respuesta de BYTES); solo si algo cambió en el server se recarga el board completo.
// Además: al VOLVER a esta pestaña (después de asignar en el loadboard) recarga AL INSTANTE.
// Red de seguridad: recarga completa cada 60 s aunque la rev no se mueva.
let __lastRev="", __lastFull=Date.now();
async function pollRev(){
  if(document.hidden) return;
  try{
    const r=await fetch(API+"/api/rev").then(x=>x.json());
    if(r&&r.rev&&r.rev!==__lastRev){ const first=(__lastRev===""); __lastRev=r.rev; if(!first){ __lastFull=Date.now(); fetchBoard(); return; } }
  }catch(e){}
  if(Date.now()-__lastFull>60*1000){ __lastFull=Date.now(); fetchBoard(); }
}
setInterval(pollRev,8*1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ __lastFull=0; pollRev(); } });
window.addEventListener("focus",()=>{ __lastFull=0; pollRev(); });
// al abrir el cel / regresar a la pestaña: refresh inmediato (y si hay versión nueva, recarga sola)
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&Date.now()-(window._visFetch||0)>8000){window._visFetch=Date.now();fetchBoard();}
});
</script>
