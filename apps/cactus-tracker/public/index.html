<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Milestone Texas Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1C2333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Milestone TX">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2333; --navy2:#252e42; --gold:#C8991F;
  --bg:#f4f5f7; --card:#fff; --ink:#1C2333; --mut:#7a8194;
  --green:#1e8a4c; --green-bg:#e6f5ec; --red:#b02a2a; --red-bg:#fbe9e9;
  --blue:#2456a6; --blue-bg:#e7f0fc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',Arial,sans-serif;background:var(--bg);color:var(--ink);}
header{background:var(--navy);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.3);}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
h1{font-family:'Barlow Condensed';font-weight:800;font-size:26px;letter-spacing:1px;text-transform:uppercase;}
h1 span{color:var(--gold);}
.faltan-pill{margin-left:auto;background:var(--gold);color:var(--navy);font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:.5px;padding:6px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.faltan-pill.ok{background:var(--green);color:#fff;}
.hrow2{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:8px;}
.fleet-tab{font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:1px;text-transform:uppercase;padding:8px 18px;background:transparent;border:none;color:#8f97ab;cursor:pointer;border-bottom:4px solid transparent;}
.fleet-tab.on{color:#fff;border-bottom-color:var(--gold);}
.days{display:flex;gap:5px;margin-left:auto;padding-bottom:6px;}
.day{width:42px;height:40px;border-radius:8px;border:1px solid #3a4460;background:var(--navy2);color:#c6cddd;font-family:'Barlow Condensed';font-weight:700;font-size:13px;cursor:pointer;line-height:1.05;padding:2px 0;}
.day small{display:block;font-size:11px;opacity:.75;font-weight:800;}
.day.on{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.day.today{border-color:var(--gold);}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 70px;}
.progress{background:#e2e5ec;border-radius:999px;height:10px;overflow:hidden;margin-bottom:12px;}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0%;transition:width .3s;}
/* control segmentado de status con contadores */
.seg{display:flex;background:#fff;border:1.5px solid #cdd3df;border-radius:12px;overflow:hidden;margin-bottom:10px;}
.seg button{flex:1;padding:7px 2px 6px;border:none;background:none;color:#5a6275;cursor:pointer;font-family:'Barlow Condensed';font-weight:700;font-size:13.5px;letter-spacing:.4px;display:flex;flex-direction:column;align-items:center;gap:0;border-right:1px solid #e8ebf1;}
.seg button:last-child{border-right:none;}
.seg button span{font-size:15px;font-weight:800;}
.seg button.on{background:var(--navy);color:#fff;}
.seg button.rip.on{background:var(--blue);}
.seg button.off-seg.on{background:#c98a2f;}
.searchrow select{border:1.5px solid #cdd3df;border-radius:10px;padding:0 8px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;background:#fff;height:44px;}
.orgtag{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 5px;border-radius:4px;background:var(--navy);color:#fff;vertical-align:middle;margin-left:6px;}
.orgtag.kt{background:var(--blue);}
.orgtag.ic{background:#7a2fa8;}
.orgtag.sub{background:#5a6275;}
.searchrow{display:flex;gap:8px;margin-bottom:14px;}
.searchrow input{flex:1;padding:11px 14px;border:1.5px solid #cdd3df;border-radius:10px;font-family:'Barlow';font-size:16px;}
.btn-reset{background:none;border:1.5px solid var(--red);color:var(--red);border-radius:10px;padding:0 16px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;text-transform:uppercase;cursor:pointer;}
.faltanBox{background:#fff8e6;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:none;}
.faltanBox.show{display:block;}
.faltanBox b{font-family:'Barlow Condensed';font-size:18px;letter-spacing:.5px;text-transform:uppercase;color:#8a6a10;}
.faltanBox .chip-mini{display:inline-block;background:#fff;border:1.5px solid #d8c58a;border-radius:6px;padding:3px 10px;margin:6px 6px 0 0;font-weight:700;font-size:14px;cursor:pointer;}
.faltanBox .chip-mini.rip{border-color:var(--blue);color:var(--blue);}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.banner b{font-family:'Barlow Condensed';font-size:18px;letter-spacing:.5px;text-transform:uppercase;}
.banner .chip-mini{display:inline-block;background:#fff;border-radius:6px;padding:3px 10px;margin:6px 6px 0 0;font-weight:700;font-size:14px;cursor:pointer;border:1.5px solid transparent;}
.banner.new{background:var(--red-bg);border:1.5px solid var(--red);}
.banner.new b{color:var(--red);}
.banner.new .chip-mini{border-color:#e2a3a3;color:var(--red);}
.banner.baja{background:#fdf3e3;border:1.5px solid #c98a2f;}
.banner.baja b{color:#8a5a10;}
.banner.baja .chip-mini{border-color:#dcc08a;color:#8a5a10;}
.banner.off{background:#eef0f5;border:1.5px solid #aab2c5;color:#4a5164;}
.group{margin-bottom:20px;}
.group h2{font-family:'Barlow Condensed';font-size:20px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:3px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;}
.group h2 small{font-size:14px;color:var(--mut);font-family:'Barlow Condensed';}
.group h2 small.full{color:var(--green);}
.group h2 .chev{display:inline-block;width:16px;color:var(--gold);font-size:14px;}
.group.closed h2{opacity:.75;border-bottom-style:dashed;}
.group.closed .grid{display:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.chip{background:var(--card);border:2px solid #dde1ea;border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:transform .05s;min-height:78px;}
.chip:active{transform:scale(.97);}
.chip .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding-right:50px;}
.chip .num{font-family:'Barlow Condensed';font-weight:800;font-size:26px;line-height:1;}
.chip .trl{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:5px;background:#eef0f5;color:var(--mut);white-space:nowrap;margin-top:2px;}
.chip .trl.rip{background:var(--blue-bg);color:var(--blue);}
.chip .trl.sd{background:#f3e8fb;color:#7a2fa8;}
.chip .trl.bd{background:#fdeedd;color:#a8622f;}
.chip .drv{font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.25;}
.chip .drv.none{color:#b8853a;font-weight:700;}
.chip .act{font-size:10.5px;color:var(--green);font-weight:700;margin-top:3px;}
.chip .act.warn{color:#b8853a;}
.chip .act.bad{color:var(--red);}
.chip .note{font-size:11px;color:#a8622f;margin-top:3px;line-height:1.25;}
.chip .park{font-size:11px;font-weight:700;color:var(--blue);margin-top:3px;}
.chip .park.mut{color:#9aa1b2;font-weight:600;}
.btn-loc{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:12px;cursor:pointer;line-height:1;}
.btn-loc:hover{border-color:var(--blue);color:var(--blue);}
.btn-loc.busy{border-color:var(--blue);color:var(--blue);animation:locspin 1s linear infinite;}
@keyframes locspin{to{transform:rotate(360deg)}}
.chip .badge{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;margin-top:3px;margin-right:4px;}
.chip .badge.drvchg{background:#f3e8fb;color:#7a2fa8;}
.chip .badge.flag{background:var(--red-bg);color:var(--red);cursor:pointer;}
.chip .badge.status{background:#eef0f5;color:#4a5164;}
.chip .ripflag{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:var(--blue);}
.btn-down{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:14px;font-weight:700;cursor:pointer;line-height:1;}
.btn-down:hover{border-color:var(--red);color:var(--red);}
.btn-edit{position:absolute;top:6px;right:36px;width:26px;height:26px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:13px;cursor:pointer;line-height:1;}
.btn-edit:hover{border-color:var(--gold);color:var(--gold);}
.chip.s-a{border-color:var(--green);background:var(--green-bg);}
.chip.s-a .check{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.chip.s-a .check.auto{background:#2456a6;font-size:11px;}
.chip.s-d{border-color:var(--red);background:var(--red-bg);opacity:.7;}
.chip.s-d .num{text-decoration:line-through;color:var(--red);}
.chip.s-d .btn-down{background:var(--red);border-color:var(--red);color:#fff;}
.chip.rest{opacity:.55;background:#eef0f5;}
.chip.status-off{background:#f2f3f6;}
/* no disponible (vacaciones/shop programado/status): ámbar rayado, imposible de confundir */
.chip.s-off{border-color:#c98a2f;background:repeating-linear-gradient(135deg,#f8f3e8,#f8f3e8 9px,#f0e6d0 9px,#f0e6d0 18px);}
.chip.s-off .num{color:#8a5a10;}
.chip.s-off .drv{color:#a8874a;}
.chip.s-off .offmark{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:#c98a2f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--mut);}
.statusbar .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#b02a2a;margin-right:4px;}
.statusbar .dot.on{background:var(--green);}
.btn-sync{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;}
.btn-sync:disabled{opacity:.5;}
a.connect{color:var(--blue);font-weight:700;text-decoration:none;}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px;}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(28,35,51,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px 26px;}
.modal h3{font-family:'Barlow Condensed';font-size:24px;letter-spacing:.5px;margin-bottom:10px;}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;}
.modal input[type=text],.modal select{width:100%;padding:10px 12px;border:1.5px solid #cdd3df;border-radius:10px;font-family:'Barlow';font-size:16px;}
.modal .row2{display:flex;gap:10px;}
.modal .row2>div{flex:1;}
.restdays{display:flex;gap:6px;flex-wrap:wrap;}
.restdays label{display:flex;align-items:center;gap:4px;margin:0;border:1.5px solid #cdd3df;border-radius:8px;padding:6px 10px;font-size:13px;text-transform:none;color:var(--ink);cursor:pointer;}
.restdays label.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.restdays input{display:none;}
.modal .actions{display:flex;gap:10px;margin-top:18px;}
.modal .actions button{flex:1;padding:12px;border-radius:10px;border:none;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;}
.b-save{background:var(--green);color:#fff;}
.b-cancel{background:#eef0f5;color:var(--ink);}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600;}
@media (max-width:600px){
  h1{font-size:20px;} .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));}
  .days{margin-left:0;}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>MILESTONE TEXAS <span>TRACKER</span></h1>
    <div class="faltan-pill" id="faltanPill" onclick="toggleFaltan()">—</div>
  </div>
  <div class="hrow2">
    <div id="fleets"></div>
    <div class="days" id="days"></div>
  </div>
</header>

<div class="wrap">
  <div class="statusbar">
    <span><span class="dot" id="nmDot"></span><span id="nmTxt">NewMile…</span></span>
    <span id="lastSync"></span>
    <button class="btn-sync" id="btnSync" onclick="syncNow()">⟳ Sync now</button>
    <span id="netTxt"></span>
  </div>

  <div class="progress"><i id="prog"></i></div>

  <div id="banners"></div>

  <div class="faltanBox" id="faltanBox">
    <b id="faltanTitle"></b>
    <div id="faltanList"></div>
  </div>

  <div class="seg" id="segStatus"></div>

  <div class="searchrow" style="flex-wrap:wrap;">
    <div style="flex:1 1 100%;position:relative;">
      <input id="fSearch" type="text" placeholder="Search # / driver / area / note / type…" style="width:100%;padding-right:38px;">
      <button id="fClear" onclick="clearSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:#cdd3df;color:#4a5164;font-size:14px;font-weight:700;cursor:pointer;line-height:1;">✕</button>
    </div>
    <select id="fType" onchange="typeFilter=this.value;render()" style="flex:1;">
      <option value="">Type: all</option>
      <option value="ALED">AL-ED (aluminum)</option>
      <option value="STED">ST-ED (steel)</option>
      <option value="RBED">RB-ED</option>
      <option value="ED">End Dump (any)</option>
      <option value="SD">Super Dump</option>
      <option value="BD">Belly Dump</option>
      <option value="ALTT">AL-TT</option>
      <option value="3X8">3X8</option>
      <option value="SUB">Subhaulers</option>
    </select>
    <select id="fArea" onchange="render()" style="flex:1;max-width:170px;"></select>
    <button class="btn-reset" id="btnReset">Reset day</button>
  </div>
  <div id="bulkBar" style="display:none;background:var(--blue-bg);border:1.5px solid var(--blue);border-radius:12px;padding:9px 12px;margin:-6px 0 12px;font-size:13.5px;color:var(--blue);align-items:center;gap:10px;flex-wrap:wrap;"></div>

  <div id="board"></div>
</div>
<footer>1 tap = assigned ✓ · tap again = pending · ✕ = down · ✎ = edit · blue ⚡ = auto-covered (hauled or assigned today in NewMile) · saved to the server per date</footer>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<script>
// API base: works mounted at /cactus-tracker/ or standalone at /
const API = location.pathname.replace(/\/(index\.html)?$/, '');
const DAYS = ["Mon","Tue","Wed","Thur","Fri","Sat"];
const STATUS_LBL = {ok:"OK", shop:"IN SHOP", down:"DOWN", no_driver:"NO DRIVER", vacation:"VACATION", deleased:"DE-LEASED"};
const TRAILER_TYPES = ["AL-ED","AL-ED/L","ED","ST-ED","RB-ED","SD Steel","SD Demo","SD","BD","AL-TT","RIP Trl","Demo"];

let board=null;          // last good server payload
let ORG="CACTUS";        // org del tab activo (CACTUS | KT | ...)
let division="NORTH";
let date=null;           // ISO date being viewed
let typeFilter=""; let statusFilter=""; let showFaltan=false;
let offline=false;

// multi-usuario: cada quien pone su nombre una vez; viaja en cada cambio (auditoría)
let WHO=localStorage.getItem("cactus-who")||"";
function ensureWho(){
  if(WHO)return;
  const n=prompt("Who are you? (your name is stamped on every change you make)")||"";
  WHO=n.trim().slice(0,40);
  if(WHO)localStorage.setItem("cactus-who",WHO);
}

const $=id=>document.getElementById(id);
const CACHE_KEY="cactus-tracker-cache-v1";
const QUEUE_KEY="cactus-tracker-queue-v1";

// ---------- data ----------
async function fetchBoard(){
  const d=date?("&date="+date):"";
  try{
    const r=await fetch(`${API}/api/board?org=${ORG}${d}`);
    if(r.status===401){location.href=API+"/login.html";return;}
    if(!r.ok)throw new Error("HTTP "+r.status);
    board=await r.json();
    if(!date)date=board.date;
    offline=false;
    localStorage.setItem(CACHE_KEY+":"+ORG,JSON.stringify({at:Date.now(),board}));
  }catch(e){
    // Regla de oro: si la red falla, mostrar la última data buena CON timestamp, nunca inventar.
    const c=localStorage.getItem(CACHE_KEY+":"+ORG);
    if(c&&!board){const j=JSON.parse(c);board=j.board;if(!date)date=board.date;}
    offline=true;
  }
  render();
}

// ---------- write queue (optimistic, retries when the yard signal comes back) ----------
function queuePush(req){
  const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  q.push(req); localStorage.setItem(QUEUE_KEY,JSON.stringify(q));
  flushQueue();
}
let flushing=false;
async function flushQueue(){
  if(flushing)return; flushing=true;
  try{
    let q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
    while(q.length){
      const req=q[0];
      try{
        const r=await fetch(API+req.path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req.body)});
        if(!r.ok && r.status>=500)throw new Error("server");
      }catch(e){break;} // network down: retry on next flush
      q.shift(); localStorage.setItem(QUEUE_KEY,JSON.stringify(q));
    }
    offline=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]").length>0&&offline;
  }finally{flushing=false;}
  renderNet();
}
setInterval(flushQueue,15000);
window.addEventListener("online",()=>{flushQueue();fetchBoard();});

// ---------- state taps ----------
function truckOf(org,num){return (board.trucks||[]).find(t=>t.org_id===org&&t.number===num);}
function setSt(t,s){
  ensureWho();
  t.state=s; t.state_source="manual"; t.state_by=WHO;
  queuePush({path:"/api/state",body:{date,org:t.org_id,number:t.number,state:s,by:WHO}});
  render();
}
function tapChip(org,num){const t=truckOf(org,num);if(!t)return; setSt(t,t.state==="a"?"p":"a");}
function tapDown(ev,org,num){ev.stopPropagation();const t=truckOf(org,num);if(!t)return; setSt(t,t.state==="d"?"p":"d");}

// ---------- helpers ----------
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function restsToday(t){
  if(!t.rest_days)return false;
  const wd=Object.entries(board.week).find(([,iso])=>iso===date);
  return wd?t.rest_days.split(",").map(s=>s.trim()).includes(wd[0]):false;
}
// time off programado: aplica SOLO en el rango de fechas (el día visto decide)
const OFF_LBL={vacation:"🌴 VACATION",shop:"🔧 SHOP",down:"⛔ DOWN",personal:"🏠 PERSONAL"};
function offOf(t){return (t.time_off||[]).find(o=>o.from_date<=date&&date<=o.to_date)||null;}
function upcomingOff(t){return (t.time_off||[]).find(o=>o.from_date>date&&o.from_date<=isoShift(date,7))||null;}
function isoShift(iso,days){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}
function mdy(iso){return iso?iso.slice(5).replace("-","/").replace(/^0/,""):"";}
function outOfService(t){return ["shop","down","vacation","deleased"].includes(t.status)||!!offOf(t);}
function countsForFaltan(t){return t.state==="p"&&!restsToday(t)&&!outOfService(t)&&!t.archived;}
function trlClass(tt,rip){if(rip)return"rip";if((tt||"").startsWith("SD"))return"sd";if(tt==="BD")return"bd";return"";}
// status: cómo está HOY (para planear); type: qué trae (equipo)
function isOffNow(t){return t.state==="d"||outOfService(t)||restsToday(t);}
function matchStatus(t){
  switch(statusFilter){
    case "": return true;
    case "open": return t.state==="p"&&!isOffNow(t);
    case "cov": return t.state==="a";
    case "off": return isOffNow(t);
    case "rip": return !!t.rip_rap;
  }
  return true;
}
function matchTypeSel(t){
  const tt=t.trailer_type||"";
  switch(typeFilter){
    case "": return true;
    case "ALED": return /^AL-ED/i.test(tt)||/Aluminum End/i.test(tt);
    case "STED": return /^ST-ED/i.test(tt)||/Steel End/i.test(tt);
    case "RBED": return /^RB-ED/i.test(tt)||/Round Body/i.test(tt);
    case "ED": return /ED|End Dump/i.test(tt)&&!/SD|Super/i.test(tt);
    case "SD": return /SD|Super/i.test(tt);
    case "BD": return /^BD$|Belly/i.test(tt);
    case "ALTT": return /AL-?TT|Tractor/i.test(tt);
    case "3X8": return (t.tags||"").includes("3X8");
    case "SUB": return !!t.is_sub;
  }
  return true;
}
function renderSeg(list){
  const c={all:0,open:0,cov:0,off:0,rip:0};
  for(const t of list){
    if(t.is_new)continue;
    c.all++;
    if(t.state==="a")c.cov++;
    else if(isOffNow(t))c.off++;
    else c.open++;
    if(t.rip_rap)c.rip++;
  }
  const segs=[["","ALL",c.all,""],["open","OPEN",c.open,""],["cov","COVERED",c.cov,""],["off","OFF",c.off,"off-seg"],["rip","RIP",c.rip,"rip"]];
  $("segStatus").innerHTML=segs.map(s=>`<button class="${s[3]} ${statusFilter===s[0]?"on":""}" onclick="setStatus('${s[0]}')">${s[1]}<span>${s[2]}</span></button>`).join("");
}
function setStatus(v){statusFilter=v;render();}
// la búsqueda encuentra por número, driver, área, nota, tipo, tags o teléfono
function matchSearch(t,q){
  if(!q)return true;
  return [t.number,t.display_number,t.driver,t.area,t.note,t.trailer_type,t.tags,t.phone,t.status_note]
    .some(v=>(v||"").toLowerCase().includes(q));
}
function hasGPS(t){return !(t.org_id==="CACTUS"&&t.is_sub);} // subs de Cactus: sin Samsara
function parkHtml(t){
  if(!hasGPS(t))return `<div class="park mut">🅿 no Samsara</div>`;
  if(!t.parked_city)return `<div class="park mut">🅿 no GPS yet — tap ⟳</div>`;
  const tm=t.parked_at?new Date(t.parked_at):null;
  return `<div class="park">🅿 ${esc(t.parked_city)}${tm?` · ${tm.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"})}`:""}</div>`;
}
let _locating=new Set();
async function locateNow(org,num){
  const key=org+"|"+num;
  if(_locating.has(key))return;
  _locating.add(key);
  const btn=document.querySelector(`[id="chip-${cssId(org+"-"+num)}"] .btn-loc`);
  if(btn)btn.classList.add("busy");
  try{
    const r=await fetch(`${API}/api/truck/${org}/${encodeURIComponent(num)}/locate`,{method:"POST"});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.truck){
      const t=truckOf(org,num);
      if(t){t.parked_city=j.truck.parked_city;t.parked_at=j.truck.parked_at;}
    }else if(!r.ok){alert("GPS refresh failed: "+(j.error||r.status));}
  }catch(e){alert("GPS refresh failed: no connection");}
  _locating.delete(key);
  render();
}
function actHtml(t){
  if(t.loads_today>0)return `<div class="act">🟢 today: ${t.loads_today} load${t.loads_today>1?"s":""}${t.last_load_driver?" · "+esc(t.last_load_driver):""}</div>`;
  if(t.days_since_last_load==null)return `<div class="act bad">⚠ no load on record</div>`;
  const d=t.days_since_last_load;
  const md=t.last_load_date?t.last_load_date.slice(5).replace("-","/").replace(/^0/,""):"";
  if(d>=14)return `<div class="act bad">⛔ ${d} days without a load</div>`;
  if(d>=5)return `<div class="act warn">⚠ ${d} days without a load</div>`;
  return `<div class="act">🟢 last: ${md}${t.last_load_driver?" · "+esc(t.last_load_driver):""}</div>`;
}
function toggleFaltan(){showFaltan=!showFaltan;render();}
// zonas colapsables: se guardan cerradas por tab, sobreviven recargas
let collapsed=new Set(JSON.parse(localStorage.getItem("ct-collapsed")||"[]"));
function groupKey(g){return ORG+"|"+(isVirtual()?"":(division||""))+"|"+g;}
function toggleGroup(k){
  collapsed.has(k)?collapsed.delete(k):collapsed.add(k);
  localStorage.setItem("ct-collapsed",JSON.stringify([...collapsed]));
  render();
}
function jumpTo(org,num){
  typeFilter="";$("fSearch").value="";showFaltan=false;
  const t=truckOf(org,num);
  if(t){
    // mismo cálculo de grupo que render(): área pura pasada por areaLbl
    collapsed.delete(groupKey(areaLbl(t.area||"(SIN YARD)")));
    localStorage.setItem("ct-collapsed",JSON.stringify([...collapsed]));
  }
  render();
  const el=$("chip-"+cssId(org+"-"+num));
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.boxShadow="0 0 0 4px var(--gold)";setTimeout(()=>el.style.boxShadow="",1200);}
}
function areaLbl(a){return a==="(SIN YARD)"?"(NO YARD)":a;}
function dnum(t){return t.display_number||t.number;} // el número COMO EN NEWMILE
function isVirtual(){return ORG==="ALL"||ORG==="SUBS";}
function tabLbl(t){
  const tab=(board.tabs||[]).find(x=>x.org_id===t.org_id&&x.id===t.division);
  return tab?tab.label:(t.org_id+(t.division?" "+t.division:" ⚑ UNASSIGNED"));
}
function cssId(n){return String(n).replace(/[^A-Za-z0-9_-]/g,"_");}
function fmtTime(iso){if(!iso)return "—";const d=new Date(iso);return d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});}

// ---------- render ----------
function render(){
  if(!board){$("board").innerHTML="<p style='color:var(--mut);padding:20px'>Loading…</p>";return;}
  const virtual=isVirtual();
  const divTrucks=(board.trucks||[]).filter(t=>!t.archived&&(virtual||t.division===division));
  $("btnReset").style.display=virtual?"none":""; // reset es por división concreta

  // FALTAN
  const pend=divTrucks.filter(countsForFaltan);
  const asg=divTrucks.filter(t=>t.state==="a").length;
  const activos=divTrucks.filter(t=>t.state!=="d"&&!restsToday(t)&&!outOfService(t)).length;
  const pill=$("faltanPill");
  if(pend.length===0){pill.className="faltan-pill ok";pill.textContent="✔ ALL COVERED";}
  else{pill.className="faltan-pill";pill.textContent="MISSING "+pend.length;}
  $("prog").style.width=(activos?Math.round(Math.min(asg,activos)/activos*100):100)+"%";

  const fb=$("faltanBox");
  fb.className="faltanBox"+(showFaltan&&pend.length>0?" show":"");
  if(pend.length>0){
    const dayName=Object.entries(board.week).find(([,iso])=>iso===date);
    $("faltanTitle").textContent=`MISSING ${pend.length} — ${dayName?dayName[0]:date} (tap to jump to the truck)`;
    // agrupado por área: de un vistazo dónde falta gente y de dónde jalar trucks libres
    const byArea={};
    for(const t of pend)(byArea[t.area||"(SIN YARD)"]=byArea[t.area||"(SIN YARD)"]||[]).push(t);
    $("faltanList").innerHTML=Object.keys(byArea).sort().map(area=>{
      const list=byArea[area].sort((x,y)=>(y.rip_rap?1:0)-(x.rip_rap?1:0));
      return `<div style="margin-top:8px;"><span style="font-family:'Barlow Condensed';font-weight:700;font-size:14px;color:#8a6a10;">${esc(areaLbl(area))} · ${list.length}</span><br>`+
        list.map(t=>`<span class="chip-mini ${t.rip_rap?"rip":""}" onclick="jumpTo('${t.org_id}','${esc(t.number)}')">${esc(dnum(t))}${t.rip_rap?" · RIP":""}</span>`).join("")+`</div>`;
    }).join("");
  }

  renderBanners();

  // dropdown de áreas de la división actual (conserva la selección)
  const areaSel=$("fArea");
  const areas=[...new Set(divTrucks.map(t=>t.area||"(SIN YARD)"))].sort();
  const curArea=areaSel.value;
  areaSel.innerHTML=`<option value="">Area: all</option>`+areas.map(a=>`<option value="${esc(a)}" ${a===curArea?"selected":""}>${esc(areaLbl(a))}</option>`).join("");

  renderSeg(divTrucks);
  const q=$("fSearch").value.trim().toLowerCase();
  // MULTI-BÚSQUEDA: pegar una lista ("972 1 927 1 1083 1" o "629 633 1386…") encuentra
  // todos esos trucks a la vez; los números de cargas se ignoran solos (no matchean)
  const tokens=q.split(/[\s,;]+/).filter(Boolean);
  let bulk=null;
  if(tokens.length>=2){
    bulk={set:new Set(),matched:[],found:new Set()};
    for(const t of divTrucks){
      if(t.is_new)continue;
      const keys=[t.number,dnum(t),String(dnum(t)).replace(/[\s-]/g,"")].map(x=>String(x).toLowerCase());
      const hit=tokens.filter(tk=>keys.includes(tk.toLowerCase()));
      if(hit.length){bulk.set.add(t.org_id+"|"+t.number);bulk.matched.push(t);hit.forEach(tk=>bulk.found.add(tk.toLowerCase()));}
    }
    // para el reporte de faltantes, los números de 1-2 dígitos se asumen conteos de cargas
    bulk.missing=[...new Set(tokens.filter(tk=>!bulk.found.has(tk.toLowerCase())&&!/^\d{1,2}$/.test(tk)))];
  }
  renderBulkBar(bulk);
  const groups={};
  for(const t of divTrucks){
    if(t.is_new)continue; // NEW trucks live in Review until placed
    if(!matchStatus(t))continue;
    if(!matchTypeSel(t))continue;
    if(bulk){if(!bulk.set.has(t.org_id+"|"+t.number))continue;}
    else if(!matchSearch(t,q))continue;
    const a=t.area||"(SIN YARD)";
    if(areaSel.value&&a!==areaSel.value)continue;
    // vista por ZONA: en ALL/SUBS se agrupa por área pura — Cactus, KT e ICs de la
    // misma zona quedan juntos (la compañía va en la etiquetita del chip)
    const g=areaLbl(a);
    (groups[g]=groups[g]||[]).push(t);
  }
  let html="";
  for(const g of Object.keys(groups).sort()){
    const list=groups[g];
    const key=groupKey(g);
    const closed=collapsed.has(key);
    const asig=list.filter(t=>t.state==="a").length;
    const act=list.filter(t=>t.state!=="d"&&!restsToday(t)&&!outOfService(t)).length;
    const full=act>0&&asig>=act;
    html+=`<div class="group ${closed?"closed":""}"><h2 onclick="toggleGroup('${esc(key)}')"><span><span class="chev">${closed?"▸":"▾"}</span>${esc(areaLbl(g))}</span><small class="${full&&!closed?"full":""}">${closed?list.length+(list.length===1?" truck hidden":" trucks hidden"):(full?"✔ COMPLETE":asig+"/"+act+" assigned")}</small></h2><div class="grid">`;
    if(!closed)for(const t of list)html+=chipHtml(t);
    html+="</div></div>";
  }
  $("board").innerHTML=html||"<p style='color:var(--mut);padding:20px'>No results.</p>";
  buildHeader(); renderStatusbar(); renderNet();
}

const OFF_EMOJI={vacation:"🌴",shop:"🔧",down:"⛔",personal:"🏠",no_driver:"⚠",deleased:"🚫"};
function chipHtml(t){
  const rest=restsToday(t);
  const offEntry=offOf(t);
  const off=outOfService(t);
  // orden visual: verde=cubierto, rojo=down HOY, ámbar rayado=no disponible (programado/status)
  const cls=t.state==="a"?"s-a":t.state==="d"?"s-d":(off?"s-off":"");
  const offEmoji=offEntry?(OFF_EMOJI[offEntry.reason]||"⛔"):(off?(OFF_EMOJI[t.status]||"⛔"):"");
  const flag=t.samsara_flag||t.detected_flag;
  const drvChg=t.driver_changed_recent;
  return `<div class="chip ${cls} ${rest?"rest":""}" id="chip-${cssId(t.org_id+"-"+t.number)}" onclick="tapChip('${t.org_id}','${esc(t.number)}')">
    ${t.rip_rap?'<div class="ripflag"></div>':""}
    ${t.state==="a"?`<div class="check ${t.state_source==="auto"?"auto":""}" title="${t.state_source==="auto"?"auto-covered: hauled or assigned today in NewMile":"assigned"}">${t.state_source==="auto"?"⚡":"✓"}</div>`:""}
    ${cls==="s-off"?`<div class="offmark" title="not available">${offEmoji}</div>`:""}
    <button class="btn-edit" onclick="event.stopPropagation();openEdit('${t.org_id}','${esc(t.number)}')" title="Edit">✎</button>
    <button class="btn-down" onclick="tapDown(event,'${t.org_id}','${esc(t.number)}')" title="Mark down">✕</button>
    <div class="top"><span class="num">${esc(dnum(t))}${isVirtual()?`<span class="orgtag ${t.org_id==="KT"?(t.is_sub?"ic":"kt"):(t.is_sub?"sub":"")}">${t.org_id==="KT"?(t.is_sub?"IC":"KT"):(t.is_sub?"SUB":"CACTUS")}</span>`:""}</span>${t.trailer_type?`<span class="trl ${trlClass(t.trailer_type,t.rip_rap)}">${esc(t.trailer_type)}${t.rip_rap?" · RIP":""}${t.tags?" · "+esc(t.tags):""}</span>`:(t.tags?`<span class="trl">${esc(t.tags)}</span>`:"")}</div>
    <div class="drv ${t.driver?"":"none"}">${esc(t.driver)||"⚠ NO DRIVER"}</div>
    ${parkHtml(t)}
    ${actHtml(t)}
    ${hasGPS(t)?`<button class="btn-loc" title="Refresh live GPS" onclick="event.stopPropagation();locateNow('${t.org_id}','${esc(t.number)}')">⟳</button>`:""}
    ${t.state==="d"&&t.state_source==="carry"?`<span class="badge" style="background:var(--red-bg);color:var(--red);">⛔ DOWN since ${mdy(t.down_since)} — confirm driver</span>`:""}
    ${rest?'<span class="badge status">OFF TODAY</span>':""}
    ${(()=>{const o=offOf(t);return o?`<span class="badge status" style="background:#fdeedd;color:#a8622f;">${OFF_LBL[o.reason]||o.reason} ${mdy(o.from_date)}–${mdy(o.to_date)}</span>`:"";})()}
    ${(()=>{const u=!offOf(t)&&upcomingOff(t);return u?`<span class="badge" style="background:#fdf3e3;border:1px solid #c98a2f;color:#8a5a10;" title="scheduled — goes off on ${u.from_date}">${OFF_EMOJI[u.reason]||"🗓"} ${esc(u.reason).toUpperCase()} STARTS ${mdy(u.from_date)}</span>`:"";})()}
    ${off&&!offOf(t)?`<span class="badge status">${STATUS_LBL[t.status]||esc(t.status)}${t.return_date?" · "+esc(t.return_date):""}</span>`:""}
    ${drvChg?`<span class="badge drvchg" title="driver changed">driver changed: was ${esc(drvChg.prev||"?")}</span>`:""}
    ${flag?`<span class="badge flag" onclick="event.stopPropagation();openFlag('${t.org_id}','${esc(t.number)}')">⚑ ${esc(flag)}</span>`:""}
    ${t.suggested_area&&!board.historical?`<span class="badge" style="background:var(--blue-bg);color:var(--blue);cursor:pointer;" onclick="event.stopPropagation();openAreaSuggest('${t.org_id}','${esc(t.number)}')">📍 parks @ ${esc(t.suggested_area)}</span>`:""}
    ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
  </div>`;
}

function renderBanners(){
  let html="";
  const nm=(board.meta||{}).newmile||{};
  if(!nm.connected){
    html+=`<div class="banner new"><b>⚠ NEWMILE IS NOT CONNECTED</b> — roster, activity and auto-cover are frozen. <a class="connect" style="color:var(--red);font-weight:800;" href="${API}/api/newmile/connect">Tap here to sign in</a>.</div>`;
  }
  if(board.historical){
    html+=`<div class="banner off"><b>📅 HISTORY VIEW — ${date}</b> — status and notes as they were that day. ✎ edits apply to the truck as of TODAY.</div>`;
  }
  if(offline){
    const c=localStorage.getItem(CACHE_KEY+":"+ORG);
    const at=c?new Date(JSON.parse(c).at):null;
    html+=`<div class="banner off"><b>OFFLINE</b> — showing the last good data${at?" from "+at.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}):""}. Your taps are saved and upload on their own when signal returns.</div>`;
  }
  // Barra de revisión compacta: una sola línea con contadores; cada uno abre su lista.
  const rv=reviewSets();
  const chips=[
    ["new","⚑ NEW",rv.nuevos.length,"var(--red)","var(--red-bg)"],
    ["removed","❓ REMOVED",rv.bajas.length,"#8a5a10","#fdf3e3"],
    ["rip","🪨 RIP",rv.rip.length,"var(--blue)","var(--blue-bg)"],
    ["area","📍 AREA",rv.areas.length,"var(--blue)","var(--blue-bg)"],
    ["flag","⚑ FLAGS",rv.flags.length,"#7a2fa8","#f3e8fb"],
    ["off","🌴 TIME OFF",rv.offs.length,"#c98a2f","#fdf3e3"]
  ].filter(c=>c[2]>0);
  if(chips.length){
    html+=`<div class="banner" style="background:#fff;border:1.5px solid #cdd3df;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;">
      <b style="font-size:15px;color:var(--mut);">REVIEW</b>`+
      chips.map(c=>`<button onclick="openReview('${c[0]}')" style="border:1.5px solid ${c[3]};background:${c[4]};color:${c[3]};border-radius:999px;padding:5px 12px;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.4px;cursor:pointer;">${c[1]} · ${c[2]}</button>`).join("")+
      `</div>`;
  }
  $("banners").innerHTML=html;
}
function ripEv(t){try{return JSON.parse(t.rip_evidence||"");}catch(e){return null;}}
function reviewSets(){
  const ts=(board&&board.trucks||[]).filter(t=>!t.archived);
  const offs=[];
  for(const t of ts)for(const o of (t.time_off||[]))offs.push({t,o});
  offs.sort((a,b)=>a.o.from_date<b.o.from_date?-1:1);
  return {
    nuevos:ts.filter(t=>t.is_new),
    bajas:ts.filter(t=>t.maybe_removed&&!t.is_new),
    rip:ts.filter(t=>t.rip_suggested&&!t.rip_rap),
    areas:ts.filter(t=>t.suggested_area&&!t.is_new),
    flags:ts.filter(t=>(t.samsara_flag||t.detected_flag)&&!t.is_new),
    offs
  };
}
function openReview(cat){
  const rv=reviewSets();
  if(cat==="off"){ // agenda de descansos: quién está o estará fuera, en orden de fecha
    openModal(`
      <h3>🌴 Scheduled time off</h3>
      <div style="max-height:60vh;overflow:auto;">
        ${rv.offs.map(({t,o})=>`
          <div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eef0f5;">
            <span style="font-family:'Barlow Condensed';font-weight:800;font-size:20px;min-width:86px;">${esc(dnum(t))}</span>
            <span style="flex:1;font-size:13px;color:#4a5164;">${OFF_EMOJI[o.reason]||""} <b>${esc(o.reason.toUpperCase())}</b> ${mdy(o.from_date)} – ${mdy(o.to_date)}${o.created_by?` · by ${esc(o.created_by)}`:""}</span>
            <button class="b-save" style="flex:none;padding:8px 14px;font-size:14px;" onclick="openEdit('${t.org_id}','${esc(t.number)}')">Edit</button>
          </div>`).join("")||"<p style='color:var(--mut)'>Nothing scheduled.</p>"}
      </div>
      <div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
    return;
  }
  const cfg={
    new:{title:"⚑ NEW trucks — assign division + area",list:rv.nuevos,info:t=>`${esc(t.driver||"no driver")}${t.trailer_type?" · "+esc(t.trailer_type):""}${t.suggested_division?" · suggested: <b>"+esc(t.suggested_division)+"</b>":""}`,fn:"openConfirmNew"},
    removed:{title:"❓ Removed? — no longer in the NewMile fleet",list:rv.bajas,info:t=>`${esc(t.driver||"")} · ${esc(tabLbl(t))}`,fn:"openResolveRemoved"},
    rip:{title:"🪨 Hauled RIP RAP — mark as RIP?",list:rv.rip,info:t=>{const ev=ripEv(t);return ev?`${ev.loads} load${ev.loads>1?"s":""} · last ${ev.last}`:"";},fn:"openRipSuggest"},
    area:{title:"📍 Parked in another zone — move area?",list:rv.areas,info:t=>`${esc(areaLbl(t.area||"(SIN YARD)"))} → <b>${esc(t.suggested_area)}</b>`,fn:"openAreaSuggest"},
    flag:{title:"⚑ Detected flags — accept or dismiss",list:rv.flags,info:t=>esc(t.samsara_flag||t.detected_flag),fn:"openFlag"}
  }[cat];
  if(!cfg)return;
  openModal(`
    <h3>${cfg.title}</h3>
    <div style="max-height:60vh;overflow:auto;">
      ${cfg.list.map(t=>`
        <div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eef0f5;">
          <span style="font-family:'Barlow Condensed';font-weight:800;font-size:20px;min-width:86px;">${esc(dnum(t))}</span>
          <span style="flex:1;font-size:13px;color:#4a5164;">${cfg.info(t)}</span>
          <button class="b-save" style="flex:none;padding:8px 14px;font-size:14px;" onclick="${cfg.fn}('${t.org_id}','${esc(t.number)}')">Review</button>
        </div>`).join("")||"<p style='color:var(--mut)'>Nothing pending.</p>"}
    </div>
    <div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
}

function renderStatusbar(){
  const m=(board&&board.meta)||{};
  const nm=m.newmile||{};
  $("nmDot").className="dot"+(nm.connected?" on":"");
  $("nmTxt").innerHTML=nm.connected?("NewMile: "+esc(nm.user||"connected")):`NewMile disconnected — <a class="connect" href="${API}/api/newmile/connect">connect</a>`;
  const last=m.last_sync_activity||m.last_sync_roster;
  $("lastSync").textContent=m.syncing?"⟳ updating…":"last sync: "+fmtTime(last);
  // el server disparó un sync en segundo plano al abrir → recargar en cuanto acabe
  if(m.syncing&&!window._syncPoll){window._syncPoll=setTimeout(()=>{window._syncPoll=null;fetchBoard();},12000);}
}
function renderNet(){
  const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  $("netTxt").textContent=q.length?`⏳ ${q.length} change${q.length>1?"s":""} to upload`:"";
}

function buildHeader(){
  // un tab por división de cada org habilitado (Cactus NORTH/SOUTH, KT POWDERLY/RHOME/WHITEWRIGHT…)
  const tabs=(board&&board.tabs)||((board&&board.divisions)||[]).map(d=>({org_id:ORG,id:d.id,label:d.label}));
  $("fleets").innerHTML=tabs.map(t=>`<button class="fleet-tab ${t.org_id===ORG&&t.id===division?"on":""}" onclick="setTab('${t.org_id}','${t.id}')">${esc(t.label)}</button>`).join("");
  const week=(board&&board.week)||{};
  // ◀ ▶ = semana anterior / siguiente (historial del mes: cualquier fecha guarda su propio día)
  $("days").innerHTML=
    `<button class="day" onclick="shiftWeek(-7)" title="Previous week">◀</button>`+
    DAYS.map(dd=>{
      const iso=week[dd];
      return `<button class="day ${iso===date?"on":""} ${iso===board.today?"today":""}" onclick="setDate('${iso}')" title="${iso||""}">${dd}<small>${iso?Number(iso.slice(8)):""}</small></button>`;
    }).join("")+
    `<button class="day" onclick="shiftWeek(7)" title="Next week">▶</button>`+
    `<button class="day" style="width:auto;padding:2px 9px;border-color:var(--gold);color:var(--gold);" onclick="goTomorrow()" title="Plan tomorrow (next working day)">TMRW</button>`+
    `<button class="day" style="width:auto;padding:0 9px" onclick="openCal()" title="Jump to any date">📅</button>`+
    `<input type="date" id="calJump" style="position:absolute;width:1px;height:1px;opacity:0;" onchange="if(this.value)setDate(this.value)">`+
    (date!==board.today?`<button class="day" style="width:auto;padding:0 10px" onclick="setDate('${board.today}')" title="Back to today">TODAY</button>`:"");
}
function openCal(){
  const c=$("calJump");c.value=date;
  if(c.showPicker)try{c.showPicker();return;}catch(e){}
  c.focus();c.click();
}
function goTomorrow(){
  const d=new Date(board.today+"T12:00:00Z");
  d.setUTCDate(d.getUTCDate()+(d.getUTCDay()===6?2:1)); // sábado brinca al lunes
  setDate(d.toISOString().slice(0,10));
}
function shiftWeek(days){
  const d=new Date(date+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+days);
  setDate(d.toISOString().slice(0,10));
}

function setTab(org,div){
  division=div;
  if(org!==ORG){ORG=org;board=null;render();fetchBoard();}
  else render();
}
// marca el tab activo también para las vistas virtuales (ALL/SUBS traen id===org)
function setDate(iso){if(!iso)return;date=iso;fetchBoard();}

$("btnReset").onclick=()=>{
  const dayName=Object.entries(board.week).find(([,iso])=>iso===date);
  if(!confirm(`Clear ${ORG} ${division} marks — ${dayName?dayName[0]:date} (${date})?`))return;
  for(const t of board.trucks)if(t.division===division){t.state="p";t.state_source=null;}
  queuePush({path:"/api/reset",body:{date,org:ORG,division}});
  render();
};
$("fSearch").oninput=()=>{$("fClear").style.display=$("fSearch").value?"block":"none";render();};
function clearSearch(){$("fSearch").value="";$("fClear").style.display="none";$("fSearch").focus();render();}
let _bulkMatched=[];
function renderBulkBar(bulk){
  const b=$("bulkBar");
  if(!bulk){b.style.display="none";_bulkMatched=[];return;}
  _bulkMatched=bulk.matched;
  const toCover=bulk.matched.filter(t=>t.state!=="a").length;
  b.style.display="flex";
  b.innerHTML=`<b>⚡ Multi-search: ${bulk.matched.length} truck${bulk.matched.length===1?"":"s"} found</b>`+
    (bulk.missing.length?`<span style="color:var(--red);">not on this tab: ${bulk.missing.map(esc).join(", ")}${ORG!=="ALL"?` — <a href="#" onclick="setTab('ALL','ALL');return false;" style="color:var(--blue);font-weight:700;">try ALL</a>`:""}</span>`:"")+
    (toCover?`<button onclick="coverAllBulk()" style="margin-left:auto;border:none;background:var(--green);color:#fff;border-radius:8px;padding:7px 14px;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.4px;cursor:pointer;">✓ COVER ALL (${toCover})</button>`:
      (bulk.matched.length?`<span style="margin-left:auto;color:var(--green);font-weight:700;">✓ all covered</span>`:""));
}
function coverAllBulk(){
  ensureWho();
  for(const t of _bulkMatched){
    if(t.state==="a")continue;
    t.state="a";t.state_source="manual";t.state_by=WHO;
    queuePush({path:"/api/state",body:{date,org:t.org_id,number:t.number,state:"a",by:WHO}});
  }
  render();
}

// ---------- sync ----------
async function syncNow(){
  const b=$("btnSync");b.disabled=true;b.textContent="⟳ Syncing…";
  try{
    const r=await fetch(API+"/api/sync/newmile",{method:"POST"});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){if(confirm("NewMile is not connected. Open the sign-in?"))location.href=API+"/api/newmile/connect";}
    else if(!r.ok)alert("Sync failed: "+(j.error||r.status));
    try{await fetch(API+"/api/sync/samsara",{method:"POST"});}catch(e){}
    await fetchBoard();
  }finally{b.disabled=false;b.textContent="⟳ Sync now";}
}

// ---------- modals ----------
function closeModal(){$("modalBg").classList.remove("show");}
function openModal(html){$("modalBody").innerHTML=html;$("modalBg").classList.add("show");}

function openEdit(org,num){
  const t=truckOf(org,num);if(!t)return;
  const rest=(t.rest_days||"").split(",").map(s=>s.trim()).filter(Boolean);
  const divs=(board.divisions||[]).filter(d=>d.org_id===t.org_id||!d.org_id).map(d=>`<option value="${d.id}" ${t.division===d.id?"selected":""}>${esc(d.label)}</option>`).join("");
  openModal(`
    <h3>✎ Truck ${esc(dnum(t))}</h3>
    <label>Note</label><input type="text" id="eNote" value="${esc(t.note)}" placeholder="in the shop, DEL Zotto only, owner phone…">
    <div class="row2">
      <div><label>Status</label><select id="eStatus">${Object.entries(STATUS_LBL).map(([k,v])=>`<option value="${k}" ${t.status===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div><label>Returns (optional)</label><input type="text" id="eReturn" value="${esc(t.return_date)}" placeholder="7/13"></div>
    </div>
    <label>Days OFF</label>
    <div class="restdays" id="eRest">${DAYS.map(d=>`<label class="${rest.includes(d)?"on":""}" onclick="this.classList.toggle('on')"><input type="checkbox" value="${d}">${d}</label>`).join("")}</div>
    <div class="row2">
      <div><label>Division</label><select id="eDiv">${divs}</select></div>
      <div><label>Area / yard</label><input type="text" id="eArea" value="${esc(t.area)}"></div>
    </div>
    <div class="row2">
      <div><label>Phone</label><input type="text" id="ePhone" value="${esc(t.phone)}"></div>
      <div><label>Tags (3X8, SUBHAULER…)</label><input type="text" id="eTags" value="${esc(t.tags)}"></div>
    </div>
    <div class="row2">
      <div><label>Trailer / truck type</label>
        <input type="text" id="eTrailer" list="trailerTypes" value="${esc(t.trailer_type)}" placeholder="AL-ED, SD Steel, BD…">
        <datalist id="trailerTypes">${TRAILER_TYPES.map(x=>`<option value="${x}">`).join("")}</datalist>
      </div>
      <div><label>Driver</label><input type="text" id="eDriver" value="${esc(t.driver)}"></div>
    </div>
    <div class="chk"><input type="checkbox" id="eRip" ${t.rip_rap?"checked":""}><label for="eRip" style="margin:0;text-transform:none;color:var(--ink);font-size:14px;">Can haul RIP RAP (blue stripe)</label></div>

    <label>Scheduled time off (starts and ends on its own)</label>
    <div id="toList">${(t.time_off||[]).map(o=>`
      <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;">
        <span style="flex:1;">${OFF_LBL[o.reason]||esc(o.reason)} <b>${mdy(o.from_date)} – ${mdy(o.to_date)}</b>${o.note?" · "+esc(o.note):""}</span>
        <button onclick="delTimeOff('${t.org_id}','${esc(t.number)}',${o.id})" style="border:1.5px solid var(--red);color:var(--red);background:none;border-radius:8px;width:26px;height:26px;cursor:pointer;">✕</button>
      </div>`).join("")||"<span style='font-size:12px;color:var(--mut)'>none scheduled</span>"}</div>
    <div class="restdays" style="margin-top:8px;">
      <label onclick="toPreset(0,0)">Today</label>
      <label onclick="toPreset(1,1)">Tomorrow</label>
      <label onclick="toPreset('tw')">This week</label>
      <label onclick="toPreset('nw')">Next week</label>
    </div>
    <div class="row2" style="margin-top:8px;">
      <div><label>From</label><input type="date" id="toFrom" value="${date}"></div>
      <div><label>To</label><input type="date" id="toTo" value="${date}"></div>
    </div>
    <div class="row2" style="margin-top:8px;">
      <div><label>Reason</label><select id="toReason">
        <option value="vacation">🌴 Vacation</option><option value="shop">🔧 Shop</option>
        <option value="down">⛔ Down</option><option value="personal">🏠 Personal</option>
      </select></div>
      <div><label>&nbsp;</label><button class="b-save" style="width:100%;padding:11px;border:none;border-radius:10px;font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;cursor:pointer;" onclick="addTimeOff('${t.org_id}','${esc(t.number)}')">+ Add time off</button></div>
    </div>
    ${t.parked_city?`<p style="font-size:12px;color:var(--mut);margin-top:10px;">📍 parking location (Samsara): <b>${esc(t.parked_city)}</b>${t.parked_at?" · "+new Date(t.parked_at).toLocaleString("en-US",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):""}</p>`:""}
    <div class="actions">
      <button class="b-cancel" onclick="openHistory('${t.org_id}','${esc(t.number)}')">History</button>
      <button class="b-cancel" onclick="closeModal()">Cancel</button>
      <button class="b-save" onclick="saveEdit('${t.org_id}','${esc(t.number)}')">Save</button>
    </div>`);
}
function saveEdit(org,num){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  const rest=[...document.querySelectorAll("#eRest label.on input")].map(i=>i.value).join(",");
  const body={
    note:$("eNote").value, status:$("eStatus").value, return_date:$("eReturn").value,
    rest_days:rest, division:$("eDiv").value, area:$("eArea").value.toUpperCase(),
    phone:$("ePhone").value, tags:$("eTags").value.toUpperCase(), rip_rap:$("eRip").checked?1:0,
    by:WHO
  };
  // solo mandar el tipo/driver si los cambiaste (el tipo manual se blinda contra el sync)
  if($("eTrailer").value!==t.trailer_type)body.trailer_type=$("eTrailer").value;
  if($("eDriver").value!==t.driver)body.driver=$("eDriver").value;
  Object.assign(t,body,{rip_rap:body.rip_rap});
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}`,body});
  closeModal();render();
}

// presets de time off: hoy, mañana, esta semana (hoy→sábado), semana que viene (lun→sáb)
function toPreset(a,b){
  const today=board.today;
  let from,to;
  if(a==="tw"||a==="nw"){
    const d=new Date(today+"T12:00:00Z");const dow=d.getUTCDay();
    const mon=isoShift(today,(dow===0?-6:1-dow)+(a==="nw"?7:0));
    from=a==="nw"?mon:today; to=isoShift(mon,5); // hasta el sábado
  }else{from=isoShift(today,a);to=isoShift(today,b);}
  $("toFrom").value=from;$("toTo").value=to;
}
function addTimeOff(org,num){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  const from=$("toFrom").value,to=$("toTo").value,reason=$("toReason").value;
  if(!from||!to||to<from){alert("Check the dates: To must be on or after From.");return;}
  t.time_off=(t.time_off||[]).concat([{id:-Date.now(),from_date:from,to_date:to,reason,note:""}]);
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/timeoff`,body:{from,to,reason,by:WHO}});
  closeModal();render();
}
function delTimeOff(org,num,id){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  t.time_off=(t.time_off||[]).filter(o=>o.id!==id);
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/timeoff/delete`,body:{id,by:WHO}});
  closeModal();render();
}

async function openHistory(org,num){
  const t=truckOf(org,num);if(!t)return;
  let h={changes:[],activity:[],parking:[]};
  try{h=await(await fetch(`${API}/api/truck/${t.org_id}/${encodeURIComponent(num)}/history`)).json();}catch(e){}
  const fmt=ts=>new Date(ts).toLocaleString("en-US",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  openModal(`
    <h3>History — Truck ${esc(dnum(t))}</h3>
    ${h.parking.length?`<label>Parking locations (GPS)</label><div style="font-size:13px;">${h.parking.map(p=>`${p.date.slice(5)}: <b>${esc(p.city)}</b>`).join(" · ")}</div>`:""}
    <label>Changes (who and when)</label>
    <div style="font-size:13px;max-height:200px;overflow:auto;">
      ${h.changes.length?h.changes.map(c=>`<div style="padding:3px 0;border-bottom:1px solid #eef0f5;">${fmt(c.ts)} · <b>${esc(c.field)}</b>: "${esc(c.old_value)}" → "${esc(c.new_value)}"${c.changed_by?` · <span style="color:var(--blue)">${esc(c.changed_by)}</span>`:""}</div>`).join(""):"<span style='color:var(--mut)'>no changes on record</span>"}
    </div>
    <label>Recent loads</label>
    <div style="font-size:13px;max-height:140px;overflow:auto;">
      ${h.activity.length?h.activity.map(a=>`<div>${a.load_date.slice(5)}: ${a.loads} load${a.loads>1?"s":""}${a.driver?" · "+esc(a.driver):""}</div>`).join(""):"<span style='color:var(--mut)'>no loads</span>"}
    </div>
    <div class="actions"><button class="b-cancel" onclick="openEdit('${t.org_id}','${esc(num)}')">← Edit</button><button class="b-save" onclick="closeModal()">Close</button></div>`);
}

function openRipSuggest(org,num){
  const t=truckOf(org,num);if(!t)return;
  const ev=ripEv(t);
  openModal(`
    <h3>🪨 RIP RAP — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:14px;">Per NewMile it hauled rip rap${ev?`: <b>${ev.loads} load${ev.loads>1?"s":""}</b> between ${ev.first} and ${ev.last} (${(ev.materials||[]).map(esc).join(", ")})`:""}.</p>
    <p style="font-size:13px;color:var(--mut);">Accepting marks it RIP (blue stripe + counted as RIP-capable). Your mark rules: this only suggests.</p>
    <div class="actions">
      <button class="b-cancel" onclick="applyRip('${t.org_id}','${esc(num)}','dismiss')">Can&#39;t / dismiss</button>
      <button class="b-save" style="background:var(--blue)" onclick="applyRip('${t.org_id}','${esc(num)}','accept')">Yes, mark RIP</button>
    </div>`);
}
function applyRip(org,num,action){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  if(action==="accept"){t.rip_rap=1;}
  t.rip_suggested=0;
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/rip`,body:{action,by:WHO}});
  closeModal();render();
}

function openAreaSuggest(org,num){
  const t=truckOf(org,num);if(!t)return;
  openModal(`
    <h3>📍 Truck ${esc(dnum(t))} — parking: ${esc(t.suggested_area)}</h3>
    <p style="font-size:14px;">End-of-day parking location (Samsara GPS): <b>${esc(t.suggested_area)}</b> — but you have it under <b>${esc(areaLbl(t.area||"(SIN YARD)"))}</b>.</p>
    <div class="actions">
      <button class="b-cancel" onclick="applyAreaSuggest('${t.org_id}','${esc(num)}','dismiss')">Leave it where it is</button>
      <button class="b-save" onclick="applyAreaSuggest('${t.org_id}','${esc(num)}','accept')">Move it to ${esc(t.suggested_area)}</button>
    </div>`);
}
function applyAreaSuggest(org,num,action){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  if(action==="accept"){t.area=t.suggested_area;}
  t.suggested_area="";
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/area-suggest`,body:{action,by:WHO}});
  closeModal();render();
}

function openConfirmNew(org,num){
  const t=truckOf(org,num);if(!t)return;
  const divs=(board.divisions||[]).filter(d=>d.org_id===t.org_id||!d.org_id).map(d=>`<option value="${d.id}" ${(t.suggested_division||"")===d.id?"selected":""}>${esc(d.label)}</option>`).join("");
  openModal(`
    <h3>⚑ NEW — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:14px;color:var(--mut);">${esc(t.driver||"no driver")}${t.trailer_type?" · "+esc(t.trailer_type):""}${t.suggested_division?" · Samsara suggests: <b>"+esc(t.suggested_division)+"</b>":""}</p>
    <label>Division</label><select id="cnDiv">${divs}</select>
    <label>Area / yard</label><input type="text" id="cnArea" placeholder="PARIS, TYLER, CORSICANA…" value="${esc(t.area==="(SIN YARD)"?"":t.area)}">
    <div class="actions">
      <button class="b-cancel" onclick="closeModal()">Later</button>
      <button class="b-save" onclick="confirmNew('${t.org_id}','${esc(t.number)}')">Confirm</button>
    </div>`);
}
function confirmNew(org,num){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  const division_=$("cnDiv").value, area=$("cnArea").value.toUpperCase();
  Object.assign(t,{is_new:0,division:division_,area:area||t.area});
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/confirm-new`,body:{division:division_,area,by:WHO}});
  closeModal();render();
}

function openResolveRemoved(org,num){
  const t=truckOf(org,num);if(!t)return;
  openModal(`
    <h3>Removed? — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:14px;color:var(--mut);">No longer in the NewMile fleet. Nothing gets deleted on its own: you decide.</p>
    <div class="actions">
      <button class="b-cancel" onclick="resolveRemoved('${t.org_id}','${esc(t.number)}','keep')">Still active</button>
      <button class="b-save" style="background:var(--red)" onclick="resolveRemoved('${t.org_id}','${esc(t.number)}','archive')">Confirm removal</button>
    </div>`);
}
function resolveRemoved(org,num,action){
  const t=truckOf(org,num);if(!t)return;
  if(action==="archive")t.archived=1; t.maybe_removed=0;
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/resolve-removed`,body:{action}});
  closeModal();render();
}

function openFlag(org,num){
  const t=truckOf(org,num);if(!t)return;
  const src=t.samsara_flag?"samsara":"newmile";
  const flag=t.samsara_flag||t.detected_flag;
  openModal(`
    <h3>⚑ Detected flag — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:15px;"><b>"${esc(flag)}"</b> <span style="color:var(--mut)">(from the ${src==="samsara"?"Samsara":"NewMile"} name)</span></p>
    <p style="font-size:13px;color:var(--mut);">Accepting turns it into a status (shop/down/de-leased based on the text) and keeps the text as the status note.</p>
    <div class="actions">
      <button class="b-cancel" onclick="applyFlag('${t.org_id}','${esc(t.number)}','${src}','dismiss')">Dismiss</button>
      <button class="b-save" onclick="applyFlag('${t.org_id}','${esc(t.number)}','${src}','accept')">Accept flag</button>
    </div>`);
}
function applyFlag(org,num,source,action){
  const t=truckOf(org,num);if(!t)return;
  if(action==="accept"){
    const flag=source==="samsara"?t.samsara_flag:t.detected_flag;
    if(/DELEAS/i.test(flag))t.status="deleased";else if(/SHOP/i.test(flag))t.status="shop";else if(/DOWN/i.test(flag))t.status="down";
    t.status_note=flag;
  }
  if(source==="samsara")t.samsara_flag="";else t.detected_flag="";
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/flag`,body:{source,action}});
  closeModal();render();
}

// ---------- boot ----------
fetchBoard();
setInterval(fetchBoard,5*60*1000); // refresh every 5 min while open
