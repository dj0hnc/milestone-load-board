    <p style="font-size:13px;color:var(--mut);">Accepting marks it RIP (blue stripe + counted as RIP-capable). Your mark rules: this only suggests.</p>
    <div class="actions">
      <button class="b-cancel" onclick="applyRip('${t.org_id}','${esc(num)}','dismiss')">Can&#39;t / dismiss</button>
      <button class="b-save" style="background:var(--blue)" onclick="applyRip('${t.org_id}','${esc(num)}','accept')">Yes, mark RIP</button>
    </div>`);
}
function applyRip(org,num,action){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  if(action==="accept"){t.rip_rap=1;}
  t.rip_suggested=0;

}

function openAreaSuggest(org,num){
  const t=truckOf(org,num);if(!t)return;
  openModal(`
    <h3>📍 Truck ${esc(dnum(t))} — parking: ${esc(t.suggested_area)}</h3>
    <p style="font-size:14px;">End-of-day parking location (Samsara GPS): <b>${esc(t.suggested_area)}</b> — but you have it under <b>${esc(areaLbl(t.area||"(SIN YARD)"))}</b>.</p>
    <div class="actions">
      <button class="b-cancel" onclick="applyAreaSuggest('${t.org_id}','${esc(num)}','dismiss')">Leave it where it is</button>
      <button class="b-save" onclick="applyAreaSuggest('${t.org_id}','${esc(num)}','accept')">Move it to ${esc(t.suggested_area)}</button>

}
function applyAreaSuggest(org,num,action){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  if(action==="accept"){t.area=t.suggested_area;}
  t.suggested_area="";

function openConfirmNew(org,num){
  const t=truckOf(org,num);if(!t)return;
  const divs=(board.divisions||[]).filter(d=>d.org_id===t.org_id||!d.org_id).map(d=>`<option value="${d.id}" ${(t.suggested_division||"")===d.id?"selected":""}>${esc(d.label)}</option>`).join("");
  openModal(`
    <h3>⚑ NEW — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:14px;color:var(--mut);">${esc(t.driver||"no driver")}${trlTxt(t)?" · "+esc(trlTxt(t)):""}${t.suggested_division?" · Samsara suggests: <b>"+esc(t.suggested_division)+"</b>":""}</p>
    <label>Division</label><select id="cnDiv">${divs}</select>
    <label>Area / yard</label><input type="text" id="cnArea" placeholder="PARIS, TYLER, CORSICANA…" value="${esc(t.area==="(SIN YARD)"?"":t.area)}">
    <div class="actions">
      <button class="b-cancel" onclick="closeModal()">Later</button>
      <button class="b-save" onclick="confirmNew('${t.org_id}','${esc(t.number)}')">Confirm</button>
    </div>`);
}
function confirmNew(org,num){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  const division_=$("cnDiv").value, area=$("cnArea").value.toUpperCase();
  Object.assign(t,{is_new:0,division:division_,area:area||t.area});
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/confirm-new`,body:{division:division_,area,by:WHO}});
  closeModal();render();
}

function openResolveRemoved(org,num){
  const t=truckOf(org,num);if(!t)return;
  openModal(`
    <h3>Removed? — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:14px;color:var(--mut);">No longer in the NewMile fleet. Nothing gets deleted on its own: you decide.</p>
    <div class="actions">
      <button class="b-cancel" onclick="resolveRemoved('${t.org_id}','${esc(t.number)}','keep')">Still active</button>
      <button class="b-save" style="background:var(--red)" onclick="resolveRemoved('${t.org_id}','${esc(t.number)}','archive')">Confirm removal</button>
    </div>`);
}
function resolveRemoved(org,num,action){
  const t=truckOf(org,num);if(!t)return;
  if(action==="archive")t.archived=1; t.maybe_removed=0;
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/resolve-removed`,body:{action}});
  closeModal();render();
}

// ---------- 🤠 BOTÓN TONY: "available but not planned" en inglés, un tap ----------
// El tracker ya sabe quién está libre-sin-plan (estado + auto-cover vs NewMile + time-off).
// Este botón arma la lista EN INGLÉS y la deja en el portapapeles, lista para pegarle a Tony.
async function copyTony(){
  const ts=(board&&board.trucks||[]).filter(t=>!t.archived&&!t.is_new&&subOnlyOk(t)&&(isVirtual()||t.division===division));
  const free=[],out=[];
  for(const t of ts){
    const off=outOfService(t),offE=offOf(t),rest=restsToday(t);
    if(t.state==="a")continue;                                  // ya planeada/cubierta
    if(t.state==="d"){out.push(`${dnum(t)} (${t.driver||"no driver"}) — marked X/down today${t.status_note||t.note?": "+(t.status_note||t.note):""}`);continue;}
    if(off||offE||rest){out.push(`${dnum(t)} (${t.driver||"no driver"}) — ${offE?(OFF_LBL[offE.reason]||offE.reason)+" "+mdy(offE.from_date)+"–"+mdy(offE.to_date):(STATUS_LBL[t.status]||t.status)}${t.return_date?" · back "+esc(t.return_date):""}${t.status_note||t.note?" · "+(t.status_note||t.note):""}`);continue;}
    free.push(`${dnum(t)} (${t.driver||"no driver"})${t.note?" — "+t.note:""}`);
  }
  const txt=`Available but not planned — ${mdy(date)}:\n`+(free.length?free.map(s=>"• "+s).join("\n"):"• none — everyone available is planned")+(out.length?`\n\nNot available:\n`+out.map(s=>"• "+s).join("\n"):"");
  try{await navigator.clipboard.writeText(txt);}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);}
  openModal(`<h3>🤠 Tony report — copied ✓</h3><p style="font-size:12px;color:var(--mut);margin-bottom:8px;">already in your clipboard — paste it into the message. This was copied:</p><pre style="white-space:pre-wrap;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:50vh;overflow:auto;">${esc(txt)}</pre><div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
}

// ---------- 📞 TRUCK COMMAND PANEL — the heart of every driver call ----------
// One tap = EVERYTHING about the truck while you talk: call the driver, live status, today's
// order, live location, HOS, last load, time off — plus the full call log with author + time.
function tkAgo(iso){ if(!iso)return ""; const m=Math.round((Date.now()-Date.parse(iso))/60000); if(!isFinite(m)||m<0)return ""; if(m<60)return m+"m ago"; const h=Math.round(m/60); if(h<48)return h+"h ago"; return Math.round(h/24)+"d ago"; }
function openCalls(org,num){
  const t=truckOf(org,num);if(!t)return;
  const st=STATUS_LBL[t.status]||t.status||"OK";
  const stColor=(t.status==="ok"||!t.status)?"var(--green)":(t.status==="down"||t.status==="deleased")?"var(--red)":"#c98a2f";
  const today=t.state==="a"?("✅ COVERED "+(t.state_source==="auto"?"(auto — NewMile)":(t.nm_confirmed?"(confirmed)":"(planned)"))):t.state==="d"?"⛔ X TODAY":"• pending";
  const dest=(t.nm_dest&&t.nm_dest.length)?t.nm_dest.map(d=>[d.c||d.n,d.d||d.m].filter(Boolean).join(" → ")).join("  +  "):"";
  const off=offOf(t);const up=!off&&upcomingOff(t);
  const phone=String(t.phone||"").trim();
  openModal(`<div class="emod-head" style="margin-bottom:8px;">
      <div class="enum">${esc(dnum(t))}</div>
      <div class="esub">${esc(t.driver||"⚠ NO DRIVER")}${trlTxt(t)?" · "+esc(trlTxt(t)):""}${t.tags?" · "+esc(t.tags):""}<br>${esc(areaLbl(t.area||"(NO YARD)"))} · wk ${t.loads_week||0} loads</div>
    </div>
    ${phone?`<a class="callbtn" href="tel:${esc(phone.replace(/[^\d+]/g,""))}">📱 CALL ${esc((t.driver||"DRIVER").split(" ")[0].toUpperCase())} — ${esc(phone)}</a>`:""}
    <div class="tkgrid">
      <div class="tkc"><small>STATUS</small><b style="color:${stColor}">${esc(st)}${t.return_date?" · back "+esc(t.return_date):""}</b>${t.status_note?`<span>${esc(t.status_note)}</span>`:""}</div>
      <div class="tkc"><small>TODAY · ${mdy(date)}</small><b>${today}</b>${dest?`<span>🚚 ${esc(dest)}</span>`:""}</div>
      <div class="tkc"><small>LOCATION</small><b>${esc(t.parked_city||"?")}</b><span>${t.moving?"🟢 moving":"⚪ parked"}${t.samsara_seen_at?" · GPS "+tkAgo(t.samsara_seen_at):" · no GPS"}</span></div>
      <div class="tkc"><small>LAST LOAD</small><b>${t.last_load_date?mdy(t.last_load_date):"—"}</b><span>${t.days_since_last_load!=null?t.days_since_last_load+"d ago":""}</span></div>
      ${off?`<div class="tkc" style="grid-column:1/-1;"><small>TIME OFF</small><b>${OFF_LBL[off.reason]||esc(off.reason)} ${mdy(off.from_date)} – ${mdy(off.to_date)}</b>${off.note?`<span>${esc(off.note)}</span>`:""}</div>`:""}
      ${up?`<div class="tkc" style="grid-column:1/-1;"><small>SCHEDULED</small><b>${esc(String(up.reason).toUpperCase())} starts ${mdy(up.from_date)}</b></div>`:""}
      ${t.note?`<div class="tkc" style="grid-column:1/-1;"><small>NOTE</small><b style="color:#a8622f;">${esc(t.note)}</b></div>`:""}
    </div>
    ${hosHtml(t)||""}
    <div class="tkacts">
      <button onclick="closeModal();openSendTruck('${t.org_id}','${esc(t.number)}')">⚡ Assign</button>
      <button onclick="closeModal();openEdit('${t.org_id}','${esc(t.number)}')">✎ Edit</button>
      ${hasGPS(t)?`<button onclick="closeModal();locateNow('${t.org_id}','${esc(t.number)}')">⟳ GPS</button>`:""}
      ${hasGPS(t)&&t.samsara_id?`<button onclick="closeModal();openCamera('${t.org_id}','${esc(t.number)}')">📷 Cams</button>`:""}
      <button onclick="closeModal();openHistory('${t.org_id}','${esc(t.number)}')">📅 History</button>
    </div>
    <div style="font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:1px;color:var(--mut);margin:10px 0 6px;">📞 CALL LOG — EVERYTHING DISCUSSED WITH THIS DRIVER</div>
    <div id="cFeed" class="cfeed"><p style="color:var(--mut);font-size:13px;">Loading…</p></div>
    <div class="cnew"><input type="text" id="cText" placeholder="What was discussed / note…" maxlength="500" onkeydown="if(event.key==='Enter')saveCall('${t.org_id}','${esc(t.number)}')"><button onclick="saveCall('${t.org_id}','${esc(t.number)}')">SAVE</button></div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px;">signing as <b id="cWho">${esc(localStorage.getItem("ct_author")||"— no name yet —")}</b> · <a href="#" onclick="changeAuthor();return false;">change</a></div>`);
  loadCalls(t.org_id,t.number);
}
async function loadCalls(org,num){
  try{
    const r=await fetch(`${API}/api/truck/${encodeURIComponent(org)}/${encodeURIComponent(num)}/calls`);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"load failed");
    const rows=(j.calls||[]).map(c=>`<div class="cmsg"><div class="cav">${esc((c.author||"?").slice(0,2).toUpperCase())}</div><div><div class="cmeta"><b>${esc(c.author||"?")}</b> · ${tsMdy(c.ts)}${c.kind==="call"?" · 📞 call":" · note"}</div><div class="ctx">${esc(c.text)}</div></div></div>`).join("");
    const el=$("cFeed");if(!el)return;
    el.innerHTML=rows||`<p style="color:var(--mut);font-size:13px;">No notes yet — the first call you log lives here forever.</p>`;
  }catch(e){const el=$("cFeed");if(el)el.innerHTML=`<p style="color:var(--red);font-size:13px;">Could not load: ${esc(e.message||String(e))}</p>`;}
}
function changeAuthor(){
  const n=prompt("Your name? (shows on every note you save)",localStorage.getItem("ct_author")||"");
  if(n&&n.trim()){localStorage.setItem("ct_author",n.trim().slice(0,40));const w=$("cWho");if(w)w.textContent=n.trim().slice(0,40);}
}
async function saveCall(org,num){
  let who=localStorage.getItem("ct_author")||"";
  if(!who){changeAuthor();who=localStorage.getItem("ct_author")||"";if(!who)return;}
  const inp=$("cText");if(!inp)return;
  const text=(inp.value||"").trim();if(!text)return;
  inp.disabled=true;
  try{
    const r=await fetch(`${API}/api/truck/${encodeURIComponent(org)}/${encodeURIComponent(num)}/calls`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({author:who,text:text,kind:"call"})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"save failed");
    inp.value="";
    const t=truckOf(org,num);if(t)t.last_call={ts:j.call.ts,author:who,kind:"call",text:text};
    loadCalls(org,num);render();
  }catch(e){alert("Not saved: "+(e.message||e));}
  finally{inp.disabled=false;const i=$("cText");if(i)i.focus();}
}

function openFlag(org,num){
  const t=truckOf(org,num);if(!t)return;
  const src=t.samsara_flag?"samsara":"newmile";
  const flag=t.samsara_flag||t.detected_flag;
  openModal(`
    <h3>⚑ Detected flag — Truck ${esc(dnum(t))}</h3>
    <p style="font-size:15px;"><b>"${esc(flag)}"</b> <span style="color:var(--mut)">(from the ${src==="samsara"?"Samsara":"NewMile"} name)</span></p>
    <p style="font-size:13px;color:var(--mut);">Accepting turns it into a status (shop/down/de-leased based on the text) and keeps the text as the status note.</p>
    <div class="actions">
      <button class="b-cancel" onclick="applyFlag('${t.org_id}','${esc(t.number)}','${src}','dismiss')">Dismiss</button>
      <button class="b-save" onclick="applyFlag('${t.org_id}','${esc(t.number)}','${src}','accept')">Accept flag</button>
    </div>`);
}
function applyFlag(org,num,source,action){
  const t=truckOf(org,num);if(!t)return;
  if(action==="accept"){
    const flag=source==="samsara"?t.samsara_flag:t.detected_flag;
    if(/DELEAS/i.test(flag))t.status="deleased";else if(/SHOP/i.test(flag))t.status="shop";else if(/DOWN/i.test(flag))t.status="down";
    t.status_note=flag;
  }
  if(source==="samsara")t.samsara_flag="";else t.detected_flag="";
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/flag`,body:{source,action}});
  closeModal();render();
}

// ---------- boot ----------
fetchBoard();
setInterval(()=>{if(!document.hidden)fetchBoard();},60*1000); // refresh every min while visible
// al abrir el cel / regresar a la pestaña: refresh inmediato (y si hay versión nueva, recarga sola)
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&Date.now()-(window._visFetch||0)>8000){window._visFetch=Date.now();fetchBoard();}
});
</script>
