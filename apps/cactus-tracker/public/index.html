<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Milestone Texas Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#31353A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Milestone TX">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Milestone brand: Road / Sand / Stone / Dirt — earthy, grounded, elite.
     Var names kept from the old theme so the whole app recolors at once. */
  --navy:#31353A; --navy2:#3B4046; --gold:#B89A4E; --gold-d:#9C8140;
  --bg:#F2F0EB; --card:#FFFFFF; --ink:#2B2D30; --mut:#8A8D92; --line:#E5E2DB;
  --green:#4E8C63; --green-bg:#EAF2EC; --red:#B0442F; --red-bg:#F7EAE6;
  --blue:#3F7080; --blue-bg:#E9F0F2;
  --sand:#B89A4E; --stone:#7A7D80; --dirt:#8B7355;
  --sh-card:0 1px 2px rgba(45,45,45,.04),0 3px 12px rgba(45,45,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Poppins','Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
header{background:var(--navy);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.3);}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
h1{font-family:'Barlow Condensed';font-weight:800;font-size:26px;letter-spacing:1px;text-transform:uppercase;}
h1 span{color:var(--gold);}
.faltan-pill{margin-left:auto;background:var(--gold);color:var(--navy);font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:.5px;padding:6px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.faltan-pill.ok{background:var(--green);color:#fff;}
.hrow2{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:8px;}
.fleet-tab{font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:1px;text-transform:uppercase;padding:8px 18px;background:transparent;border:none;color:#8f97ab;cursor:pointer;border-bottom:4px solid transparent;}
.fleet-tab.on{color:#fff;border-bottom-color:var(--gold);}
.days{display:flex;gap:5px;margin-left:auto;padding-bottom:6px;}
.day{width:42px;height:40px;border-radius:8px;border:1px solid #3a4460;background:var(--navy2);color:#c6cddd;font-family:'Barlow Condensed';font-weight:700;font-size:13px;cursor:pointer;line-height:1.05;padding:2px 0;}
.day small{display:block;font-size:11px;opacity:.75;font-weight:800;}
.day.on{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.day.today{border-color:var(--gold);}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 70px;}
.progress{background:#e2e5ec;border-radius:999px;height:10px;overflow:hidden;margin-bottom:12px;}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0%;transition:width .3s;}
/* control segmentado de status con contadores */
.seg{display:flex;background:#fff;border:1.5px solid #cdd3df;border-radius:12px;overflow:hidden;margin-bottom:10px;}
.seg button{flex:1;padding:7px 2px 6px;border:none;background:none;color:#5a6275;cursor:pointer;font-family:'Barlow Condensed';font-weight:700;font-size:13.5px;letter-spacing:.4px;display:flex;flex-direction:column;align-items:center;gap:0;border-right:1px solid #e8ebf1;}
.seg button:last-child{border-right:none;}
.seg button span{font-size:15px;font-weight:800;}
.seg button.on{background:var(--navy);color:#fff;}
.seg button.rip.on{background:var(--blue);}
.seg button.off-seg.on{background:#c98a2f;}
.seg button.star-seg.on{background:var(--gold);color:var(--navy);}
/* star vive inline junto al número (ver .chip .num .star-btn en el refresh elite) */
.searchrow select{border:1.5px solid #cdd3df;border-radius:10px;padding:0 8px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;background:#fff;height:44px;}
.grpseg{border:1.5px solid #cdd3df;border-radius:10px;overflow:hidden;}
.grpseg button{flex:1;height:38px;border:none;background:#fff;color:#5a6275;cursor:pointer;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.4px;border-right:1px solid #e8ebf1;}
.grpseg button:last-child{border-right:none;}
.grpseg button.on{background:var(--navy);color:#fff;}
.orgtag{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 5px;border-radius:4px;background:var(--navy);color:#fff;vertical-align:middle;margin-left:6px;}
.orgtag.kt{background:var(--blue);}
.orgtag.ic{background:#7a2fa8;}
.orgtag.sub{background:#5a6275;}
.searchrow{display:flex;gap:8px;margin-bottom:14px;}
.searchrow input{flex:1;padding:11px 14px;border:1.5px solid #cdd3df;border-radius:10px;font-family:'Barlow';font-size:16px;}
.btn-reset{background:none;border:1.5px solid var(--red);color:var(--red);border-radius:10px;padding:0 16px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;text-transform:uppercase;cursor:pointer;}
.faltanBox{background:#fff8e6;border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:none;}
.faltanBox.show{display:block;}
.faltanBox b{font-family:'Barlow Condensed';font-size:18px;letter-spacing:.5px;text-transform:uppercase;color:#8a6a10;}
.faltanBox .chip-mini{display:inline-block;background:#fff;border:1.5px solid #d8c58a;border-radius:6px;padding:3px 10px;margin:6px 6px 0 0;font-weight:700;font-size:14px;cursor:pointer;}
.faltanBox .chip-mini.rip{border-color:var(--blue);color:var(--blue);}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.banner b{font-family:'Barlow Condensed';font-size:18px;letter-spacing:.5px;text-transform:uppercase;}
.banner .chip-mini{display:inline-block;background:#fff;border-radius:6px;padding:3px 10px;margin:6px 6px 0 0;font-weight:700;font-size:14px;cursor:pointer;border:1.5px solid transparent;}
.banner.new{background:var(--red-bg);border:1.5px solid var(--red);}
.banner.new b{color:var(--red);}
.banner.new .chip-mini{border-color:#e2a3a3;color:var(--red);}
.banner.baja{background:#fdf3e3;border:1.5px solid #c98a2f;}
.banner.baja b{color:#8a5a10;}
.banner.baja .chip-mini{border-color:#dcc08a;color:#8a5a10;}
.banner.off{background:#eef0f5;border:1.5px solid #aab2c5;color:#4a5164;}
.group{margin-bottom:20px;}
.group h2{font-family:'Barlow Condensed';font-size:20px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:3px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;}
.group h2 small{font-size:14px;color:var(--mut);font-family:'Barlow Condensed';}
.group h2 small.full{color:var(--green);}
.group h2 .chev{display:inline-block;width:16px;color:var(--gold);font-size:14px;}
.group.closed h2{opacity:.75;border-bottom-style:dashed;}
.group.closed .grid{display:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.chip{background:var(--card);border:2px solid #dde1ea;border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:transform .05s;min-height:78px;}
.chip:active{transform:scale(.97);}
.chip .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding-right:50px;}
.chip .num{font-family:'Barlow Condensed';font-weight:800;font-size:26px;line-height:1;}
.chip .trl{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:5px;background:#eef0f5;color:var(--mut);white-space:nowrap;margin-top:2px;}
.chip .trl.rip{background:var(--blue-bg);color:var(--blue);}
.chip .trl.sd{background:#f3e8fb;color:#7a2fa8;}
.chip .trl.bd{background:#fdeedd;color:#a8622f;}
.chip .drv{font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.25;}
.chip .drv.none{color:#b8853a;font-weight:700;}
.chip .act{font-size:10.5px;color:var(--green);font-weight:700;margin-top:3px;}
.chip .act.warn{color:#b8853a;}
.chip .act.bad{color:var(--red);}
.chip .note{font-size:11px;color:#a8622f;margin-top:3px;line-height:1.25;}
.chip .park{font-size:11px;font-weight:700;color:var(--blue);margin-top:3px;}
/* A DÓNDE VA: la orden NewMile del día, directo en el cuadrito (cliente → destino) */
.chip .dest{font-size:11px;font-weight:700;color:#2456a6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
/* HOS: horas de servicio que le quedan al driver (hoy y de la semana) */
.chip .hos{font-size:10.5px;font-weight:600;color:var(--mut);margin-top:2px;line-height:1.35;}
.chip .hos b.ok{color:var(--green);} .chip .hos b.low{color:#b8853a;} .chip .hos b.out{color:var(--red);}
.chip .park.mut{color:#9aa1b2;font-weight:600;}
.btn-loc{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:12px;cursor:pointer;line-height:1;}
.btn-loc:hover{border-color:var(--blue);color:var(--blue);}
.btn-loc.busy{border-color:var(--blue);color:var(--blue);animation:locspin 1s linear infinite;}
.btn-cam{position:absolute;bottom:6px;right:36px;width:24px;height:24px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;font-size:12px;cursor:pointer;line-height:1;}
.btn-cam:hover{border-color:var(--blue);}
@keyframes locspin{to{transform:rotate(360deg)}}
.syncspin{display:inline-block;animation:locspin 1s linear infinite;}
.chip .badge{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;margin-top:3px;margin-right:4px;}
.chip .badge.drvchg{background:#f3e8fb;color:#7a2fa8;}
.chip .badge.flag{background:var(--red-bg);color:var(--red);cursor:pointer;}
.chip .badge.status{background:#eef0f5;color:#4a5164;}
.chip .ripflag{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:var(--blue);}
.btn-down{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:14px;font-weight:700;cursor:pointer;line-height:1;}
.btn-down:hover{border-color:var(--red);color:var(--red);}
.btn-edit{position:absolute;top:6px;right:36px;width:26px;height:26px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:13px;cursor:pointer;line-height:1;}
.btn-edit:hover{border-color:var(--gold);color:var(--gold);}
/* 📞 + ⚡ live in the BOTTOM-LEFT lane (the top row belongs to the trailer chips — they were
   overlapping on phones). Bottom-right stays reserved for ⟳/📷. Every chip reserves the lane. */
.btn-call{position:absolute;bottom:8px;left:40px;width:26px;height:26px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;font-size:12px;cursor:pointer;line-height:1;}
.btn-call:hover{border-color:#2456a6;}
.btn-zap{position:absolute;bottom:8px;left:8px;width:26px;height:26px;border-radius:8px;border:1.5px solid #d5d9e2;background:#f6f7fa;color:#9aa1b2;font-size:12px;cursor:pointer;line-height:1;}
.btn-zap:hover{border-color:var(--gold);color:var(--gold);}
.chip{padding-bottom:44px;}
/* Truck Command Panel (the 📞 panel): live snapshot grid + action row */
.tkgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px;}
.tkc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:1px;}
.tkc small{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.8px;color:var(--mut);}
.tkc b{font-size:13.5px;line-height:1.25;}
.tkc span{font-size:11.5px;color:var(--mut);}
.tkacts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;}
.tkacts button{flex:1;min-width:72px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 6px;font-family:'Barlow Condensed';font-weight:700;font-size:13px;cursor:pointer;}
.tkacts button:hover{border-color:var(--gold);}
.callbtn{display:block;text-align:center;background:var(--green);color:#fff;border-radius:12px;padding:12px;font-weight:800;font-size:16px;text-decoration:none;margin-bottom:10px;}
/* enlaces cruzados board⇄tracker + switch de tema en el header */
.xlink{font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.6px;color:#c6cddd;border:1px solid #3a4460;border-radius:8px;padding:6px 12px;text-decoration:none;white-space:nowrap;}
.xlink:hover{border-color:var(--gold);color:var(--gold);}
.theme-btn{border:1px solid #3a4460;background:transparent;border-radius:8px;width:34px;height:31px;font-size:14px;cursor:pointer;line-height:1;}
.lastcall{font-size:10.5px;color:#5a6a85;margin-top:4px;line-height:1.3;overflow-wrap:anywhere;}
.lastcall b{color:#2456a6;}
.cfeed{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;margin:8px 0;}
.cmsg{display:flex;gap:8px;background:#f6f8fb;border:1px solid #dfe5ee;border-radius:10px;padding:8px 10px;}
.cav{width:26px;height:26px;min-width:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;font-family:'Barlow Condensed';}
.cmeta{font-size:11px;color:var(--mut);}
.cmeta b{color:#2456a6;}
.ctx{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere;}
.cnew{display:flex;gap:8px;margin-top:4px;}
.cnew input{flex:1;padding:10px 12px;border:1.5px solid #cdd3df;border-radius:10px;font-size:15px;font-family:'Barlow';}
.cnew button{border:none;border-radius:10px;padding:0 16px;font-family:'Barlow Condensed';font-weight:800;font-size:15px;color:#fff;cursor:pointer;background:var(--green);}
.chip.s-a{border-color:var(--green);background:var(--green-bg);}
.chip.s-a .check{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.chip.s-a .check.auto{background:#2456a6;font-size:11px;}
.chip.s-d{border-color:var(--red);background:var(--red-bg);opacity:.7;}
.chip.s-d .num{text-decoration:line-through;color:var(--red);}
.chip.s-d .btn-down{background:var(--red);border-color:var(--red);color:#fff;}
.chip.rest{opacity:.55;background:#eef0f5;}
.chip.status-off{background:#f2f3f6;}
/* no disponible (vacaciones/shop programado/status): ámbar rayado, imposible de confundir */
.chip.s-off{border-color:#c98a2f;background:repeating-linear-gradient(135deg,#f8f3e8,#f8f3e8 9px,#f0e6d0 9px,#f0e6d0 18px);}
.chip.s-off .num{color:#8a5a10;}
.chip.s-off .drv{color:#a8874a;}
.chip.s-off .offmark{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:#c98a2f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--mut);}
.statusbar .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#b02a2a;margin-right:4px;}
.statusbar .dot.on{background:var(--green);}
.btn-sync{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;}
.btn-sync:disabled{opacity:.5;}
a.connect{color:var(--blue);font-weight:700;text-decoration:none;}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px;}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(28,35,51,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px 26px;}
.modal h3{font-family:'Barlow Condensed';font-size:24px;letter-spacing:.5px;margin-bottom:10px;}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;}
.modal input[type=text],.modal select{width:100%;padding:10px 12px;border:1.5px solid #cdd3df;border-radius:10px;font-family:'Barlow';font-size:16px;}
.modal .row2{display:flex;gap:10px;}
.modal .row2>div{flex:1;}
.restdays{display:flex;gap:6px;flex-wrap:wrap;}
.restdays label{display:flex;align-items:center;gap:4px;margin:0;border:1.5px solid #cdd3df;border-radius:8px;padding:6px 10px;font-size:13px;text-transform:none;color:var(--ink);cursor:pointer;}
.restdays label.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.restdays input{display:none;}
.modal .actions{display:flex;gap:10px;margin-top:18px;}
.modal .actions button{flex:1;padding:12px;border-radius:10px;border:none;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;}
.b-save{background:var(--green);color:#fff;}
.b-cancel{background:#eef0f5;color:var(--ink);}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600;}

/* ============================================================
   ELITE REFRESH — Milestone brand (Poppins · Road/Sand/Stone/Dirt)
   Poppins or similar. Layered on top; keeps all class names intact.
   ============================================================ */
/* Poppins everywhere; weight carries the hierarchy (no condensed face). Forzado en TODO
   porque el tema viejo usaba 'Barlow Condensed' inline, que ya no cargamos. */
body,body *{font-family:'Poppins','Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif !important;}
h1,.faltan-pill,.fleet-tab,.day,.seg button,.grpseg button,.btn-sync,.btn-reset,.group h2,.banner b,.faltanBox b,.modal h3,.modal .actions button,.orgtag,.chip .num,.chip .trl{letter-spacing:.2px;}

/* Header — matte charcoal with depth, Sand hairline */
header{background:linear-gradient(180deg,#3A3F44 0%,var(--navy) 100%);padding:14px 18px 0;box-shadow:0 4px 20px rgba(30,32,35,.28);border-bottom:1px solid rgba(184,154,78,.35);}
h1{font-weight:700;font-size:23px;letter-spacing:.4px;text-transform:none;}
h1 span{color:var(--sand);}
.faltan-pill{font-weight:700;font-size:15px;letter-spacing:.3px;padding:8px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(184,154,78,.35);text-transform:uppercase;}
.fleet-tab{font-weight:600;font-size:14px;letter-spacing:.6px;padding:9px 16px;border-bottom-width:3px;transition:color .15s;}
.fleet-tab.on{border-bottom-color:var(--sand);}
.day{border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#D9DCE0;font-weight:600;font-size:12px;transition:transform .05s,background .15s;}
.day:active{transform:scale(.94);}
.day small{font-weight:700;opacity:.8;}
.day.on{background:var(--sand);border-color:var(--sand);color:#2B2D30;font-weight:700;}
.day.today{border-color:var(--sand);}

/* Cards — warm, soft, layered */
.wrap{padding:16px 16px 80px;}
.chip{border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-card);padding:11px 13px;transition:transform .06s,box-shadow .15s;}
.chip:hover{box-shadow:0 2px 4px rgba(45,45,45,.05),0 8px 22px rgba(45,45,45,.09);}
.chip .top{padding-right:72px;flex-wrap:wrap;row-gap:5px;align-items:center;}
.chip .num{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:24px;letter-spacing:0;flex-shrink:0;}
.chip .trl{border-radius:7px;font-weight:600;background:#F1EEE8;color:var(--stone);flex-shrink:0;}
/* ESTADO EN VIVO arriba a la derecha: rodando/parado + en qué va la carga */
.chip .live{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:2px 6px;border-radius:6px;white-space:nowrap;flex-shrink:0;}
.chip .live.mv{background:#E6F4EA;color:#1e7a3c;}
.chip .live.pk{background:#EFEFEC;color:var(--stone);}
.chip .live.ld{background:#E9F0F2;color:#2456a6;}
.grid{gap:12px;}

/* Inline STAR toggle (next to the number) — no more corner overlap */
.chip .num .star-btn{border:none;background:none;cursor:pointer;font-size:18px;line-height:1;padding:0 4px 0 0;color:#CFCabe;vertical-align:baseline;transition:transform .1s;}
.chip .num .star-btn.on{color:var(--sand);text-shadow:0 1px 2px rgba(184,154,78,.4);}
.chip .num .star-btn:active{transform:scale(1.25);}
.chip.starred{border-color:var(--sand);box-shadow:0 0 0 1.5px var(--sand),var(--sh-card);}

/* Corner buttons — ghost, refined, evenly pitched (only edit + down here now) */
.btn-down,.btn-edit,.btn-loc,.btn-cam{border:1px solid var(--line);background:#FAF9F6;color:#A6A29A;border-radius:9px;transition:all .12s;}
.btn-down{top:8px;right:8px;}
.btn-edit{top:8px;right:40px;}
.btn-call{bottom:8px;left:40px;}
.btn-zap{bottom:8px;left:8px;}
.btn-loc{bottom:8px;right:8px;}
.btn-cam{bottom:8px;right:40px;}
/* los botones de esquina (📷 ⟳) flotan sobre el cuadrito: cuando el texto se envuelve se
   encimaban. Se le reserva el carril de abajo-derecha para que NUNCA se toquen. */
.chip.has-btns{padding-bottom:34px;}
.chip .act,.chip .park,.chip .dest,.chip .hos,.chip .drv,.chip .note{overflow-wrap:anywhere;}

/* Segmented controls — pill, tactile */
.seg,.grpseg{border-color:var(--line);border-radius:12px;box-shadow:var(--sh-card);}
.seg button,.grpseg button{color:var(--stone);font-weight:600;border-right-color:var(--line);}
.seg button span{font-weight:700;}
.seg button.on{background:var(--navy);}
.seg button.star-seg.on{background:var(--sand);color:#2B2D30;}
.grpseg button.on{background:var(--navy);}
.searchrow input,.searchrow select,.modal input[type=text],.modal select{border-color:var(--line);border-radius:11px;}
.searchrow input:focus,.searchrow select:focus{outline:none;border-color:var(--sand);box-shadow:0 0 0 3px rgba(184,154,78,.16);}
/* BÚSQUEDA FIJA: pegada justo debajo del header (altura dinámica via --hh); siempre a la
   mano sin scrollear. Fondo opaco para que los cuadritos pasen por debajo limpiamente. */
.searchbar{position:sticky;top:var(--hh,116px);z-index:45;background:var(--bg);padding:10px 0 8px;margin:0 0 6px;}
.searchbar input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);box-shadow:var(--sh-card);}
.searchbar input:focus{outline:none;border-color:var(--sand);box-shadow:0 0 0 3px rgba(184,154,78,.16);}
.btn-sync{background:var(--navy);border-radius:9px;font-weight:600;letter-spacing:.4px;}
.btn-reset{border-radius:10px;font-weight:600;}

/* Group headers — Sand rule, quiet counts */
.group h2{font-weight:700;font-size:16px;letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid var(--sand);color:var(--ink);}
.group h2 small{font-weight:600;}
.group h2 .chev{color:var(--sand);}

/* Banners / faltan — softer */
.banner,.faltanBox{border-radius:13px;box-shadow:var(--sh-card);}
.faltan-pill.ok{background:var(--green);}
.progress{background:#E5E2DB;border-radius:999px;}
.progress i{background:linear-gradient(90deg,var(--sand),var(--green));}
.modal{border-radius:18px 18px 0 0;}
.b-save{background:var(--green);}

/* ---- Panel de edición ELITE (el lápiz) ---- */
.emod-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.emod-head .star-big{border:none;background:none;font-size:30px;line-height:1;cursor:pointer;color:#D8D3C6;padding:2px;}
.emod-head .star-big.on{color:var(--sand);text-shadow:0 1px 3px rgba(184,154,78,.45);}
.emod-head .enum{font-size:32px;font-weight:700;line-height:1;}
.emod-head .esub{font-size:13px;color:var(--mut);line-height:1.35;}
.emod-park{font-size:12.5px;color:var(--blue);font-weight:600;margin:2px 0 10px;}
.sec-t{font-size:12px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 7px;}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sttile{border:1.5px solid var(--line);border-radius:12px;background:#FAF9F6;padding:10px 4px 8px;text-align:center;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--stone);transition:all .12s;line-height:1.2;}
.sttile i{display:block;font-style:normal;font-size:21px;margin-bottom:3px;}
.sttile:active{transform:scale(.95);}
.sttile.on{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(45,45,45,.18);}
.sttile.on.st-ok{background:var(--green);}
.sttile.on.st-shop{background:#B07A2A;}
.sttile.on.st-down{background:var(--red);}
.sttile.on.st-no_driver{background:#8A5A10;}
.sttile.on.st-vacation{background:#3F8080;}
.sttile.on.st-deleased{background:#5A5F66;}
.emod details{border:1.5px solid var(--line);border-radius:12px;background:#FAF9F6;margin-top:14px;}
.emod details summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:13.5px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px;}
.emod details summary::-webkit-details-marker{display:none;}
.emod details summary:after{content:"▸";margin-left:auto;color:var(--sand);transition:transform .15s;}
.emod details[open] summary:after{transform:rotate(90deg);}
.emod details .inner{padding:0 14px 14px;}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;}
.pillrow .pill{border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:7px 13px;font-size:13px;font-weight:600;color:var(--stone);cursor:pointer;transition:all .1s;}
.pillrow .pill.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.emod .actions{position:sticky;bottom:-26px;background:#fff;padding:12px 0 4px;margin-top:14px;box-shadow:0 -8px 12px -8px rgba(45,45,45,.15);}

/* ---- MOBILE: el board vive en el cel — nada se desborda, el header no se come la
   pantalla, y flotas/días se deslizan de lado en vez de envolverse en 3 renglones. */
/* overflow-x SOLO en html: en body mataría el position:sticky del header */
html{overflow-x:hidden;}
.days{max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.days::-webkit-scrollbar{display:none;}
.days .day{flex-shrink:0;}
@media (max-width:640px){
  header{padding:8px 10px 0;}
  .hrow{gap:8px;flex-wrap:nowrap;}
  h1{font-size:14.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
  .faltan-pill{font-size:12.5px;padding:6px 12px;margin-left:auto;flex-shrink:0;}
  .hrow2{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:2px;margin-top:4px;}
  #fleets{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    width:calc(100% + 20px);margin:0 -10px;padding:0 10px;
    -webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent);}
  #fleets::-webkit-scrollbar{display:none;}
  .fleet-tab{flex-shrink:0;font-size:12.5px;padding:8px 10px;border-bottom-width:3px;}
  .days{margin-left:0;gap:4px;padding-bottom:8px;}
  .day{width:37px;height:37px;font-size:11px;border-radius:9px;}
  .day small{font-size:10px;}
  .wrap{padding:10px 10px 70px;}
  .searchbar{padding:8px 0 6px;}
  .searchbar input{padding:11px 12px;}
  .statusbar{gap:6px;font-size:11px;margin-bottom:8px;}
  .btn-sync{padding:6px 11px;font-size:12px;}
  .seg button{font-size:10.5px;padding:6px 1px 5px;}
  .seg button span{font-size:14px;}
  .searchrow{gap:6px;margin-bottom:10px;}
  .searchrow select{height:40px;font-size:13.5px;padding:0 5px;}
  .btn-reset{padding:0 12px;font-size:13px;}
  .grpseg button{font-size:12.5px;height:36px;}
  .group h2{font-size:14px;}
  .group h2 small{font-size:12px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .chip{padding:9px 10px;min-height:72px;}
  .chip .top{padding-right:60px;}
  .chip .num{font-size:21px;min-width:0;max-width:100%;flex-wrap:wrap;word-break:break-word;}
  .chip .num .star-btn{font-size:16px;}
  .chip .drv{font-size:12.5px;}
  .banner,.faltanBox{padding:10px 12px;}
  .modal{padding:16px 13px 24px;max-height:92vh;}
  footer{font-size:11px;padding:14px 10px;}
}
/* pantallas muy angostas (SE / mini): que sigan cabiendo 2 columnas de cuadritos */
@media (max-width:359px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  h1{font-size:14.5px;}
}

/* ===== 🌙 SKIN LOAD BOARD — navy + oro, el mismo ADN del board. Switch en el header,
   se recuerda por dispositivo (localStorage). El tema claro queda intacto por default. ===== */
body.dark{
  --navy:#141b24; --navy2:#0e1a2e; --gold:#C8991F; --gold-d:#e3b84a;
  --bg:#1C2333; --card:#141b24; --ink:#e8ecf3; --mut:#8f97ab; --line:#2e3a47;
  --green:#22c55e; --green-bg:rgba(34,197,94,.14); --red:#ff6b52; --red-bg:rgba(234,78,44,.16);
  --blue:#5a95f9; --blue-bg:rgba(90,149,249,.14);
  --sand:#e3b84a; --stone:#8f97ab; --dirt:#b08d5f; --warm:#2d2617;
  --sh-card:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.4);
}
:root{--warm:#FDF8EC;}
body.dark .seg,body.dark .grpseg{border-color:#33507a;}
body.dark .seg button{background:#16243c;color:#8f97ab;border-right-color:#22304a;}
body.dark .seg button.on{background:var(--gold);color:#1C2333;}
body.dark .grpseg button{background:#16243c;color:#8f97ab;border-right-color:#22304a;}
body.dark .grpseg button.on{background:var(--gold);color:#1C2333;}
body.dark .searchrow input,body.dark .searchrow select,body.dark .cnew input,
body.dark .modal input[type=text],body.dark .modal input[type=number],body.dark .modal input[type=date],body.dark .modal select{background:#16243c;color:#e8ecf3;border-color:#33507a;}
body.dark .modal{background:#0e1a2e;color:#e8ecf3;}
body.dark .chip{background:var(--card);border-color:#2e3a47;box-shadow:var(--sh-card);}
body.dark .btn-edit,body.dark .btn-down,body.dark .btn-call,body.dark .btn-zap,body.dark .btn-loc,body.dark .btn-cam{background:#0e1a2e;border-color:#33507a;color:#8f97ab;}
body.dark .chip.rest{background:#10151d;}
body.dark .chip.status-off{background:#10151d;}
body.dark .chip.s-off{background:repeating-linear-gradient(135deg,#241f14,#241f14 9px,#2d2617 9px,#2d2617 18px);border-color:#c98a2f;}
body.dark .progress{background:#2e3a47;}
body.dark .cmsg{background:#141b24;border-color:#2e3a47;}
body.dark .cav{background:var(--gold);color:#1C2333;}
body.dark .cmeta b{color:var(--gold-d);}
body.dark .lastcall{color:#8f97ab;} body.dark .lastcall b{color:var(--blue);}
body.dark .chip .note{color:#d8a05f;}
body.dark .restdays label{border-color:#33507a;color:#e8ecf3;}
body.dark footer{color:#5d6578;}
body.dark .day{border-color:#33507a;}
body.dark .theme-btn{border-color:var(--gold);}
</style>

<body>
<header>
  <div class="hrow">
    <h1>MILESTONE TEXAS <span>TRACKER</span></h1>
    <div class="faltan-pill" id="faltanPill" onclick="toggleFaltan()">—</div>
    <a class="xlink" href="/full" target="_blank" title="Open the Load Board">📋 BOARD</a>
    <button class="xlink" style="background:transparent;cursor:pointer;" onclick="copyTony()" title="Copy 'available but not planned' — ready to paste to Tony">🤠 TONY</button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Light/dark theme">🌙</button>
  </div>
  <div class="hrow2">
    <div id="fleets"></div>
    <div class="days" id="days"></div>
  </div>
</header>

<div class="wrap">
  <div class="searchbar" id="searchbar">
    <div style="position:relative;">
      <input id="fSearch" type="text" placeholder="🔍 Search # / driver / area / owner / note…" style="width:100%;padding-right:38px;">
      <button id="fClear" onclick="clearSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:#cdd3df;color:#4a5164;font-size:14px;font-weight:700;cursor:pointer;line-height:1;">✕</button>
    </div>
  </div>
  <div class="statusbar">
    <span><span class="dot" id="nmDot"></span><span id="nmTxt">NewMile…</span></span>
    <span id="lastSync"></span>
    <button class="btn-sync" id="btnSync" onclick="syncNow()">⟳ Sync now</button>
    <span id="netTxt"></span>
  </div>

  <div class="progress"><i id="prog"></i></div>

  <div id="banners"></div>

  <div class="faltanBox" id="faltanBox">
    <b id="faltanTitle"></b>
    <div id="faltanList"></div>
  </div>

  <div class="seg" id="segStatus"></div>

  <div class="searchrow" style="flex-wrap:wrap;">
    <select id="fType" onchange="typeFilter=this.value;render()" style="flex:1;">
      <option value="">Type: all</option>
      <option value="ALED">AL-ED (aluminum)</option>
      <option value="STED">ST-ED (steel)</option>
      <option value="RBED">RB-ED</option>
      <option value="ED">End Dump (any)</option>
      <option value="SD">Super Dump</option>
      <option value="BD">Belly Dump</option>
      <option value="ALTT">AL-TT</option>
      <option value="3X8">3X8</option>
      <option value="SUB">Subhaulers</option>
    </select>
    <select id="fArea" onchange="render()" style="flex:1;max-width:170px;"></select>
    <button class="btn-reset" id="btnReset">Reset day</button>
    <div class="grpseg" style="flex:1 1 100%;display:flex;gap:0;margin-top:2px;">
      <button id="grpZone" onclick="setGroupMode('zone')" title="Group by area/zone">📍 By zone</button>
      <button id="grpOwner" onclick="setGroupMode('owner')" title="Group by truck owner / organization">🏢 By owner</button>
      <button onclick="openOrders()" title="NewMile orders for this day — assign and PUSH" style="color:var(--gold-d);font-weight:800;">📋 Orders</button>
      <button onclick="window.open('report.html?date='+date,'_blank')" title="Daily report — print to PDF or download Excel" style="font-weight:800;">📄 Report</button>
    </div>
  </div>
  <div id="bulkBar" style="display:none;background:var(--blue-bg);border:1.5px solid var(--blue);border-radius:12px;padding:9px 12px;margin:-6px 0 12px;font-size:13.5px;color:var(--blue);align-items:center;gap:10px;flex-wrap:wrap;"></div>

  <div id="board"></div>
</div>
<footer>1 tap = assigned ✓ · tap again = pending · ✕ = down · ✎ = edit · blue ⚡ = auto-covered (hauled or assigned today in NewMile) · saved to the server per date</footer>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<script>
// API base: works mounted at /cactus-tracker/ or standalone at /
const API = location.pathname.replace(/\/(index\.html)?$/, '');
const DAYS = ["Mon","Tue","Wed","Thur","Fri","Sat"];
const STATUS_LBL = {ok:"OK", shop:"IN SHOP", down:"DOWN", no_driver:"NO DRIVER", vacation:"VACATION", deleased:"DE-LEASED"};
const TRAILER_TYPES = ["AL-ED","AL-ED/L","ED","ST-ED","RB-ED","SD Steel","SD Demo","SD","BD","AL-TT","RIP Trl","Demo"];

let board=null;          // last good server payload
let ORG="CACTUS";        // org del tab activo (CACTUS | KT | ...)
let division="NORTH";
let date=null;           // ISO date being viewed
let typeFilter=""; let statusFilter=""; let showFaltan=false;
let offline=false;
// agrupar por ZONA (área/ciudad) o por DUEÑO (organización/truck owner). El dueño mantiene
// juntos todos los trokes de Elaine Raper, Dustin Smith, etc. sin importar dónde duerman.
let groupMode=localStorage.getItem("ct-groupmode")||"owner";
function setGroupMode(m){groupMode=m;localStorage.setItem("ct-groupmode",m);render();}
// FAMILIAS DE ICs: "Salvador Ramirez - CKJ", "Tomas Ramirez - CKJ", "Jose Jesus
// Ramirez - CKJ"… son la MISMA flotilla familiar. Si 2+ dueños distintos comparten el
// apellido (todos "APELLIDO - CKJ"), se agrupan como "RAMIREZ - CKJ" en la vista By
// owner. El dueño real de cada truck se sigue viendo dentro del cuadrito y el lápiz.
let _famMap=null;
function buildFamilies(){
  _famMap=new Map();
  const bySurname=new Map();
  for(const t of (board.trucks||[])){
    const o=(t.owner_name||"").trim();
    const m=o.match(/^(.*\S)\s+(\S+)\s*-\s*CKJ$/i);
    if(!m)continue;
    const key=m[2].toUpperCase()+" - CKJ";
    (bySurname.get(key)||bySurname.set(key,new Set()).get(key)).add(o);
  }
  for(const [key,owners] of bySurname){
    if(owners.size>=2)for(const o of owners)_famMap.set(o,key);
  }
}
function groupOf(t){
  // en modo DUEÑO, un truck sin owner todavía (NewMile no sincronizado) cae a su ZONA en
  // vez de a un blob "(NO OWNER)": así nunca se ve roto, y se reagrupa solo cuando NewMile
  // llene los dueños.
  if(groupMode==="owner"){
    const o=(t.owner_name&&t.owner_name.trim())||"";
    if(!o)return areaLbl(t.area||"(SIN YARD)");
    if(!_famMap)buildFamilies();
    return _famMap.get(o)||o;
  }
  return areaLbl(t.area||"(SIN YARD)");
}

// multi-usuario: cada quien pone su nombre una vez; viaja en cada cambio (auditoría)
let WHO=localStorage.getItem("cactus-who")||"";
function ensureWho(){
  if(WHO)return;
  const n=prompt("Who are you? (your name is stamped on every change you make)")||"";
  WHO=n.trim().slice(0,40);
  if(WHO)localStorage.setItem("cactus-who",WHO);
}

const $=id=>document.getElementById(id);
// 🌙 tema por dispositivo — claro (default de siempre) u oscuro Load Board
function applyTheme(){const d=localStorage.getItem("ct_theme")==="dark";document.body.classList.toggle("dark",d);const b=$("themeBtn");if(b)b.textContent=d?"☀️":"🌙";}
function toggleTheme(){localStorage.setItem("ct_theme",localStorage.getItem("ct_theme")==="dark"?"light":"dark");applyTheme();}
applyTheme();
const CACHE_KEY="cactus-tracker-cache-v1";
const QUEUE_KEY="cactus-tracker-queue-v1";

// ---------- data ----------
let _fetchSeq=0;
async function fetchBoard(){
  const myseq=++_fetchSeq;
  const d=date?("&date="+date):"";
  // FEEDBACK INMEDIATO al tocar un día: mueve el resaltado ya (aunque el server tarde) y
  // marca "cargando" — así nunca se siente congelado mientras Azure despierta.
  if(board){try{buildHeader();}catch(e){}}
  const nt=$("netTxt"); if(nt)nt.textContent="⏳ Loading "+(date||"")+"…";
  // Azure gratis DUERME la app: el primer fetch puede resetear o tardar. Timeout + 1
  // reintento para que un arranque en frío no deje la pantalla pegada en lo viejo.
  let done=false;
  for(let attempt=0; attempt<2 && !done; attempt++){
    try{
      const ctrl=new AbortController();
      const to=setTimeout(()=>ctrl.abort(),15000);
      const r=await fetch(`${API}/api/board?org=${ORG}${d}`,{signal:ctrl.signal});
      clearTimeout(to);
      if(r.status===401){location.href=API+"/login.html";return;}
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      if(myseq!==_fetchSeq)return; // ya salió una navegación más nueva: descarta esta
      board=j;
      if(!date)date=board.date;
      // AUTO-UPDATE: si el server ya trae versión nueva (auto-pull en el laptop),
      // la página se recarga sola una vez — sin F5 manual, sin PowerShell.
      const v=j.meta&&j.meta.version;
      if(v){
        const prev=sessionStorage.getItem("ct-ver");
        if(prev&&prev!==v){sessionStorage.setItem("ct-ver",v);location.reload();return;}
        sessionStorage.setItem("ct-ver",v);
      }
      offline=false;
      localStorage.setItem(CACHE_KEY+":"+ORG,JSON.stringify({at:Date.now(),board}));
      done=true;
    }catch(e){
      if(attempt===0){ // cold start: espera un momento y reintenta antes de rendirse
        if(nt)nt.textContent="⏳ Waking server…";
        await new Promise(r=>setTimeout(r,2500));
        continue;
      }
      // Regla de oro: si la red falla, mostrar la última data buena CON timestamp, nunca inventar.
      const c=localStorage.getItem(CACHE_KEY+":"+ORG);
      if(c&&!board){const j=JSON.parse(c);board=j.board;if(!date)date=board.date;}
      offline=true;
    }
  }
  if(myseq!==_fetchSeq)return;
  render();
}

// ---------- write queue (optimistic, retries when the yard signal comes back) ----------
function queuePush(req){
  const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  q.push(req); localStorage.setItem(QUEUE_KEY,JSON.stringify(q));
  flushQueue();
}
let flushing=false;
async function flushQueue(){
  if(flushing)return; flushing=true;
  try{
    // RE-LEER la cola de localStorage en CADA vuelta: si otro tap agrega algo mientras
    // corre el fetch, no se pierde (antes se cacheaba y se sobrescribía → escrituras perdidas)
    while(true){
      let q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
      if(!q.length)break;
      const req=q[0];
      try{
        const r=await fetch(API+req.path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req.body)});
        if(!r.ok && r.status>=500)throw new Error("server");
      }catch(e){break;} // network down: retry on next flush
      // quita SOLO el primero de la cola ACTUAL (pudo crecer durante el fetch)
      q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]"); q.shift();
      localStorage.setItem(QUEUE_KEY,JSON.stringify(q));
    }

async function camWait(org,num,rid,first){
  const t=truckOf(org,num);
  const show=(secs)=>openModal(`<h3>📷 ${esc(dnum(t))}</h3>
    <p style="font-size:15px;">📡 <b>The camera is uploading the photo…</b></p>
    <p style="font-size:13px;color:var(--mut);">${first&&first.resumed?"Picking up the upload you already started — no restart. ":""}It goes out over the truck's cellular signal${first&&!first.live?" and this one is from an earlier moment, which takes longer":""}. Hanging on — <b>${secs}s</b>.</p>
    <div class="actions"><button class="b-cancel" onclick="closeModal()">Close (it keeps uploading)</button></div>`);
  const t0=Date.now();
  show(0);
  while(Date.now()-t0<180000){
    await new Promise(r=>setTimeout(r,5000));
    if(!document.querySelector(".modal-bg.show"))return; // la cerró: ya no molestamos
    let j={};
    try{
      const r=await fetch(`${API}/api/truck/${org}/${encodeURIComponent(num)}/camera/${encodeURIComponent(rid)}`);

  }
  openModal(`<h3>📷 ${esc(dnum(t))}</h3>
    <p style="font-size:14px;color:var(--amber,#8a5a10);"><b>Still uploading after 3 minutes.</b></p>
    <p style="font-size:13px;color:var(--mut);">Weak cellular signal on the truck. The upload keeps going on its own — hit Retake whenever and it <b>picks up this same photo</b> (it does NOT start over). If it's ready, it shows instantly.</p>
    <div class="actions"><button class="b-save" onclick="openCamera('${org}','${esc(num)}')">↻ Retake</button><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
}

  const virtual=isVirtual();
  const divTrucks=(board.trucks||[]).filter(t=>!t.archived&&subOnlyOk(t)&&(virtual||t.division===division));
  $("btnReset").style.display=virtual?"none":""; // reset es por división concreta

  // FALTAN
  const pend=divTrucks.filter(countsForFaltan);
  const asg=divTrucks.filter(t=>t.state==="a").length;
  const activos=divTrucks.filter(t=>t.state!=="d"&&!restsToday(t)&&!outOfService(t)).length;
  const pill=$("faltanPill");
  if(pend.length===0){pill.className="faltan-pill ok";pill.textContent="✔ ALL COVERED";}
  else{pill.className="faltan-pill";pill.textContent="MISSING "+pend.length;}
  $("prog").style.width=(activos?Math.round(Math.min(asg,activos)/activos*100):100)+"%";

  const fb=$("faltanBox");
  fb.className="faltanBox"+(showFaltan&&pend.length>0?" show":"");
  if(pend.length>0){
    const dayName=Object.entries(board.week).find(([,iso])=>iso===date);
    $("faltanTitle").textContent=`MISSING ${pend.length} — ${dayName?dayName[0]:date} (tap to jump to the truck)`;
    // agrupado por área: de un vistazo dónde falta gente y de dónde jalar trucks libres
    const byArea={};
    for(const t of pend)(byArea[t.area||"(SIN YARD)"]=byArea[t.area||"(SIN YARD)"]||[]).push(t);
    $("faltanList").innerHTML=Object.keys(byArea).sort().map(area=>{
      const list=byArea[area].sort((x,y)=>(y.rip_rap?1:0)-(x.rip_rap?1:0));
      return `<div style="margin-top:8px;"><span style="font-family:'Barlow Condensed';font-weight:700;font-size:14px;color:#8a6a10;">${esc(areaLbl(area))} · ${list.length}</span><br>`+
        list.map(t=>`<span class="chip-mini ${t.rip_rap?"rip":""}" onclick="jumpTo('${t.org_id}','${esc(t.number)}')">${esc(dnum(t))}${t.rip_rap?" · RIP":""}</span>`).join("")+`</div>`;
    }).join("");
  }

  renderBanners();

  // dropdown de áreas de la división actual (conserva la selección)
  const areaSel=$("fArea");
  const areas=[...new Set(divTrucks.map(t=>t.area||"(SIN YARD)"))].sort();
  const curArea=areaSel.value;
  areaSel.innerHTML=`<option value="">Area: all</option>`+areas.map(a=>`<option value="${esc(a)}" ${a===curArea?"selected":""}>${esc(areaLbl(a))}</option>`).join("");

  $("grpZone").classList.toggle("on",groupMode==="zone");
  $("grpOwner").classList.toggle("on",groupMode==="owner");
  renderSeg(divTrucks);
  const q=$("fSearch").value.trim().toLowerCase();
  // MULTI-BÚSQUEDA: pegar una lista ("972 1 927 1 1083 1" o "629 633 1386…") encuentra
  // todos esos trucks a la vez; los números de cargas se ignoran solos (no matchean)
  const tokens=q.split(/[\s,;]+/).filter(Boolean);
  let bulk=null;
  if(tokens.length>=2){
    bulk={set:new Set(),matched:[],found:new Set()};
    for(const t of divTrucks){
      if(t.is_new)continue;
      const keys=[t.number,dnum(t),String(dnum(t)).replace(/[\s-]/g,"")].map(x=>String(x).toLowerCase());
      const hit=tokens.filter(tk=>keys.includes(tk.toLowerCase()));
      if(hit.length){bulk.set.add(t.org_id+"|"+t.number);bulk.matched.push(t);hit.forEach(tk=>bulk.found.add(tk.toLowerCase()));}
    }
    // para el reporte de faltantes, los números de 1-2 dígitos se asumen conteos de cargas
    bulk.missing=[...new Set(tokens.filter(tk=>!bulk.found.has(tk.toLowerCase())&&!/^\d{1,2}$/.test(tk)))];
  }
  renderBulkBar(bulk);
  const groups={};
  for(const t of divTrucks){
    if(t.is_new)continue; // NEW trucks live in Review until placed
    if(!matchStatus(t))continue;
    if(!matchTypeSel(t))continue;
    if(bulk){if(!bulk.set.has(t.org_id+"|"+t.number))continue;}
    else if(!matchSearch(t,q))continue;
    const a=t.area||"(SIN YARD)";
    if(areaSel.value&&a!==areaSel.value)continue;
    // agrupa por DUEÑO (organización) o por ZONA según el toggle. En dueño, todos los
    // trokes de un mismo owner quedan juntos aunque duerman en ciudades distintas.
    const g=groupOf(t);
    (groups[g]=groups[g]||[]).push(t);
  }
  let html="";
  // orden dentro del grupo: primero los útiles, luego SIN DRIVER (consecutivos al final),
  // y los DELEASED hasta abajo. En modo DUEÑO, sub-orden por ÁREA (por organización Y por
  // área). SUBS / (NO OWNER) siempre al final del board.
  const rank=t=>t.status==="deleased"?3:(t.status==="no_driver"||!(t.driver||"").trim())?2:0;
  // INACTIVOS AL FONDO: sin carga en el último mes (o sin carga jamás) se van hasta
  // abajo de su grupo, y un grupo entero inactivo se va hasta abajo del tab. Siguen
  // visibles y buscables — solo dejan de estorbar arriba.
  const inact=t=>(t.days_since_last_load==null||t.days_since_last_load>=30)?1:0;
  const dead=t=>t.days_since_last_load==null?9999:t.days_since_last_load; // días dormido
  const last=g=>g==="SUBS"||g==="(NO OWNER)"?1:0;
  const allInact=g=>groups[g].every(inact)?1:0;
  // grupo dormido: el que lleva MÁS tiempo sin carga se va más abajo (el alfabético no manda)
  const grpDead=g=>Math.min(...groups[g].map(dead));
  const areaCmp=(x,y)=>areaLbl(x.area||"(SIN YARD)").localeCompare(areaLbl(y.area||"(SIN YARD)"));
  for(const g of Object.keys(groups).sort((a,b)=>allInact(a)-allInact(b)||last(a)-last(b)||
      (allInact(a)?grpDead(a)-grpDead(b):0)||a.localeCompare(b))){
    const list=groups[g];
    list.sort((x,y)=>inact(x)-inact(y)||(inact(x)?dead(x)-dead(y):0)||rank(x)-rank(y)||(groupMode==="owner"?areaCmp(x,y):0)||String(dnum(x)).localeCompare(String(dnum(y)),undefined,{numeric:true}));
    const key=groupKey(g);
    const closed=collapsed.has(key);
    const asig=list.filter(t=>t.state==="a").length;
    const act=list.filter(t=>t.state!=="d"&&!restsToday(t)&&!outOfService(t)).length;
    const full=act>0&&asig>=act;
    const sleeping=allInact(g)===1;
    html+=`<div class="group ${closed?"closed":""}"${sleeping?' style="opacity:.72;"':""}><h2 onclick="toggleGroup('${esc(key)}')"><span><span class="chev">${closed?"▸":"▾"}</span>${esc(areaLbl(g))}${sleeping?' <span style="font-size:11px;font-weight:600;color:var(--mut);text-transform:none;letter-spacing:0;">💤 no loads in a month</span>':""}</span><small class="${full&&!closed?"full":""}">${closed?list.length+(list.length===1?" truck hidden":" trucks hidden"):(full?"✔ COMPLETE":asig+"/"+act+" assigned")}</small></h2><div class="grid">`;
    if(!closed)for(const t of list)html+=chipHtml(t);
    html+="</div></div>";
  }
  // buscaste un número que NO existe → ofrecer darlo de alta aquí mismo (truck nuevo
  // recién dado de alta en NewMile, o uno que la limpieza archivó)
  let empty="<p style='color:var(--mut);padding:20px'>No results.</p>";
  if(q&&tokens.length===1&&/^[a-z0-9-]{2,10}$/i.test(q)){
    const qq=q.toUpperCase();
    empty=`<div style="padding:26px 16px;text-align:center;">
      <p style="color:var(--mut);margin-bottom:12px;">No truck matches “${esc(qq)}”.</p>
      <button class="b-save" style="padding:12px 22px;font-size:15px;" onclick="openAddTruck('${esc(qq)}')">➕ ADD TRUCK ${esc(qq)} TO THE BOARD</button>
      <div style="font-size:12px;color:var(--mut);margin-top:8px;">driver &amp; trailer come from NewMile automatically — or it comes back if it was archived</div>
    </div>`;
  }
  $("board").innerHTML=html||empty;
  buildHeader(); renderStatusbar(); renderNet();
}
function openAddTruck(num){
  const divs=(board.divisions||[]);
  const cur=divs.find(d=>d.id===division)||divs[0];
  const opts=divs.map(d=>`<option value="${d.org_id}|${d.id}" ${cur&&d.org_id===cur.org_id&&d.id===cur.id?"selected":""}>${esc(d.org_id)} — ${esc(d.label)}</option>`).join("");
  openModal(`<h3>➕ Add truck ${esc(num)}</h3>
    <p style="font-size:13px;color:var(--mut);">If it exists in NewMile, driver / trailer / owner fill in by themselves. If it was archived here, it just comes back to the board.</p>
    <label>Fleet / division</label><select id="atDiv" style="width:100%;">${opts}</select>
    <div class="actions"><button class="b-cancel" onclick="closeModal()">Cancel</button>
    <button class="b-save" onclick="addTruckGo('${esc(num)}')">Add truck</button></div>`);
}
async function addTruckGo(num){
  ensureWho();
  const [org,div]=$("atDiv").value.split("|");
  try{
    const r=await fetch(`${API}/api/truck/create`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({org,number:num,division:div,by:WHO})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){alert("Could not add: "+(j.error||r.status));return;}
    closeModal();clearSearch();await fetchBoard();
    alert(j.restored?`${num} was already here${j.was_archived?" (archived)":""} — it's back on the board.`:
      `${num} added${j.newmile?` — ${j.newmile.driver||"no driver"} · ${j.newmile.type||""} (from NewMile)`:" (not in NewMile yet — bare entry)"}.`);
  }catch(e){alert("Could not add: no connection");}
}

const OFF_EMOJI={vacation:"🌴",shop:"🔧",down:"⛔",personal:"🏠",no_driver:"⚠",deleased:"🚫"};
// ¿rodando o parado AHORITA? Un equipo APAGADO deja de mandar señal — eso ES estar
// estacionado, así que lectura vieja = PARKED (no esconder). Solo calla sin señal alguna.
function liveMoveHtml(t){
  if(date!==board.today)return "";
  if(!t.moving_at&&!t.samsara_seen_at)return "";
  if(!t.samsara_id&&t.is_sub)return "";
  const at=t.moving_at||t.samsara_seen_at;
  const fresh=Date.now()-Date.parse(at)<=20*60e3;
  if(fresh&&t.moving)return `<span class="live mv" title="rolling right now (Samsara)">▶ MOVING</span>`;
  return `<span class="live pk" title="${fresh?"parked right now (Samsara)":"engine off — parked (last signal "+tsMdy(at)+")"}">■ PARKED</span>`;
}
// en qué va la carga de NewMile ("driving to pickup", "at delivery"…) — solo si va en una
function liveLoadHtml(t){
  const s=t.nm_load_status||"";
  if(!s||date!==board.today)return "";
  const p=s.replace(/^load_/,"").replace(/_/g," ").toUpperCase();
  const ic=/pick/i.test(s)?"⇤":/deliver|drop/i.test(s)?"⇥":"•";
  return `<span class="live ld" title="NewMile load status">${ic} ${esc(p)}</span>`;
}
function chipHtml(t){
  const rest=restsToday(t);
  const offEntry=offOf(t);
  const off=outOfService(t);
  // orden visual: verde=cubierto, rojo=down HOY, ámbar rayado=no disponible (programado/status)
  const cls=t.state==="a"?"s-a":t.state==="d"?"s-d":(off?"s-off":"");
  const offEmoji=offEntry?(OFF_EMOJI[offEntry.reason]||"⛔"):(off?(OFF_EMOJI[t.status]||"⛔"):"");
  const flag=t.samsara_flag||t.detected_flag;
  const drvChg=t.driver_changed_recent;
  return `<div class="chip ${cls} ${rest?"rest":""} ${t.star?"starred":""} ${hasGPS(t)?"has-btns":""}" id="chip-${cssId(t.org_id+"-"+t.number)}" onclick="tapChip('${t.org_id}','${esc(t.number)}')">
    ${t.rip_rap?'<div class="ripflag"></div>':""}
    ${t.state==="a"?`<div class="check ${(t.state_source==="auto"||t.nm_confirmed)?"auto":""}" title="${t.state_source==="auto"?"auto-covered: hauled or assigned in NewMile":(t.nm_confirmed?"planned by you — CONFIRMED in NewMile":"assigned (not yet verified vs NewMile)")}">${(t.state_source==="auto"||t.nm_confirmed)?"⚡":"✓"}</div>`:""}
    ${cls==="s-off"?`<div class="offmark" title="not available">${offEmoji}</div>`:""}
    <button class="btn-zap" onclick="event.stopPropagation();openSendTruck('${t.org_id}','${esc(t.number)}')" title="Assign this truck to a NewMile order">⚡</button>
    <button class="btn-call" onclick="event.stopPropagation();openCalls('${t.org_id}','${esc(t.number)}')" title="Truck panel — call log, status, location, everything">📞</button>
    <button class="btn-edit" onclick="event.stopPropagation();openEdit('${t.org_id}','${esc(t.number)}')" title="Edit">✎</button>
    <button class="btn-down" onclick="tapDown(event,'${t.org_id}','${esc(t.number)}')" title="Mark down">✕</button>
    <div class="top"><span class="num"><button class="star-btn ${t.star?"on":""}" onclick="toggleStar(event,'${t.org_id}','${esc(t.number)}')" title="${t.star?"Star driver — tap to remove":"Mark as star driver"}">${t.star?"★":"☆"}</button>${esc(dnum(t))}${isVirtual()?`<span class="orgtag ${t.org_id==="KT"?(t.is_sub?"ic":"kt"):(t.is_sub?"sub":"")}">${t.org_id==="KT"?(t.is_sub?"IC":"KT"):(t.is_sub?"SUB":"CACTUS")}</span>`:""}</span>${trlTxt(t)?`<span class="trl ${trlClass(t.trailer_type,t.rip_rap)}">${esc(trlTxt(t))}${t.rip_rap?" · RIP":""}${t.tags?" · "+esc(t.tags):""}</span>`:(t.tags?`<span class="trl">${esc(t.tags)}</span>`:"")}${liveMoveHtml(t)}${liveLoadHtml(t)}</div>
    <div class="drv ${t.driver?"":"none"}">${esc(t.driver)||"⚠ NO DRIVER"}</div>
    ${t.state==="a"&&t.nm_dest&&t.nm_dest.length?`<div class="dest" title="${esc(t.nm_dest.map(d=>[d.n,d.c,d.m,d.d].filter(Boolean).join(" · ")).join("  +  "))}">🚚 ${t.nm_dest.map(d=>esc([d.c||d.n,d.d||d.m].filter(Boolean).join(" → "))).join(" + ")}</div>`:""}
    ${hosHtml(t)}
    ${groupMode==="owner"?`<div class="park mut" style="color:#7a2fa8;">📌 zone: ${esc(areaLbl(t.area||"(SIN YARD)"))}</div>`:""}
    ${parkHtml(t)}
    ${actHtml(t)}
    ${hasGPS(t)?`<button class="btn-loc" title="Refresh live GPS + HOS" onclick="event.stopPropagation();locateNow('${t.org_id}','${esc(t.number)}')">⟳</button>`:""}
    ${hasGPS(t)&&t.samsara_id?`<button class="btn-cam" title="Live camera snapshots (road + cab)" onclick="event.stopPropagation();openCamera('${t.org_id}','${esc(t.number)}')">📷</button>`:""}
    ${date===board.today&&!board.historical&&t.samsara_id&&!t.is_sub&&t.samsara_seen_at&&(Date.now()-Date.parse(t.samsara_seen_at))>24*3600e3?`<span class="badge flag" title="no GPS signal in over 24h — tap to re-check right now" onclick="event.stopPropagation();locateNow('${t.org_id}','${esc(t.number)}')">📵 SAMSARA DEAD since ${tsMdy(t.samsara_seen_at)} — camera/cable?</span>`:""}
    ${t.state==="a"&&t.state_source!=="auto"&&!t.nm_confirmed&&board.nm_checked&&!board.historical?`<span class="badge" style="background:#fdf3e3;color:#8a5a10;border:1px solid #c98a2f;">⚠ not in NewMile</span>`:""}
    ${t.state==="d"&&t.state_source==="carry"?`<span class="badge" style="background:var(--red-bg);color:var(--red);">⛔ DOWN since ${mdy(t.down_since)}${lastMovedLbl(t)} — confirm driver</span>`:""}
    ${t.state==="d"&&t.state_source!=="carry"&&t.last_moved_at?`<span class="badge" style="background:var(--red-bg);color:var(--red);">⏱ last moved ${tsMdy(t.last_moved_at)}</span>`:""}
    ${rest?'<span class="badge status">OFF TODAY</span>':""}
    ${(()=>{const o=offOf(t);return o?`<span class="badge status" style="background:#fdeedd;color:#a8622f;">${OFF_LBL[o.reason]||o.reason} ${mdy(o.from_date)}–${mdy(o.to_date)}</span>`:"";})()}
    ${(()=>{const u=!offOf(t)&&upcomingOff(t);return u?`<span class="badge" style="background:#fdf3e3;border:1px solid #c98a2f;color:#8a5a10;" title="scheduled — goes off on ${u.from_date}">${OFF_EMOJI[u.reason]||"🗓"} ${esc(u.reason).toUpperCase()} STARTS ${mdy(u.from_date)}</span>`:"";})()}
    ${off&&!offOf(t)?`<span class="badge status">${STATUS_LBL[t.status]||esc(t.status)}${t.return_date?" · "+esc(t.return_date):""}${lastMovedLbl(t)}</span>`:""}
    ${drvChg?`<span class="badge drvchg" title="driver changed">driver changed: was ${esc(drvChg.prev||"?")}</span>`:""}
    ${flag?`<span class="badge flag" onclick="event.stopPropagation();openFlag('${t.org_id}','${esc(t.number)}')">⚑ ${esc(flag)}</span>`:""}
    ${t.suggested_area&&!board.historical?`<span class="badge" style="background:var(--blue-bg);color:var(--blue);cursor:pointer;" onclick="event.stopPropagation();openAreaSuggest('${t.org_id}','${esc(t.number)}')">📍 parks @ ${esc(t.suggested_area)}</span>`:""}
    ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
    ${t.last_call?`<div class="lastcall">📞 <b>${esc(t.last_call.author||"?")}</b> ${tsMdy(t.last_call.ts)} — ${esc(t.last_call.text)}</div>`:""}
  </div>`;
}

function renderBanners(){
  let html="";
  const nm=(board.meta||{}).newmile||{};
  // BARRA DE PROGRESO del SYNC NOW: cada fase con su palomita y conteo, en vivo
  const sn=(board.meta||{}).sync_now;
  if(sn&&sn.running){
    const P=[["nm","📋 NewMile"],["gps","📡 GPS"],["hos","⏱ Hours"],["daily","📅 Day logs"],["work","🕐 Engine"]];
    const cell=([k,lbl])=>{const p=(sn.parts||{})[k]||{};
      if(p.s==="ok")return `<span style="color:var(--green);font-weight:700;">${lbl} ✓${p.n!=null?" "+p.n:""}</span>`;
      if(p.s==="err")return `<span style="color:var(--red);font-weight:700;" title="${esc(p.msg||"")}">${lbl} ✗</span>`;
      if(p.s==="off")return `<span style="color:var(--mut);">${lbl} —</span>`;
      if(p.s==="run")return `<span style="color:#2456a6;font-weight:700;">${lbl} <span class="syncspin">⟳</span></span>`;
      return `<span style="color:var(--mut);">${lbl} ·</span>`;};
    html+=`<div class="banner" style="background:#EDF2F7;border:1.5px solid #2456a6;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:9px 12px;font-size:13px;">
      <b style="color:#2456a6;">⟳ SYNCING</b> ${P.map(cell).join(" ")}
      <span style="margin-left:auto;color:var(--mut);font-size:11px;">${Math.round((Date.now()-Date.parse(sn.started))/1000)}s</span></div>`;
  }else if(sn&&sn.done_at&&(Date.now()-Date.parse(sn.done_at))<20000){
    const secs=Math.round((Date.parse(sn.done_at)-Date.parse(sn.started))/1000);
    const errs=Object.values(sn.parts||{}).filter(p=>p.s==="err").length;
    html+=`<div class="banner" style="background:${errs?"#fdf3e3":"var(--green-bg)"};border:1.5px solid ${errs?"#c98a2f":"var(--green)"};padding:8px 12px;font-size:13px;">
      <b style="color:${errs?"#8a5a10":"var(--green)"};">${errs?"⚠ SYNC FINISHED WITH "+errs+" ERROR"+(errs>1?"S":""):"✅ SYNC DONE"}</b> in ${secs}s</div>`;
  }
  if(!nm.connected){
    html+=`<div class="banner new"><b>⚠ NEWMILE IS NOT CONNECTED</b> — roster, activity and auto-cover are frozen. <a class="connect" style="color:var(--red);font-weight:800;" href="${API}/api/newmile/connect">Tap here to sign in</a>.</div>`;
  }
  if(board.historical){
    html+=`<div class="banner off"><b>📅 HISTORY VIEW — ${date}</b> — status and notes as they were that day. ✎ edits apply to the truck as of TODAY.</div>`;
  }
  // BLINDAJE: marcados a mano que NO aparecen asignados en NewMile (solo cuando este día
  // ya se cotejó). Estos son los que se te pueden ir — a meterlos a NewMile o despintarlos.
  if(nm.connected&&board.nm_checked&&!board.historical){
    const ghost=(board.trucks||[]).filter(t=>!t.archived&&!t.is_new&&t.state==="a"&&t.state_source!=="auto"&&!t.nm_confirmed&&subOnlyOk(t)&&(isVirtual()||t.division===division));
    if(ghost.length){
      html+=`<div class="banner baja"><b>⚠ PLANNED HERE, NOT IN NEWMILE · ${ghost.length}</b> — you marked these but they are NOT assigned in NewMile for this day:<br>`+
        ghost.map(t=>`<span class="chip-mini" onclick="jumpTo('${t.org_id}','${esc(t.number)}')">${esc(dnum(t))}</span>`).join("")+`</div>`;
    }
  }
  // HUECOS EN ÓRDENES: a estas órdenes de NewMile les faltan trucks este día. El otro lado
  // del blindaje: ni un truck olvidado, ni una orden corta. Tap → panel de órdenes.
  if(nm.connected&&!board.historical&&(board.nm_gaps||[]).length){
    const gaps=board.nm_gaps, totalGap=gaps.reduce((s,g)=>s+(g.gap||0),0);
    html+=`<div class="banner baja" onclick="openOrders()" style="cursor:pointer;"><b>📋 ${gaps.length} ORDER${gaps.length>1?"S":""} STILL SHORT ${totalGap} TRUCK${totalGap!==1?"S":""}</b> — tap to fill:<br>`+
      gaps.slice(0,8).map(g=>`<span class="chip-mini">${esc(g.c||g.n)}${g.m?" · "+esc(g.m):""} · <b>needs ${g.gap}</b></span>`).join("")+
      (gaps.length>8?` <span class="chip-mini">+${gaps.length-8} more…</span>`:"")+`</div>`;
  }
  if(offline){
    const c=localStorage.getItem(CACHE_KEY+":"+ORG);
    const at=c?new Date(JSON.parse(c).at):null;
    html+=`<div class="banner off"><b>OFFLINE</b> — showing the last good data${at?" from "+at.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}):""}. Your taps are saved and upload on their own when signal returns.</div>`;
  }
  // Barra de revisión compacta: una sola línea con contadores; cada uno abre su lista.
  const rv=reviewSets();
  const chips=[
    ["new","⚑ NEW",rv.nuevos.length,"var(--red)","var(--red-bg)"],

function reviewSets(){

  for(const t of ts)for(const o of (t.time_off||[]))offs.push({t,o});
  offs.sort((a,b)=>a.o.from_date<b.o.from_date?-1:1);
  return {
    nuevos:ts.filter(t=>t.is_new),
    bajas:ts.filter(t=>t.maybe_removed&&!t.is_new),
    rip:ts.filter(t=>t.rip_suggested&&!t.rip_rap),
    areas:ts.filter(t=>t.suggested_area&&!t.is_new),
    flags:ts.filter(t=>(t.samsara_flag||t.detected_flag)&&!t.is_new),
    offs
  };
}

let _bulkMatched=[];
// qué es cada FALTANTE de la multi-búsqueda: borrado (restore de un tap), ⚑ nuevo sin
// división, vivo en otro tab, o inexistente. Cache por token para no re-preguntar.
let _bulkInfo={};
async function lookupMissing(missing){
  const need=missing.map(m=>m.toUpperCase()).filter(m=>!(m in _bulkInfo));
  if(!need.length)return;
  need.forEach(m=>_bulkInfo[m]=null); // marcado "buscando" para no duplicar fetches
  try{
    const r=await fetch(`${API}/api/find/bulk`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({numbers:need})});
    const j=await r.json();
    for(const m of need)_bulkInfo[m]=[];
    for(const it of (j.results||[])){if(it.found===false)continue;(_bulkInfo[it.number]=_bulkInfo[it.number]||[]).push(it);}
    render();
  }catch(e){need.forEach(m=>delete _bulkInfo[m]);}
}
function missingLabel(m){
  const inf=_bulkInfo[m.toUpperCase()];
  if(inf===undefined||inf===null)return esc(m); // aún buscando
  if(!inf.length)return `${esc(m)} <i>(not in the tracker — search it alone to ➕ add it)</i>`;
  const t=inf.find(x=>x.archived)||inf[0];
  if(t.archived)return `🗑 <b>${esc(m)}</b> deleted <a href="#" onclick="restoreBulk('${t.org}','${esc(t.real_number)}');return false;" style="color:var(--blue);font-weight:800;">RESTORE</a>`;
  if(t.is_new)return `⚑ <b>${esc(m)}</b> in NEW review (no division yet)`;
  return `${esc(m)} → ${esc(t.org)} ${esc(t.division||"?")}${t.sub?" (SUBS)":""}`;
}
async function restoreBulk(org,num){
  try{
    await fetch(`${API}/api/truck/${org}/${encodeURIComponent(num)}/restore?yes=1`);
    _bulkInfo={};await fetchBoard();
  }catch(e){alert("Could not restore: no connection");}
}
function renderBulkBar(bulk){
  const b=$("bulkBar");
  if(!bulk){b.style.display="none";_bulkMatched=[];return;}
  _bulkMatched=bulk.matched;
  const toCover=bulk.matched.filter(t=>t.state!=="a").length;
  b.style.display="flex";
  b.innerHTML=`<b>⚡ Multi-search: ${bulk.matched.length} truck${bulk.matched.length===1?"":"s"} found</b>`+
    (bulk.missing.length?`<span style="color:var(--red);">missing: ${bulk.missing.map(missingLabel).join(" · ")}${ORG!=="ALL"?` — <a href="#" onclick="setTab('ALL','ALL');return false;" style="color:var(--blue);font-weight:700;">try ALL</a>`:""}</span>`:"")+
    (toCover?`<button onclick="coverAllBulk()" style="margin-left:auto;border:none;background:var(--green);color:#fff;border-radius:8px;padding:7px 14px;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.4px;cursor:pointer;">✓ COVER ALL (${toCover})</button>`:
      (bulk.matched.length?`<span style="margin-left:auto;color:var(--green);font-weight:700;">✓ all covered</span>`:""));
  if(bulk.missing.length)lookupMissing(bulk.missing);
}
function coverAllBulk(){
  ensureWho();
  for(const t of _bulkMatched){
    if(t.state==="a")continue;
    t.state="a";t.state_source="manual";t.state_by=WHO;
    queuePush({path:"/api/state",body:{date,org:t.org_id,number:t.number,state:"a",by:WHO}});
  }
  render();
}

// ---------- sync ----------
// SYNC NOW instantáneo: el server lo corre en el FONDO (NewMile ∥ Samsara en paralelo)
// y aquí solo vamos pintando lo que va aterrizando cada 5 s. Cero pantalla congelada.
async function syncNow(){
  const b=$("btnSync");if(b.disabled)return;
  b.disabled=true;b.textContent="⟳ Syncing…";
  try{
    const r=await fetch(API+"/api/sync/now",{method:"POST"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const t0=Date.now();
    let st=null;
    while(Date.now()-t0<150000){
      await new Promise(rs=>setTimeout(rs,3000));
      await fetchBoard(); // lo que ya llegó se pinta YA + la barra de progreso avanza
      st=(board.meta||{}).sync_now;
      if(!st||!st.running)break;
      const p=st.parts||{};const okN=Object.values(p).filter(x=>x.s==="ok").length;
      b.textContent=`⟳ ${okN}/${Object.keys(p).length}…`;
    }
    if(st&&st.parts&&st.parts.nm&&st.parts.nm.s==="off"){
      if(confirm("NewMile is not connected. Open the sign-in?"))location.href=API+"/api/newmile/connect";
    }
  }catch(e){const nt=$("netTxt");if(nt)nt.textContent="sync failed — check connection";}
  finally{b.disabled=false;b.textContent="⟳ Sync now";render();}
}

function openAddTrucks(orderId){

  renderPick("");
}
function renderPick(q){
  const already=new Set((_pickOrder.assigned||[]).map(a=>(a.org||"")+"|"+(a.number||"")));
  // libres HOY en la fecha vista: sin marcar, sin down, sin off — ordenados por EQUIDAD

  let avail=(board.trucks||[]).filter(t=>!t.archived&&!t.is_new&&t.state==="p"&&!isOffNow(t)&&!already.has(t.org_id+"|"+t.number));
  const qq=(q||"").trim().toLowerCase();
  if(qq)avail=avail.filter(t=>String(dnum(t)).toLowerCase().includes(qq)||(t.driver||"").toLowerCase().includes(qq)||(t.area||"").toLowerCase().includes(qq)||(t.owner_name||"").toLowerCase().includes(qq));

function togglePick(org,num,q){const k=org+"|"+num;_picked.has(k)?_picked.delete(k):_picked.add(k);renderPick(q);}
async function pushAssign(){
  ensureWho();
  const trucks=[..._picked].map(k=>{const[org,number]=k.split("|");return{org,number};});
  const lds=$("pkLds")?$("pkLds").value:"";
  openModal(`<h3>🚀 Pushing ${trucks.length} to NewMile…</h3><p style="color:var(--mut);font-size:14px;">creating + confirming assignments…</p>`);
  try{
    const r=await fetch(`${API}/api/orders/assign`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({order_id:_pickOrder.id,date,trucks,load_limit:lds||undefined,by:WHO})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
    await fetchBoard();
    const msg=[`✅ ${j.pushed} pushed${j.confirmed?" and CONFIRMED (drivers can see them)":" — left as DRAFT, confirm in NewMile"}`];
    if(j.failed&&j.failed.length)msg.push(`⚠ skipped: ${j.failed.map(f=>f.number+" ("+f.reason+")").join(", ")}`);
    if(j.warnings&&j.warnings.length)msg.push(`⚠ ${j.warnings.length} warning(s) from NewMile`);
    openModal(`<h3>🚀 Done</h3>${msg.map(m=>`<p style="font-size:14px;">${esc(m)}</p>`).join("")}<div class="actions"><button class="b-save" onclick="openOrders()">← Orders</button><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
  }catch(e){
    openModal(`<h3>🚀 Push failed</h3><p style="font-size:14px;color:var(--red);">${esc(e.message)}</p><p style="font-size:13px;color:var(--mut);">Nothing was marked locally. Try again or assign in NewMile.</p><div class="actions"><button class="b-cancel" onclick="renderOrders()">← Orders</button><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
  }
}
// ---------- ASIGNAR DESDE EL TRUCK: veo qué anda libre y le busco jale ----------
// El flujo natural del dispatcher, volteado: truck libre → "¿a dónde lo mando?" → tap
// en la orden → PUSH real a NewMile (draft+confirm) → el cuadrito se pone ⚡ solo.
async function openSendTruck(org,num){
  const t=truckOf(org,num);if(!t)return;
  openModal(`<h3>🚀 ${esc(dnum(t))} → order</h3><p style="color:var(--mut);font-size:14px;">Loading NewMile orders for ${mdy(date)}…</p>`);
  try{
    const r=await fetch(`${API}/api/orders?date=${date}`);
    if(r.status===401){openModal(`<h3>🚀 Send to order</h3><p style="font-size:14px;">NewMile is not connected. <a class="connect" href="${API}/api/newmile/connect">Tap here to sign in</a> and try again.</p><div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);return;}
    if(!r.ok)throw new Error("HTTP "+r.status);
    _orders=await r.json();
    renderSendTruck(org,num);
  }catch(e){openModal(`<h3>🚀 Send to order</h3><p style="font-size:14px;color:var(--red);">Could not load orders: ${esc(e.message)}</p><div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);}
}
function renderSendTruck(org,num){
  const t=truckOf(org,num);if(!t)return;
  const os=[...((_orders&&_orders.orders)||[])].filter(o=>!/cancel/i.test(o.status||""));
  const gapOf=o=>o.planned!=null?Math.max(0,o.planned-o.assigned.length):null;
  // con hueco primero (más faltantes arriba); luego las demás por si quiere reforzar una
  os.sort((a,b)=>((gapOf(b)||0)-(gapOf(a)||0))||(a.name>b.name?1:-1));
  const onIt=os.filter(o=>(o.assigned||[]).some(a=>a.org===t.org_id&&a.number===t.number));
  openModal(`<h3>🚀 ${esc(dnum(t))} — where to?</h3>
    <div style="font-size:12.5px;color:var(--stone);margin-bottom:8px;">${esc(t.driver)||"⚠ no driver"}${trlTxt(t)?" · "+esc(trlTxt(t)):""} · ${esc(areaLbl(t.area||"(SIN YARD)"))} · wk ${t.loads_week||0} loads</div>
    ${onIt.length?`<div style="font-size:12.5px;color:#2456a6;font-weight:700;margin-bottom:8px;">already on: ${onIt.map(o=>esc(o.customer||o.name)).join(", ")}</div>`:""}
    ${os.length?"":`<p style="color:var(--mut);font-size:14px;">No NewMile orders for this day yet.</p>`}
    <div style="max-height:52vh;overflow:auto;">
    ${os.map(o=>{const gap=gapOf(o);
      return `<div onclick="sendTruckTo(${o.id},'${t.org_id}','${esc(t.number)}')" style="border:1.5px solid ${gap?"#c98a2f":"var(--line)"};background:${gap?"var(--warm)":"var(--card)"};border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
          <b style="font-size:14.5px;">${esc(o.customer||o.name)}</b>
          <span style="margin-left:auto;font-weight:800;font-size:13px;color:${gap?"var(--gold-d)":"var(--green)"};">${o.assigned.length}${o.planned!=null?"/"+o.planned:""}${gap?` · NEEDS ${gap}`:" · full"}</span>
        </div>
        <div style="font-size:12px;color:var(--stone);margin-top:2px;">${esc(o.material)}${o.qty!=null?` · ${o.qty} ${esc(o.unit)}`:""}${o.dropoff?` · → ${esc(o.dropoff)}`:""}</div>
      </div>`;}).join("")}
    </div>
    <div class="row2" style="margin-top:8px;"><div><label>Loads (optional)</label><input type="number" id="sendLds" placeholder="x3" min="1" style="width:100%;"></div><div></div></div>
    <div class="actions"><button class="b-cancel" onclick="closeModal()">Cancel</button></div>`);
}
async function sendTruckTo(orderId,org,num){
  ensureWho();
  const t=truckOf(org,num);
  const o=((_orders&&_orders.orders)||[]).find(x=>x.id===orderId)||{};
  const lds=$("sendLds")?$("sendLds").value:"";
  if(!confirm(`PUSH ${dnum(t)} → "${o.customer||o.name}" in NewMile?${lds?` (${lds} loads)`:""}`))return;
  openModal(`<h3>🚀 Pushing ${esc(dnum(t))}…</h3><p style="color:var(--mut);font-size:14px;">creating + confirming the assignment…</p>`);
  try{
    const r=await fetch(`${API}/api/orders/assign`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({order_id:orderId,date,trucks:[{org,number:num}],load_limit:lds||undefined,by:WHO})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
    if(j.failed&&j.failed.length)throw new Error(j.failed[0].number+": "+j.failed[0].reason);
    await fetchBoard();
    openModal(`<h3>🚀 Done</h3><p style="font-size:14px;">✅ ${esc(dnum(t))} → <b>${esc(o.customer||o.name)}</b>${j.confirmed?" — CONFIRMED, the driver can see it":" — left as DRAFT, confirm in NewMile"}</p>
      <div class="actions"><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
  }catch(e){
    openModal(`<h3>🚀 Push failed</h3><p style="font-size:14px;color:var(--red);">${esc(e.message)}</p><p style="font-size:13px;color:var(--mut);">Nothing was marked locally.</p>
      <div class="actions"><button class="b-cancel" onclick="renderSendTruck('${org}','${esc(num)}')">← Try again</button><button class="b-cancel" onclick="closeModal()">Close</button></div>`);
  }
}
async function unassignNM(id,orderName){
  if(!confirm(`Remove this truck from "${orderName}" in NewMile?`))return;
  try{
    const r=await fetch(`${API}/api/orders/unassign`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assignment_id:id,date})});
    if(!r.ok){const j=await r.json().catch(()=>({}));alert("Could not remove: "+(j.error||r.status));return;}
    openOrders();
  }catch(e){alert("Could not remove: no connection");}
}

async function removeTruck(org,num){
  const t=truckOf(org,num);
  if(!confirm(`Remove ${dnum(t)} from the board?\n\nNothing is deleted — history stays, and it comes back automatically if it hauls or gets assigned in NewMile again.`))return;
  ensureWho();
  try{
    const r=await fetch(`${API}/api/truck/${org}/${encodeURIComponent(num)}/remove`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({by:WHO})});
    if(!r.ok){const j=await r.json().catch(()=>({}));alert("Could not remove: "+(j.error||r.status));return;}
    closeModal();await fetchBoard();
  }catch(e){alert("Could not remove: no connection");}
}
// tiles de status: un tap pinta el estado con su color; "returns/nota" aparece si no está OK
function pickStatus(k){
  $("eStatus").value=k;
  document.querySelectorAll("#stGrid .sttile").forEach(x=>x.classList.toggle("on",x.dataset.st===k));
  const ex=$("stExtra");if(ex)ex.style.display=k==="ok"?"none":"";
}
function markPill(el){el.parentElement.querySelectorAll(".pill").forEach(p=>p.classList.remove("on"));el.classList.add("on");}
function modalStar(btn,org,num){
  const t=truckOf(org,num);if(!t)return;
  t.star=t.star?0:1;
  btn.classList.toggle("on",!!t.star);
  queuePush({path:`/api/truck/${org}/${encodeURIComponent(num)}`,body:{star:t.star,by:WHO}});
}
function saveEdit(org,num){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  const rest=[...document.querySelectorAll("#eRest label.on input")].map(i=>i.value).join(",");
  const body={
    note:$("eNote").value, status:$("eStatus").value, return_date:$("eReturn").value,
    rest_days:rest, division:$("eDiv").value, area:$("eArea").value.toUpperCase(),
    phone:$("ePhone").value, tags:$("eTags").value.toUpperCase(), rip_rap:$("eRip").checked?1:0,
    by:WHO
  };
  // solo mandar el tipo/driver si los cambiaste (el tipo manual se blinda contra el sync)
  if($("eTrailer").value!==t.trailer_type)body.trailer_type=$("eTrailer").value;
  if($("eTrailer2").value!==(t.trailer_type2||""))body.trailer_type2=$("eTrailer2").value;
  if($("eDriver").value!==t.driver)body.driver=$("eDriver").value;
  Object.assign(t,body,{rip_rap:body.rip_rap});
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}`,body});
  closeModal();render();
}

// presets de time off: hoy, mañana, esta semana (hoy→sábado), semana que viene (lun→sáb)
function toPreset(a,b){
  const today=board.today;
  let from,to;
  if(a==="tw"||a==="nw"){
    const d=new Date(today+"T12:00:00Z");const dow=d.getUTCDay();
    const mon=isoShift(today,(dow===0?-6:1-dow)+(a==="nw"?7:0));
    from=a==="nw"?mon:today; to=isoShift(mon,5); // hasta el sábado
  }else{from=isoShift(today,a);to=isoShift(today,b);}
  $("toFrom").value=from;$("toTo").value=to;
}
function addTimeOff(org,num){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  const from=$("toFrom").value,to=$("toTo").value,reason=$("toReason").value;
  if(!from||!to||to<from){alert("Check the dates: To must be on or after From.");return;}
  t.time_off=(t.time_off||[]).concat([{id:-Date.now(),from_date:from,to_date:to,reason,note:""}]);
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/timeoff`,body:{from,to,reason,by:WHO}});
  closeModal();render();
}
function delTimeOff(org,num,id){
  const t=truckOf(org,num);if(!t)return;
  ensureWho();
  t.time_off=(t.time_off||[]).filter(o=>o.id!==id);
  queuePush({path:`/api/truck/${t.org_id}/${encodeURIComponent(num)}/timeoff/delete`,body:{id,by:WHO}});
  closeModal();render();
}

async function openHistory(org,num){
  const t=truckOf(org,num);if(!t)return;

  try{h=await(await fetch(`${API}/api/truck/${t.org_id}/${encodeURIComponent(num)}/history`)).json();}catch(e){}
  const fmt=ts=>new Date(ts).toLocaleString("en-US",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  openModal(`
    <h3>History — Truck ${esc(dnum(t))}</h3>
    ${h.parking.length?`<label>Parking locations (GPS)</label><div style="font-size:13px;">${h.parking.map(p=>`${p.date.slice(5)}: <b>${esc(p.city)}</b>`).join(" · ")}</div>`:""}
    <label>Changes (who and when)</label>
    <div style="font-size:13px;max-height:200px;overflow:auto;">
      ${h.changes.length?h.changes.map(c=>`<div style="padding:3px 0;border-bottom:1px solid #eef0f5;">${fmt(c.ts)} · <b>${esc(c.field)}</b>: "${esc(c.old_value)}" → "${esc(c.new_value)}"${c.changed_by?` · <span style="color:var(--blue)">${esc(c.changed_by)}</span>`:""}</div>`).join(""):"<span style='color:var(--mut)'>no changes on record</span>"}
    </div>
    <label>Recent loads</label>
    <div style="font-size:13px;max-height:140px;overflow:auto;">
      ${h.activity.length?h.activity.map(a=>`<div>${a.load_date.slice(5)}: ${a.loads} load${a.loads>1?"s":""}${a.driver?" · "+esc(a.driver):""}</div>`).join(""):"<span style='color:var(--mut)'>no loads</span>"}
    </div>
    <div class="actions"><button class="b-cancel" onclick="openEdit('${t.org_id}','${esc(num)}')">← Edit</button><button class="b-save" onclick="closeModal()">Close</button></div>`);
}
