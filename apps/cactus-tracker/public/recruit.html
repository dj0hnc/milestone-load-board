<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤝 Recruiting — Milestone</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Same Milestone tokens as the tracker so both pages feel like one product. */
:root{
  --navy:#31353A; --navy2:#3B4046; --gold:#B89A4E; --gold-d:#9C8140;
  --bg:#F2F0EB; --card:#FFFFFF; --ink:#2B2D30; --mut:#8A8D92; --line:#E5E2DB;
  --green:#4E8C63; --green-bg:#EAF2EC; --red:#B0442F; --red-bg:#F7EAE6;
  --blue:#3F7080; --blue-bg:#E9F0F2; --warm:#FDF8EC; --row-h:#F8F6F1;
  --sh-card:0 1px 2px rgba(20,20,20,.06),0 4px 14px rgba(20,20,20,.07);
}
body.dark{
  --navy:#141b24; --navy2:#0e1a2e; --gold:#C8991F; --gold-d:#e3b84a;
  --bg:#1C2333; --card:#141b24; --ink:#e8ecf3; --mut:#8f97ab; --line:#2e3a47;
  --green:#22c55e; --green-bg:rgba(34,197,94,.14); --red:#ff6b52; --red-bg:rgba(234,78,44,.16);
  --blue:#5a95f9; --blue-bg:rgba(90,149,249,.14); --warm:#2d2617; --row-h:#1a2230;
  --sh-card:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
header{background:var(--navy);color:#fff;padding:12px 14px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:40;}
h1{font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:1px;text-transform:uppercase;}
h1 small{font-weight:600;font-size:14px;color:var(--gold);letter-spacing:1.5px;display:block;line-height:1;}
.hspacer{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.xlink{font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:1px;color:#fff;text-decoration:none;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;background:transparent;cursor:pointer;}
.xlink.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.seg{display:inline-flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;}
.seg button{background:transparent;border:none;color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:1px;padding:6px 14px;cursor:pointer;}
.seg button.on{background:var(--gold);color:var(--navy);}
.funnel{display:flex;gap:6px;padding:10px 14px 2px;overflow-x:auto;}
.fpill{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;box-shadow:var(--sh-card);cursor:pointer;}
.fpill.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}
.fpill.own{background:var(--navy);border-color:var(--navy);}
.fpill.own b,.fpill.own small{color:#fff;}
.fpill.own small{color:var(--gold);}
.fpill b{display:block;font-size:17px;line-height:1.1;}
.fpill small{font-family:'Barlow Condensed';font-weight:700;font-size:10.5px;letter-spacing:.7px;color:var(--mut);white-space:nowrap;}
.fpill.hot{border-color:var(--gold);background:var(--warm);}
main{padding:10px 14px 90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start;}
main.list{display:block;}
.lane{background:transparent;}
.lane-h{font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:4px 2px 8px;}
.lane-h .cnt{background:var(--navy);color:#fff;border-radius:999px;font-size:13px;padding:1px 10px;}
.lane.mine .lane-h{color:var(--gold-d);}
.cardz{display:flex;flex-direction:column;gap:10px;}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--sh-card);cursor:pointer;position:relative;}
.lane.mine .rc{border-left:4px solid var(--gold);}
.rc .co{font-weight:700;font-size:14.5px;line-height:1.25;padding-right:60px;}
.rc .who{font-size:12.5px;color:var(--mut);margin-top:1px;}
.rc .days{position:absolute;top:10px;right:11px;font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--mut);text-align:right;line-height:1.1;}
.rc .days b{display:block;font-size:16px;color:var(--ink);}
.rc .days.slow b{color:var(--red);}
.prog{display:flex;gap:3px;margin-top:8px;}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line);}
.prog i.on{background:var(--green);}
.rowb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.chip{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.4px;border-radius:999px;padding:3px 10px;background:var(--blue-bg);color:var(--blue);white-space:nowrap;}
.chip.due{background:var(--red-bg);color:var(--red);}
.chip.ok{background:var(--green-bg);color:var(--green);}
.chip.dim{background:var(--line);color:var(--mut);}
.callq{margin-left:auto;background:var(--green);color:#fff;border:none;border-radius:999px;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:.5px;padding:5px 13px;cursor:pointer;text-decoration:none;}
.lastn{font-size:11.5px;color:var(--mut);margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{color:var(--mut);font-size:13px;padding:14px 4px;}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#c6cddd;font-size:11.5px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:40;}
/* ---------- LIST view ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.tools input[type=search],.tools select{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;}
.tools input[type=search]{flex:1;min-width:180px;}
.tools select{max-width:170px;}
.tbtn{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:.5px;padding:7px 12px;cursor:pointer;white-space:nowrap;}
.tbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.tbtn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.tbtn.green{background:var(--green);color:#fff;border-color:var(--green);}
.tabl{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-card);overflow:auto;max-height:calc(100vh - 250px);}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:12.5px;}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.8px;text-align:left;padding:9px 8px;white-space:nowrap;cursor:pointer;user-select:none;z-index:2;}
thead th.ns{cursor:default;}
thead th .arr{opacity:.5;font-size:10px;margin-left:3px;}
thead th.sorted{color:var(--gold);}
tbody td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--row-h);}
tbody tr.sel td{background:var(--warm);}
body.dark tbody tr.sel td{background:rgba(200,153,31,.12);}
td .co{font-weight:700;font-size:13px;line-height:1.2;}
td .sub{color:var(--mut);font-size:11.5px;margin-top:1px;}
td a.tel,td a.mail{color:var(--blue);text-decoration:none;font-weight:600;white-space:nowrap;}
td a.mail{font-weight:500;word-break:break-all;}
td .act{display:flex;gap:4px;flex-wrap:nowrap;}
td .act a,td .act button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer;}
td .act a.g{background:var(--green);border-color:var(--green);color:#fff;}
td .stg{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.3px;white-space:nowrap;}
td .d{color:var(--mut);font-size:11px;}
td .d.slow{color:var(--red);font-weight:700;}
td input[type=checkbox],thead input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold);cursor:pointer;}
.mini{display:flex;gap:2px;}
.mini i{width:9px;height:9px;border-radius:2px;background:var(--line);display:inline-block;}
.mini i.on{background:var(--green);}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(44px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border-radius:999px;padding:8px 10px 8px 16px;display:none;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:45;max-width:calc(100vw - 20px);overflow-x:auto;white-space:nowrap;}
.bulk.show{display:flex;}
.bulk b{font-family:'Barlow Condensed';font-size:15px;letter-spacing:.5px;}
.bulk a,.bulk button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:999px;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:.5px;padding:7px 12px;cursor:pointer;text-decoration:none;}
.bulk a.gold{background:var(--gold);color:var(--navy);}
.sumline{font-size:12px;color:var(--mut);margin:0 2px 8px;display:flex;gap:10px;flex-wrap:wrap;}
.sumline b{color:var(--ink);}
/* ---------- catch-up (god mode) ---------- */
.fpill.att{background:var(--red);border-color:var(--red);}
.fpill.att b,.fpill.att small{color:#fff;}
.fpill.warn{background:#C98A2F;border-color:#C98A2F;}
.fpill.warn b,.fpill.warn small{color:#fff;}
.fpill.good{background:var(--green);border-color:var(--green);}
.fpill.good b,.fpill.good small{color:#fff;}
.fpill.zero{opacity:.55;}
.catch{margin:0 14px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh-card);font-size:12.5px;}
.catch .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
.catch .bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s;}
.catch b{font-family:'Barlow Condensed';font-size:15px;letter-spacing:.5px;}
tbody tr td:first-child{box-shadow:inset 4px 0 transparent;}
tbody tr.a0 td:first-child{box-shadow:inset 4px 0 var(--red);}
tbody tr.a1 td:first-child{box-shadow:inset 4px 0 #C98A2F;}
tbody tr.a2 td:first-child{box-shadow:inset 4px 0 var(--blue);}
tbody tr.a3 td:first-child{box-shadow:inset 4px 0 var(--green);}
tbody tr.kb td{outline:2px solid var(--gold);outline-offset:-2px;}
tbody tr.grp td{background:var(--navy2);color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:.8px;padding:6px 10px;cursor:pointer;position:sticky;top:34px;z-index:1;}
tbody tr.grp td .cnt{background:var(--gold);color:var(--navy);border-radius:999px;padding:0 9px;margin-left:8px;font-size:12px;}
tbody tr.grp td .due{color:#ffb4a3;margin-left:8px;font-size:12px;}
.qa{display:flex;gap:3px;margin-top:4px;flex-wrap:nowrap;}
.qa button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.3px;padding:2px 6px;cursor:pointer;white-space:nowrap;}
.qa button.ok{background:var(--green);border-color:var(--green);color:#fff;}
.qa button.na{background:var(--red-bg);border-color:var(--red-bg);color:var(--red);}
body.compact tbody td{padding:3px 6px;font-size:12px;}
body.compact .qa{display:none;}
body.compact tbody tr:hover .qa{display:flex;}
.kbhint{font-size:11px;color:var(--mut);margin-left:auto;white-space:nowrap;}
/* ---------- modal (recruit command panel) ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,30,.55);display:none;z-index:100;overflow-y:auto;padding:20px 12px 40px;}
.modal-bg.show{display:block;}
.modal{max-width:600px;margin:0 auto;background:var(--bg);border-radius:18px;padding:16px;box-shadow:0 18px 60px rgba(0,0,0,.4);}
.m-head{display:flex;align-items:flex-start;gap:10px;}
.m-head h2{font-family:'Barlow Condensed';font-weight:800;font-size:22px;line-height:1.1;letter-spacing:.5px;flex:1;}
.m-x{border:none;background:var(--card);border:1px solid var(--line);color:var(--mut);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;}
.cta{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:7px;margin:12px 0 10px;}
.cta a{display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;padding:11px 8px;font-weight:800;font-size:14px;text-decoration:none;color:#fff;background:var(--navy2);line-height:1.15;}
.cta a.call{background:var(--green);font-size:15px;}
.cta a.off{background:var(--card);color:var(--mut);border:1.5px dashed var(--line);pointer-events:none;}
.tkgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px;}
.tkc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:1px;min-width:0;}
.tkc small{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.8px;color:var(--mut);}
.tkc b{font-size:13px;line-height:1.25;word-break:break-word;}
.tkc.ed{cursor:pointer;border-style:dashed;}
.tkc.ed b:empty::before,.tkc.ed b.ph{content:'tap to add';color:var(--mut);font-weight:500;}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.stp{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;font-size:13px;font-weight:600;}
.stp .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.stp.on{border-color:var(--green);background:var(--green-bg);}
.stp.on .bx{background:var(--green);border-color:var(--green);}
.stp small{display:block;font-weight:400;font-size:10.5px;color:var(--mut);}
.frow{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
.frow label{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.6px;color:var(--mut);}
.frow input[type=date],.frow select{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 9px;font-family:inherit;font-size:13px;max-width:52%;}
.gradbtn{margin-left:auto;background:var(--gold);color:var(--navy);border:none;border-radius:999px;font-family:'Barlow Condensed';font-weight:800;font-size:13.5px;letter-spacing:.5px;padding:8px 14px;cursor:pointer;}
.gradbtn.undone{background:var(--card);color:var(--mut);border:1.5px solid var(--line);}
.sect{font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:1px;color:var(--mut);margin:12px 0 6px;}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.tpl a{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.4px;border-radius:999px;padding:5px 11px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;}
.cfeed{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.cmsg{display:flex;gap:8px;}
.cav{width:30px;height:30px;border-radius:50%;background:var(--navy2);color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cmeta{font-size:10.5px;color:var(--mut);}
.ctx{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:7px 10px;font-size:13px;margin-top:2px;}
.cnew{display:flex;gap:7px;margin-top:10px;}
.cnew input{flex:1;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:14px;}
.cnew button{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:0 16px;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.5px;cursor:pointer;}
.hslink{font-size:12px;color:var(--blue);text-decoration:none;font-weight:600;}
@media(max-width:640px){ main{grid-template-columns:1fr;} h1{font-size:20px;} .tkgrid{grid-template-columns:1fr 1fr;} .cta{grid-template-columns:1fr 1fr;} .tabl{max-height:none;} }
</style>
</head>
<body>
<header>
  <h1>🤝 Recruiting <small>SUBHAULER PIPELINE · JUAN'S DESK</small></h1>
  <div class="hspacer">
    <div class="seg"><button id="vKan" onclick="setView('kanban')">▦ KANBAN</button><button id="vList" onclick="setView('list')">☰ LIST</button></div>
    <a class="xlink gold" id="xlsBtn" href="#" onclick="downloadXlsx();return false;" title="Excel of what you are seeing (with your filters)">⬇ EXCEL</a>
    <a class="xlink" href="./">🌵 TRACKER</a>
    <a class="xlink" href="/full" target="_blank">📋 BOARD</a>
    <button class="xlink" id="themeBtn" onclick="toggleTheme()" title="Light/dark theme">🌙</button>
  </div>
</header>
<div class="funnel" id="funnel"></div>
<div class="catch" id="catch"></div>
<main id="lanes"></main>
<div class="bulk" id="bulk"></div>
<div class="foot"><span id="syncInfo">Loading…</span><span style="margin-left:auto;">signing as <b id="whoami"></b> · <a href="#" style="color:var(--gold);" onclick="changeAuthor();return false;">change</a></span></div>
<div class="modal-bg" id="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="mbox"></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const HS_PORTAL="7373497";
// The six things Juan does to every new sub — his stage IS this checklist.
const STEPS=[
  ["org","NewMile org","company created in NewMile"],
  ["trucks","Trucks created","all their trucks exist"],
  ["users","Users created","logins for everyone"],
  ["drivers","Drivers trained","Driver App at 100%"],
  ["admins","Admins trained","office side at 100%"],
  ["firstload","First load hauled","they ran their first job"]
];
// Subhauler Recruitment stages, in pipeline order — the MOVE control writes these.
const SUB_STAGES=[
  ["1349821618","New Lead Outreach"],["1410103319","Contacted, Awaiting Response"],
  ["1349821620","Qualified + Compliance Review"],["1409282066","Compliance Document Collection"],
  ["1349821621","NetSuite Setup"],["1349821622","Onboarding & NewMile Training"],
  ["1358630992","Cleared Sub / Active"],["1380231940","Looking for Lease On"],
  ["1413127551","No Response"],["1363909224","Disqualified"]
];
const ORDER=["Qualified Lead","New Lead Outreach","Contacted, Awaiting Response","Qualified + Compliance Review","Compliance Document Collection","NetSuite Setup","Onboarding & NewMile Training","Cleared Sub / Active","Looking for Lease On","No Response","Disqualified"];
const stageRank=l=>{const i=ORDER.indexOf(l||"");return i<0?ORDER.length:i;};
// Lane routing by stage label (works for both recruitment pipelines).
function laneOf(r){
  const s=(r.stage_label||"").toLowerCase();
  if(r.local_status==="graduated"||s.includes("cleared"))return "cleared";
  if(s.includes("onboarding"))return "mine";
  if(s.includes("netsuite"))return "incoming";
  return "other";
}
let DATA=null,CUR=null;
// ---------- filters (persist per device) ----------
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const LSs=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
let VIEW=LS("rc_view","list");                 // 'list' | 'kanban' — Juan lives in the list
let OWNER_SEL=LS("rc_owner2","");               // '' = ALL recruiters (default), else name prefix
let STAGE_SEL="";
const F={q:"",market:"",ttype:"",mintrucks:"",only:"",sort:LS("rc_sort","attn"),dir:LS("rc_dir","asc"),closed:LS("rc_closed","0")==="1",group:LS("rc_group","1")==="1",compact:LS("rc_compact","0")==="1"};
const COLL=new Set((LS("rc_coll","")||"").split("|").filter(Boolean));   // collapsed stage groups
let KB=-1;                                        // keyboard-highlighted row (index into the visible list)
const SEL=new Set();                            // deal_ids ticked in the list
function author(){return (DATA&&DATA.identity)||LS("ct_author","")||"";}   // 🪪 login NewMile manda
function changeAuthor(){
  const n=prompt("Your name? (shows on every note you save)",author());
  if(n&&n.trim()){LSs("ct_author",n.trim().slice(0,40));paintWho();}
}
function paintWho(){$("whoami").textContent=author()||"— no name yet —";const w=$("cWho");if(w)w.textContent=author()||"— no name yet —";}

function mdy(iso){if(!iso)return"";const m=String(iso).slice(0,10).split("-");return m.length===3?`${Number(m[1])}/${Number(m[2])}/${m[0].slice(2)}`:iso;}
function daysIn(iso){if(!iso)return null;const d=Math.floor((Date.now()-Date.parse(iso))/864e5);return d<0?0:d;}
function digits(p){let d=String(p||"").replace(/\D/g,"");if(d.length===10)d="1"+d;return d;}
function telHref(p){return "tel:+"+digits(p);}
function smsHref(p,body){return "sms:+"+digits(p)+(body?("?&body="+encodeURIComponent(body)):"");}
function waHref(p,body){return "https://wa.me/"+digits(p)+(body?("?text="+encodeURIComponent(body)):"");}
function mailHref(to,subj,body){return "mailto:"+encodeURIComponent(to||"")+"?subject="+encodeURIComponent(subj||"")+(body?"&body="+encodeURIComponent(body):"");}
function doneCount(r){let n=0;for(const [k] of STEPS)if(r.steps&&r.steps[k])n++;return n;}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function firstName(r){return (r.contact||"").trim().split(/\s+/)[0]||"";}
function whereStr(r){
  const yard=[r.yard_city,r.yard_state].filter(Boolean).join(", ");
  if(yard)return "🅿 "+yard;
  const hs=[r.city||r.market_area||r.location,r.state].filter(Boolean).join(", ");
  return hs||r.market||"";
}
function isDue(r){return !!(r.next_follow&&r.next_follow<=todayISO());}
// ---- catch-up logic: who needs Juan right now ----
const CLOSED=["Disqualified","No Response"];
function isClosed(r){return CLOSED.includes(r.stage_label||"")||r.local_status==="paused";}
function isWorking(r){return !isClosed(r)&&laneOf(r)!=="cleared";}   // anything still moving through the pipeline
function touchedToday(r){return !!(r.last_note&&String(r.last_note.ts).slice(0,10)===todayISO());}
function neverTouched(r){return isWorking(r)&&!(r.notes_count||0)&&!r.next_follow;}
// 0 = overdue / due today · 1 = working but NO follow-up date · 2 = working, follow-up later · 3 = active sub · 4 = closed
function attn(r){if(isClosed(r))return 4;if(laneOf(r)==="cleared")return 3;if(isDue(r))return 0;if(!r.next_follow)return 1;return 2;}
function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function findR(id){return ((DATA&&DATA.recruits)||[]).find(x=>x.deal_id===id)||null;}
// one-tap from the row: log the touch + set the next follow-up, no modal, no typing unless you want to
async function quick(id,kind){
  const r=findR(id);if(!r)return;let who=author();if(!who){changeAuthor();who=author();if(!who)return;}
  let note=null,next=null;
  if(kind==="talked"){const x=prompt("Talked with "+(r.contact||r.company||"them")+" — what was said / next step? (optional)","");if(x==null)return;note="📞 Talked"+(x.trim()?": "+x.trim():"");next=plusDays(7);}
  else if(kind==="noanswer"){note="📵 No answer";next=plusDays(2);}
  else if(kind==="left"){note="📵 Left message / text sent";next=plusDays(3);}
  else if(kind.startsWith("snooze:")){next=plusDays(Number(kind.split(":")[1])||1);}
  else if(kind==="clear"){next="";}
  if(note){r.notes_count=(r.notes_count||0)+1;r.last_note={ts:new Date().toISOString(),author:who,text:note};
    try{await fetch(`api/recruit/${encodeURIComponent(id)}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({author:who,text:note,kind:"call"})});}catch(e){}}
  if(next!==null){r.next_follow=next;
    try{await fetch(`api/recruit/${encodeURIComponent(id)}/set`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({next_follow:next})});}catch(e){}}
  render();
}

function recruiters(){const c={};for(const r of (DATA&&DATA.recruits)||[]){const k=(r.hs_owner||"").split(" ")[0]||"?";c[k]=(c[k]||0)+1;}return Object.entries(c).sort((a,b)=>b[1]-a[1]);}
function subs(){const rs=(DATA&&DATA.recruits)||[];return OWNER_SEL?rs.filter(r=>(r.hs_owner||"").indexOf(OWNER_SEL)===0):rs;}

// what the LIST shows = owner pill ∩ stage pill ∩ toolbar filters
function filtered(){
  let rs=subs();
  if(STAGE_SEL)rs=rs.filter(r=>(r.stage_label||"")===STAGE_SEL);
  if(F.market)rs=rs.filter(r=>(r.market||"")===F.market);
  if(F.ttype)rs=rs.filter(r=>(r.truck_type||r.fleet_size||"")===F.ttype);
  if(F.mintrucks)rs=rs.filter(r=>(Number(r.trucks)||0)>=Number(F.mintrucks));
  // closed stages (Disqualified / No Response) stay out of the way unless asked for
  if(!F.closed&&!STAGE_SEL&&F.only!=="closed")rs=rs.filter(r=>!isClosed(r));   // a stage pill always shows its whole stage
  if(F.only==="due")rs=rs.filter(isDue);
  else if(F.only==="today")rs=rs.filter(r=>r.next_follow===todayISO());
  else if(F.only==="nofu")rs=rs.filter(r=>isWorking(r)&&!r.next_follow);
  else if(F.only==="never")rs=rs.filter(neverTouched);
  else if(F.only==="worked")rs=rs.filter(touchedToday);
  else if(F.only==="closed")rs=rs.filter(isClosed);
  else if(F.only==="nophone")rs=rs.filter(r=>!digits(r.phone));
  else if(F.only==="noemail")rs=rs.filter(r=>!r.email);
  else if(F.only==="innm")rs=rs.filter(r=>r.steps&&r.steps.org);
  else if(F.only==="notnm")rs=rs.filter(r=>!(r.steps&&r.steps.org)&&laneOf(r)!=="other");
  else if(F.only==="ready")rs=rs.filter(r=>laneOf(r)==="mine"||laneOf(r)==="incoming");
  else if(F.only==="stale")rs=rs.filter(r=>(daysIn(r.stage_since)||0)>14&&!["Disqualified","Cleared Sub / Active","No Response"].includes(r.stage_label));
  else if(F.only==="pending")rs=rs.filter(r=>r.pending_move);
  if(F.q){
    const q=F.q.toLowerCase(),qd=q.replace(/\D/g,"");
    rs=rs.filter(r=>[r.company,r.contact,r.email,r.city,r.state,r.market,r.market_area,r.yard_city,r.home_city,r.dot,r.hs_owner,r.tags,r.stage_label,r.last_note&&r.last_note.text].some(v=>v&&String(v).toLowerCase().includes(q))||(qd.length>=3&&(digits(r.phone).includes(qd)||digits(r.mobile).includes(qd))));
  }
  const dir=F.dir==="desc"?-1:1;
  const key={
    // attention first: overdue → no follow-up set → later follow-up → active → closed; then longest in stage
    attn:r=>attn(r)*100000+(99999-Math.min(99999,daysIn(r.stage_since)||0)),
    stage:r=>stageRank(r.stage_label)*1000+ (r.company||"").toLowerCase().charCodeAt(0),
    company:r=>(r.company||r.contact||"").toLowerCase(),
    trucks:r=>Number(r.trucks)||0,
    where:r=>whereStr(r).toLowerCase(),
    rec:r=>(r.hs_owner||"").toLowerCase(),
    days:r=>daysIn(r.stage_since)||0,
    check:r=>doneCount(r),
    follow:r=>r.next_follow||"9999",
    notes:r=>r.notes_count||0,
    touch:r=>r.hs_modified||""
  }[F.sort]||(r=>0);
  rs=rs.slice().sort((a,b)=>{const ka=key(a),kb=key(b);if(ka<kb)return -1*dir;if(ka>kb)return 1*dir;return (a.company||"").localeCompare(b.company||"");});
  return rs;
}

      :`<b>CATCH-UP</b><span style="color:var(--green);font-weight:700;">✅ Nobody is waiting — every open sub has a follow-up date</span><div class="bar"><i style="width:${pct}%"></i></div><span><b>${workedN}</b> worked today of ${openN} open</span><span class="kbhint">↑↓ move · Enter open · / search · T talked · N no answer</span>`;}
  if(VIEW==="kanban")renderKanban(rs);else renderList();

// ---- keyboard: ↑/↓ highlight · Enter open · / search · Esc close · T talked · N no answer ----
document.addEventListener("keydown",e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||"";
  if(e.key==="Escape"){if($("mbg").classList.contains("show"))closeModal();else if(tag==="INPUT")document.activeElement.blur();return;}
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA"||$("mbg").classList.contains("show"))return;
  if(VIEW!=="list")return;
  if(e.key==="/"){e.preventDefault();const q=$("fq");if(q)q.focus();return;}
  const rs=filtered().filter(r=>!(F.group&&COLL.has(r.stage_label||"?")));
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();KB=Math.min(rs.length-1,KB+1);renderList();scrollKB();}
  else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();KB=Math.max(0,KB-1);renderList();scrollKB();}
  else if(e.key==="Enter"&&KB>=0&&rs[KB]){openPanel(rs[KB].deal_id);}
  else if((e.key==="t"||e.key==="T")&&KB>=0&&rs[KB]){quick(rs[KB].deal_id,"talked");}
  else if((e.key==="n"||e.key==="N")&&KB>=0&&rs[KB]){quick(rs[KB].deal_id,"noanswer");}
});

async function loadNotes(){

    const el=$("cFeed");if(el)el.innerHTML=rows||`<p style="color:var(--mut);font-size:13px;">No notes yet — the first follow-up you log lives here forever.</p>`;
  }catch(e){const el=$("cFeed");if(el)el.innerHTML=`<p style="color:var(--red);font-size:13px;">Could not load: ${esc(e.message||String(e))}</p>`;}

async function saveNote(){
  if(!CUR)return;let who=author();
  if(!who){changeAuthor();who=author();if(!who)return;}
  const inp=$("cText");const text=(inp.value||"").trim();if(!text)return;
  inp.disabled=true;
  try{
    const j=await(await fetch(`api/recruit/${encodeURIComponent(CUR.deal_id)}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({author:who,text,kind:"call"})})).json();
    if(!j.ok)throw new Error(j.error||"save failed");
    inp.value="";CUR.notes_count=(CUR.notes_count||0)+1;CUR.last_note={ts:j.note.ts,author:who,text};
    loadNotes();render();
  }catch(e){alert("Not saved: "+(e.message||e));}
  finally{inp.disabled=false;const i=$("cText");if(i)i.focus();}

  }catch(e){alert("Move not saved: "+(e.message||e));fetchBoard();}
}
