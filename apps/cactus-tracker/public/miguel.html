<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Safety Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* MIGUEL's report: monthly safety audit for the Texas safety manager (Miguel Campos). English only.
   CKJ independent contractors, the Cactus Express fleet and the KT company trucks. Every group and
   section collapses, and each section has its own checkbox: only the checked ones print / export. */
*{box-sizing:border-box;margin:0;padding:0;}
:root{--road:#4A4F55;--sand:#B89A4E;--stone:#7A7D80;--line:#E5E2DB;--green:#4E8C63;--red:#B0442F;--amber:#8a5a10;--blue:#2456a6;--warm:#FBFAF7;}
body{font-family:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--road);background:#fff;padding:18px 16px 40px;max-width:1080px;margin:0 auto;font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.rephead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--sand);padding-bottom:10px;}
.rephead img{height:46px;width:auto;}
.rephead .rtitle{margin-left:auto;text-align:right;}
.rephead .rtitle b{display:block;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.rephead .rtitle span{font-size:13px;color:var(--stone);font-weight:600;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px;align-items:center;}
.toolbar button,.toolbar a,.toolbar select{border:none;border-radius:10px;padding:11px 15px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-block;}
.toolbar select{background:#eef0f5;color:var(--road);}
.b-pdf{background:var(--road);color:#fff;}
.b-csv{background:var(--sand);color:#2B2D30;}
.b-soft{background:#eef0f5;color:var(--road);}
.selbar{font-size:12.5px;color:var(--stone);margin:0 0 12px;}
.selbar b{color:var(--road);}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--warm);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;}
.filters input[type=search],.filters select{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;background:#fff;color:var(--road);}
.filters input[type=search]{flex:1;min-width:200px;}
.filters label{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer;}
.filters label input{accent-color:var(--sand);width:15px;height:15px;}
.filters .clr{background:#eef0f5;border:none;border-radius:9px;padding:8px 12px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--road);}
.fnote{color:var(--amber);font-weight:700;}
td.rp,th.rp{width:22px;padding-right:4px;}
input.rowpick{width:15px;height:15px;accent-color:var(--sand);cursor:pointer;}
tr.picked td{background:#FBF6E8;}
details.sec>summary .n small{font-weight:600;opacity:.8;}
.bigsum{font-size:15px;line-height:1.7;background:var(--warm);border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:10px;}
.bigsum b.g{color:var(--green);} .bigsum b.r{color:var(--red);} .bigsum b.a{color:var(--amber);} .bigsum b.b{color:var(--blue);}
/* groups + sections (collapsible) */
details.grp{border:1.5px solid var(--line);border-radius:14px;margin:12px 0;background:#fff;}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--sand);border-radius:14px 14px 0 0;background:var(--warm);}
details.grp:not([open])>summary{border-bottom:none;border-radius:14px;}
details.grp>summary::-webkit-details-marker,details.sec>summary::-webkit-details-marker{display:none;}
details.grp>summary .caret,details.sec>summary .caret{display:inline-block;transition:transform .15s;color:var(--sand);font-size:12px;}
details[open]>summary .caret{transform:rotate(90deg);}
details.grp>summary .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--stone);text-transform:none;letter-spacing:0;}
.grpbody{padding:4px 14px 12px;}
details.sec{border-bottom:1px solid var(--line);}
details.sec:last-child{border-bottom:none;}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 0;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
details.sec>summary .n{margin-left:auto;background:var(--road);color:#fff;border-radius:999px;padding:1px 10px;font-size:12px;letter-spacing:0;}
details.sec>summary .n.r{background:var(--red);} details.sec>summary .n.a{background:var(--amber);} details.sec>summary .n.g{background:var(--green);}
input.pick{width:17px;height:17px;accent-color:var(--sand);cursor:pointer;flex-shrink:0;}
.secbody{padding:0 0 12px;}
.hint{font-size:12.5px;color:var(--stone);margin:0 0 8px;line-height:1.5;}
.excluded>summary{opacity:.5;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--stone);padding:4px 10px 4px 0;border-bottom:1px solid var(--line);}
td{padding:6px 10px 6px 0;border-bottom:1px solid #F1EFE9;vertical-align:top;}
tr{page-break-inside:avoid;}
td.num{font-weight:700;white-space:nowrap;}
.idle{color:var(--red);font-weight:700;white-space:nowrap;}
.ok{color:var(--green);font-weight:600;} .no{color:var(--red);font-weight:600;} .mut{color:var(--stone);}
.box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--road);border-radius:3px;vertical-align:-2px;}
.small{font-size:11.5px;color:var(--stone);}
.empty{color:var(--stone);padding:4px 0 8px;}
footer{margin-top:24px;border-top:1.5px solid var(--line);padding-top:8px;color:var(--stone);font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
footer b{color:var(--sand);}
.err{background:#F7EAE6;border:1.5px solid var(--red);color:var(--red);border-radius:12px;padding:12px;}
@page{size:letter landscape;margin:10mm;}
@media print{
  .toolbar,.selbar,.filters,input.pick,.caret,td.rp,th.rp{display:none !important;}
  tr.picked td{background:none;}
  .excluded{display:none !important;}
  body{padding:0;font-size:11px;max-width:none;}
  .rephead img{height:34px;}
  .bigsum{font-size:11.5px;padding:7px 12px;}
  details.grp{border:none;margin:8px 0;}
  details.grp>summary{padding:4px 0;font-size:12.5px;background:none;border-radius:0;}
  .grpbody{padding:0;}
  details.sec>summary{padding:6px 0 3px;font-size:11px;}
  details.sec>summary .n{font-size:10px;}
  .hint{font-size:9.5px;margin-bottom:4px;}
  table{font-size:9.5px;} th{font-size:8px;} td{padding:2px 6px 2px 0;}
  footer{font-size:9px;}
}
</style>
</head>
<body>
<div class="rephead">
  <img src="milestone-supply.png" alt="Milestone Supply">
  <div class="rtitle"><b>Fleet Safety Audit</b><span id="sub">Loading…</span></div>
</div>
<div class="toolbar">
  <button class="b-pdf" onclick="printSelected()">🖨 Print / PDF selected</button>
  <button class="b-csv" onclick="downloadCSV()">⬇ Excel (CSV) selected</button>
  <button class="b-soft" onclick="openAll(true)">⊕ Expand all</button>
  <button class="b-soft" onclick="openAll(false)">⊖ Collapse all</button>
  <button class="b-soft" onclick="pickAll(true)">☑ Select all</button>
  <button class="b-soft" onclick="pickAll(false)">☐ Clear</button>
  <select id="win" onchange="setWin(this.value)" title="Activity window">
    <option value="30">Active = hauled in the last 30 days</option>
    <option value="45">Active = hauled in the last 45 days</option>
    <option value="60">Active = hauled in the last 60 days</option>
  </select>
  <a class="b-soft" href="report.html">← Reports</a>
</div>
<div class="filters" id="filters"></div>
<div class="selbar" id="selbar"></div>
<div id="out"><p class="empty">Loading…</p></div>
<footer id="foot"></footer>
<script>
const qs=new URLSearchParams(location.search);
let days=[30,45,60].includes(Number(qs.get("days")))?Number(qs.get("days")):30;
document.getElementById("win").value=String(days);
let data=null;
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const LSs=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
// unchecked sections are remembered per device; collapsed state too
let OFF=new Set((LS("mg_off","")||"").split("|").filter(Boolean));
let SHUT=new Set((LS("mg_shut","")||"").split("|").filter(Boolean));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mdy=iso=>{if(!iso)return "";const p=String(iso).slice(0,10).split("-");return p.length===3?`${Number(p[1])}/${Number(p[2])}/${p[0].slice(2)}`:iso;};
const en=s=>String(s||"").replace(/SIN DRIVER/ig,"NO DRIVER").replace(/SIN CHOFER/ig,"NO DRIVER").replace(/\(SIN YARD\)/ig,"").trim();
const STATUS={ok:"",shop:"In the shop",down:"Down",no_driver:"No driver",vacation:"Vacation",deleased:"De-leased"};
const byUnit=(a,b)=>String(a.unit).localeCompare(String(b.unit),undefined,{numeric:true});
const idleTxt=r=>r.lastLoad?`${mdy(r.lastLoad)} <span class="idle">· ${r.daysIdle} days idle</span>`:`<span class="idle">no load on record</span>`;
// 🚛 truck / trailer details from Samsara (VIN, year/make/model, plate, gateway + camera serials, trailer)
const sm=r=>r.samsaraMeta||{};
const last6=v=>v?("…"+String(v).slice(-6)):"";
const equip=r=>{const m=sm(r),tr=m.trailer||{};
  const truck=[m.year,m.make,m.model].filter(Boolean).join(" ");
  const ids=[m.vin?"VIN "+last6(m.vin):"",m.plate?"Plate "+m.plate:""].filter(Boolean).join(" · ");
  const trl=(tr.name||tr.plate)?("Trailer "+[tr.name,tr.plate?"plate "+tr.plate:"",[tr.year,tr.make,tr.model].filter(Boolean).join(" ")].filter(Boolean).join(" · ")):(r.trailer?"Trailer type "+r.trailer:"");
  return (truck?esc(truck):'<span class="mut">no make/model in Samsara</span>')+(ids?'<div class="small">'+esc(ids)+'</div>':"")+(trl?'<div class="small">'+esc(trl)+'</div>':"");};
const hw=r=>{const m=sm(r);return [m.gateway?"Gateway "+m.gateway:"",m.camera?"Camera "+m.camera:""].filter(Boolean).map(x=>'<div class="small">'+esc(x)+'</div>').join("");};
const sams=r=>r.samsara?`<span class="ok">Yes</span>${r.lastGps?`<div class="small">last GPS ${esc(mdy(r.lastGps))}</div>`:""}${hw(r)}`:`<span class="no">No unit</span>`;
const stat=r=>[STATUS[r.status]!=null?STATUS[r.status]:r.status,en(r.statusNote)].filter(Boolean).join(" · ");
const drvSeen=r=>(r.driversSeen.length>1?`<b class="no">${r.driversSeen.length} drivers:</b> `:"")+esc(r.driversSeen.join(", ")||"·");
const drvChg=r=>r.driverChanges.length?r.driverChanges.map(c=>`${esc(mdy(c.at))}: ${esc(en(c.from)||"none")} → ${esc(en(c.to)||"none")}`).join("<br>"):'<span class="mut">none</span>';
function setWin(v){days=Number(v)||30;history.replaceState(null,"","?days="+days);load();}

// ---- sections: id, title, hint, rows, table builder ----
const T={
  inactive:(rs)=>`<table><tr><th class="rp"></th><th>Unit</th><th>Truck / trailer (Samsara)</th><th>Company / owner</th><th>Last driver</th><th>Last load</th><th>Samsara</th><th>Notes</th><th>Insurance off</th><th>Camera pulled</th></tr>`+
    rs.map(r=>`<tr${PICK.has(rk(r))?' class="picked"':''}><td class="rp"><input type="checkbox" class="rowpick" data-k="${esc(rk(r))}"${PICK.has(rk(r))?" checked":""} onchange="pickRow(this)"></td><td class="num">${esc(r.unit)}</td><td>${equip(r)}</td><td>${esc(r.company||"·")}</td><td>${esc(en(r.driver)||"·")}</td><td>${idleTxt(r)}</td><td>${sams(r)}</td><td class="small">${esc(stat(r))}</td><td><span class="box"></span></td><td><span class="box"></span></td></tr>`).join("")+`</table>`,
  removed:(rs)=>`<table><tr><th class="rp"></th><th>Unit</th><th>Truck / trailer (Samsara)</th><th>Company / owner</th><th>Last driver</th><th>Last load</th><th>Removed</th><th>Samsara</th><th>Insurance off</th><th>Camera pulled</th></tr>`+
    rs.map(r=>`<tr${PICK.has(rk(r))?' class="picked"':''}><td class="rp"><input type="checkbox" class="rowpick" data-k="${esc(rk(r))}"${PICK.has(rk(r))?" checked":""} onchange="pickRow(this)"></td><td class="num">${esc(r.unit)}</td><td>${equip(r)}</td><td>${esc(r.company||"·")}</td><td>${esc(en(r.driver)||"·")}</td><td>${r.lastLoad?esc(mdy(r.lastLoad)):'<span class="mut">none</span>'}</td><td>${r.removedOn?esc(mdy(r.removedOn)):'<span class="mut">·</span>'}<div class="small">${r.removedBy==="manual"?"by dispatch":r.removedBy==="auto"?"inactive rule":""}</div></td><td>${sams(r)}</td><td><span class="box"></span></td><td><span class="box"></span></td></tr>`).join("")+`</table>`,
  active:(rs)=>`<table><tr><th class="rp"></th><th>Unit</th><th>Truck / trailer (Samsara)</th><th>Company / owner</th><th>Driver</th><th>Phone</th><th>Loads</th><th>Days worked</th><th>Last load</th><th>Drivers who ran it</th><th>Driver changes</th><th>Samsara</th></tr>`+
    rs.map(r=>`<tr${PICK.has(rk(r))?' class="picked"':''}><td class="rp"><input type="checkbox" class="rowpick" data-k="${esc(rk(r))}"${PICK.has(rk(r))?" checked":""} onchange="pickRow(this)"></td><td class="num">${esc(r.unit)}</td><td>${equip(r)}</td><td>${esc(r.company||"·")}</td><td>${esc(en(r.driver)||"·")}</td><td class="small">${esc(r.phone||"")}</td><td>${r.loads}</td><td>${r.daysWorked}</td><td>${esc(mdy(r.lastLoad))}</td><td class="small">${drvSeen(r)}</td><td class="small">${drvChg(r)}</td><td>${sams(r)}</td></tr>`).join("")+`</table>`,
  kt:(rs)=>`<table><tr><th class="rp"></th><th>Unit</th><th>Truck / trailer (Samsara)</th><th>Terminal</th><th>Current driver</th><th>Drivers who ran it</th><th>Driver changes logged</th><th>Loads</th><th>Last load</th><th>Samsara</th></tr>`+
    rs.map(r=>`<tr${PICK.has(rk(r))?' class="picked"':''}><td class="rp"><input type="checkbox" class="rowpick" data-k="${esc(rk(r))}"${PICK.has(rk(r))?" checked":""} onchange="pickRow(this)"></td><td class="num">${esc(r.unit)}</td><td>${equip(r)}</td><td>${esc(r.terminal||"·")}</td><td>${esc(en(r.driver)||"·")}${STATUS[r.status]?`<div class="small">${esc(STATUS[r.status])}</div>`:""}</td><td class="small">${drvSeen(r)}</td><td class="small">${drvChg(r)}</td><td>${r.loads}</td><td>${r.lastLoad?esc(mdy(r.lastLoad)):'<span class="mut">none</span>'}</td><td>${sams(r)}</td></tr>`).join("")+`</table>`
};
// ---- filters (narrow every list) + per-unit checkboxes ("only checked units") ----
const F={q:"",company:"",terminal:"",samsara:"",multi:false,idle:"",only:false};
const PICK=new Set();
const rk=r=>r.group+"|"+r.unit;
function passes(r){
  if(F.only&&!PICK.has(rk(r)))return false;
  if(F.company&&(r.company||"")!==F.company)return false;
  if(F.terminal&&(r.terminal||"")!==F.terminal)return false;
  const m=r.samsaraMeta||{};
  if(F.samsara==="yes"&&!r.samsara)return false;
  if(F.samsara==="no"&&r.samsara)return false;
  if(F.samsara==="cam"&&!m.camera)return false;
  if(F.samsara==="nocam"&&(m.camera||!r.samsara))return false;
  if(F.multi&&!(r.driversSeen.length>1||r.driverChanges.length))return false;
  if(F.idle&&!(r.daysIdle==null||r.daysIdle>=Number(F.idle)))return false;
  if(F.q){
    const q=F.q.toLowerCase();
    const hay=[r.unit,r.company,r.driver,r.terminal,r.phone,m.vin,m.plate,m.make,m.model,m.gateway,m.camera,(m.trailer||{}).name,r.driversSeen.join(" ")].join(" ").toLowerCase();
    if(!hay.includes(q))return false;
  }
  return true;
}
const vis=s=>s.rows.filter(passes);
function filtersOn(){return !!(F.q||F.company||F.terminal||F.samsara||F.multi||F.idle||F.only);}
function filtersTxt(){
  const p=[];
  if(F.q)p.push('search "'+F.q+'"'); if(F.company)p.push("company "+F.company); if(F.terminal)p.push("terminal "+F.terminal);
  if(F.samsara)p.push({yes:"has a Samsara unit",no:"no Samsara unit",cam:"has a camera",nocam:"Samsara but no camera"}[F.samsara]);
  if(F.idle)p.push("idle "+F.idle+"+ days"); if(F.multi)p.push("more than one driver"); if(F.only)p.push("only checked units");
  return p.join(" · ");
}
function setF(k,v){F[k]=v;render();}
function clearF(){Object.assign(F,{q:"",company:"",terminal:"",samsara:"",multi:false,idle:"",only:false});buildFilters();render();}
function pickRow(cb){const k=cb.dataset.k;if(cb.checked)PICK.add(k);else PICK.delete(k);cb.closest("tr").classList.toggle("picked",cb.checked);if(F.only)render();else syncPicks();}
function buildFilters(){
  const all=[...(data.ics||[]),...(data.cactus||[]),...(data.kt||[])];
  const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y)));
  const opt=(arr,cur)=>arr.map(v=>'<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>').join("");
  const sel=(v)=>F.samsara===v?" selected":"";
  document.getElementById("filters").innerHTML=
    '<input type="search" id="fq" placeholder="🔎 Unit, company, driver, VIN, plate, serial…" value="'+esc(F.q)+'" oninput="setF(\'q\',this.value)">'+
    '<select onchange="setF(\'company\',this.value)"><option value="">All companies / owners</option>'+opt(uniq(all.map(r=>r.company)),F.company)+'</select>'+
    '<select onchange="setF(\'terminal\',this.value)"><option value="">All terminals / tabs</option>'+opt(uniq(all.map(r=>r.terminal)),F.terminal)+'</select>'+
    '<select onchange="setF(\'samsara\',this.value)"><option value="">Samsara: any</option><option value="yes"'+sel("yes")+'>Has a Samsara unit</option><option value="no"'+sel("no")+'>No Samsara unit</option><option value="cam"'+sel("cam")+'>Has a camera</option><option value="nocam"'+sel("nocam")+'>Samsara but no camera</option></select>'+
    '<select onchange="setF(\'idle\',this.value)"><option value="">Days idle: any</option>'+[15,30,45,60,90].map(n=>'<option value="'+n+'"'+(String(n)===F.idle?" selected":"")+'>Idle '+n+'+ days</option>').join("")+'</select>'+
    '<label><input type="checkbox"'+(F.multi?" checked":"")+' onchange="setF(\'multi\',this.checked)"> More than one driver</label>'+
    '<label><input type="checkbox"'+(F.only?" checked":"")+' onchange="setF(\'only\',this.checked)"> Only checked units</label>'+
    '<button class="clr" onclick="clearF()">✕ Clear filters</button>';
}
let SECTIONS=[];   // built per load: {id, group, title, hint, rows, kind, color}
function buildSections(){
  const W=data.windowDays;
  const split=(rows)=>({
    active:rows.filter(r=>r.active).sort(byUnit),
    inactive:rows.filter(r=>!r.active&&!r.archived).sort((a,b)=>(b.daysIdle==null?9999:b.daysIdle)-(a.daysIdle==null?9999:a.daysIdle)||byUnit(a,b)),
    removed:rows.filter(r=>r.archived&&r.recentlyRemoved).sort((a,b)=>String(b.removedOn||b.lastLoad).localeCompare(String(a.removedOn||a.lastLoad)))
  });
  const ic=split(data.ics||[]), ca=split(data.cactus||[]);
  const kt=(data.kt||[]).filter(r=>!r.archived).sort(byUnit);
  SECTIONS=[
    {id:"ic-inactive",group:"ic",kind:"inactive",color:"r",rows:ic.inactive,title:"Inactive ICs: remove from insurance and pull the Samsara camera",hint:`Still on the board but no load in the last ${W} days. Confirm with the owner, then take the unit off the insurance policy and pull its Samsara camera / gateway.`},
    {id:"ic-removed",group:"ic",kind:"removed",color:"a",rows:ic.removed,title:"ICs removed from the board (last 90 days): confirm insurance and camera",hint:"Already off the dispatch board. Make sure each one is also off the insurance and has no Samsara camera assigned."},
    {id:"ic-active",group:"ic",kind:"active",color:"g",rows:ic.active,title:"Active ICs: keep on insurance",hint:`Hauled in the last ${W} days. Check that the driver listed matches the insurance and Samsara.`},
    {id:"ca-inactive",group:"ca",kind:"inactive",color:"r",rows:ca.inactive,title:"Inactive Cactus trucks: remove from insurance and pull the Samsara camera",hint:`On the board but no load in the last ${W} days (includes trucks marked de-leased). Confirm with the owner before taking them off.`},
    {id:"ca-removed",group:"ca",kind:"removed",color:"a",rows:ca.removed,title:"Cactus trucks removed from the board (last 90 days): confirm insurance and camera",hint:"Already off the dispatch board. Make sure each one is also off the insurance and has no Samsara camera assigned."},
    {id:"ca-active",group:"ca",kind:"active",color:"g",rows:ca.active,title:"Active Cactus trucks: keep on insurance",hint:`Hauled in the last ${W} days. Drivers who ran each truck and logged driver changes help keep the insurance driver list current.`},
    {id:"kt-rotation",group:"kt",kind:"kt",color:"",rows:kt,title:"KT company trucks: driver rotation",hint:"KT units stay on the insurance (they are not de-leased), but drivers change often. Use this to keep the insurance driver roster and Samsara driver assignments current."}
  ];
}
const GROUPS=[["ic","CKJ independent contractors"],["ca","Cactus Express fleet"],["kt","KT company trucks"]];

async function load(){
  document.getElementById("out").innerHTML=`<p class="empty">Loading…</p>`;
  try{
    const r=await fetch(`./api/report/ic-audit?days=${days}`);
    if(r.status===401){location.href="login.html";return;}
    if(!r.ok)throw new Error("HTTP "+r.status);
    data=await r.json();
    buildFilters();
    render();
  }catch(e){
    document.getElementById("out").innerHTML=`<div class="err">Could not load: ${esc(e.message)}. Check the connection and refresh.</div>`;
  }
}
function render(){
  buildSections();
  const S=id=>SECTIONS.find(s=>s.id===id);
  const month=new Date(data.today+"T12:00:00Z").toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
  document.getElementById("sub").textContent=`${month} · prepared ${mdy(data.today)} for Miguel Campos, Texas Safety`;
  document.title=`Fleet Safety Audit ${data.today}`;
  const ktRot=S("kt-rotation").rows.filter(r=>r.driversSeen.length>1||r.driverChanges.length).length;
  let h=`<div class="bigsum">
    <b>CKJ independent contractors:</b> <b class="g">${S("ic-active").rows.length} active</b> · <b class="r">${S("ic-inactive").rows.length} inactive, action needed</b> · <b class="a">${S("ic-removed").rows.length} removed in the last 90 days</b>.<br>
    <b>Cactus Express fleet:</b> <b class="g">${S("ca-active").rows.length} active</b> · <b class="r">${S("ca-inactive").rows.length} inactive, action needed</b> · <b class="a">${S("ca-removed").rows.length} removed in the last 90 days</b>.<br>
    <b>KT company trucks:</b> <b class="b">${S("kt-rotation").rows.length} in service</b> · ${ktRot} had more than one driver or a driver change.<br>
    ${filtersOn()?'<b class="a">Filtered view: '+esc(filtersTxt())+'</b><br>':''}<span class="small">"Active" means the unit hauled at least one load since ${mdy(data.cutoff)} (${data.windowDays} days). Loads and drivers come from NewMile; Samsara status from the Samsara account. Insurance status is not tracked here; use the checkboxes.</span></div>`;
  for(const [g,label] of GROUPS){
    const secs=SECTIONS.filter(s=>s.group===g);
    const total=secs.reduce((n,s)=>n+vis(s).length,0);
    h+=`<details class="grp" data-grp="${g}"${SHUT.has("g:"+g)?"":" open"}>
      <summary><span class="caret">▶</span><input type="checkbox" class="pick gpick" data-grp="${g}" onclick="event.stopPropagation()" onchange="pickGroup('${g}',this.checked)"> ${esc(label)}<span class="cnt">${total} unit${total===1?"":"s"}</span></summary>
      <div class="grpbody">`+
      secs.map(s=>`<details class="sec" data-sec="${s.id}"${SHUT.has(s.id)?"":" open"}>
        <summary><span class="caret">▶</span><input type="checkbox" class="pick spick" data-sec="${s.id}" onclick="event.stopPropagation()" onchange="pickSec('${s.id}',this.checked)"> ${esc(s.title)}<span class="n ${s.color}">${vis(s).length}${vis(s).length!==s.rows.length?'<small> of '+s.rows.length+'</small>':''}</span></summary>
        <div class="secbody"><p class="hint">${esc(s.hint)}</p>${vis(s).length?T[s.kind](vis(s)):'<p class="empty">'+(s.rows.length?'No units match the filters.':'Nothing in this list.')+'</p>'}</div></details>`).join("")+
      `</div></details>`;
  }
  document.getElementById("out").innerHTML=h;
  // remember collapse state
  document.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{const k=d.dataset.sec||("g:"+d.dataset.grp);if(d.open)SHUT.delete(k);else SHUT.add(k);LSs("mg_shut",[...SHUT].join("|"));}));
  syncPicks();
  document.getElementById("foot").innerHTML=`<span><b>MILESTONE SUPPLY</b> · CKJ Transport · Cactus Express · monthly safety audit</span>
    <span>Prepared ${esc(new Date().toLocaleString("en-US",{month:"numeric",day:"numeric",year:"2-digit",hour:"numeric",minute:"2-digit"}))}</span>`;
}
// ---- selection ----
function syncPicks(){
  document.querySelectorAll("input.spick").forEach(cb=>{const on=!OFF.has(cb.dataset.sec);cb.checked=on;cb.closest("details.sec").classList.toggle("excluded",!on);});
  for(const [g] of GROUPS){
    const secs=SECTIONS.filter(s=>s.group===g), on=secs.filter(s=>!OFF.has(s.id)).length;
    const cb=document.querySelector(`input.gpick[data-grp="${g}"]`); if(cb){cb.checked=on===secs.length;cb.indeterminate=on>0&&on<secs.length;}
    const d=document.querySelector(`details.grp[data-grp="${g}"]`); if(d)d.classList.toggle("excluded",on===0);
  }
  LSs("mg_off",[...OFF].join("|"));
  const picked=SECTIONS.filter(s=>!OFF.has(s.id));
  document.getElementById("selbar").innerHTML=`Printing / exporting <b>${picked.length} of ${SECTIONS.length}</b> sections · <b>${picked.reduce((n,s)=>n+vis(s).length,0)}</b> units${filtersOn()?'<span class="fnote"> · filtered: '+esc(filtersTxt())+'</span>':''}${PICK.size?' · <b>'+PICK.size+'</b> checked':''}. Uncheck a section to leave it out; click a title to expand or collapse it.`;
}
function pickSec(id,on){if(on)OFF.delete(id);else OFF.add(id);syncPicks();}
function pickGroup(g,on){SECTIONS.filter(s=>s.group===g).forEach(s=>{if(on)OFF.delete(s.id);else OFF.add(s.id);});syncPicks();}
function pickAll(on){SECTIONS.forEach(s=>{if(on)OFF.delete(s.id);else OFF.add(s.id);});syncPicks();}
function openAll(on){document.querySelectorAll("details").forEach(d=>{d.open=on;});}
// print = only the checked sections, all of them expanded; collapse state comes back afterwards
let _restore=null;
function expandForPrint(){if(_restore)return;_restore=[...document.querySelectorAll("details")].map(d=>[d,d.open]);document.querySelectorAll("details").forEach(d=>{if(!d.classList.contains("excluded"))d.open=true;});}
function restoreAfterPrint(){if(!_restore)return;_restore.forEach(([d,o])=>{d.open=o;});_restore=null;}
window.addEventListener("beforeprint",expandForPrint);
window.addEventListener("afterprint",restoreAfterPrint);
function printSelected(){
  if(!SECTIONS.some(s=>!OFF.has(s.id))){alert("Select at least one section to print.");return;}
  expandForPrint();setTimeout(()=>{window.print();},50);
}
function downloadCSV(){
  if(!data)return;
  const picked=SECTIONS.filter(s=>!OFF.has(s.id));
  if(!picked.length){alert("Select at least one section to export.");return;}
  const GL={ic:"CKJ IC",ca:"Cactus",kt:"KT"};
  const cols=["Group","Section","Unit","Company / owner","Terminal","Driver","Phone","Status","Active","Last load","Days idle","Loads (window)","Days worked","Drivers who ran it","Driver changes","Removed from board","Samsara unit","Last GPS","VIN","Year","Make","Model","Plate","Gateway serial","Camera serial","Trailer (Samsara)","Trailer plate","Trailer type (NewMile)"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const lines=[cols.map(q).join(",")];
  for(const s of picked)for(const r of vis(s))lines.push([GL[s.group],s.title,r.unit,r.company,r.terminal,en(r.driver),r.phone,stat(r)||"OK",r.active?"Yes":"No",r.lastLoad,r.daysIdle==null?"":r.daysIdle,r.loads,r.daysWorked,r.driversSeen.join("; "),r.driverChanges.map(c=>c.at+": "+(c.from||"none")+" > "+(c.to||"none")).join("; "),r.removedOn,r.samsara?"Yes":"No",r.lastGps?String(r.lastGps).slice(0,10):"",sm(r).vin,sm(r).year,sm(r).make,sm(r).model,sm(r).plate,sm(r).gateway,sm(r).camera,(sm(r).trailer||{}).name,(sm(r).trailer||{}).plate,r.trailer].map(q).join(","));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Fleet-safety-audit-${data.today}.csv`;document.body.appendChild(a);a.click();a.remove();
}
load();
</script>
</body>
</html>
